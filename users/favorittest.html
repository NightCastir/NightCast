<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NightCast - Favorites Test</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6f8;font-family:Tahoma,Arial,sans-serif;color:#17202a}
main{max-width:700px;margin:auto;padding:18px}
.card{background:#fff;padding:20px;border-radius:16px;margin-bottom:15px;box-shadow:0 4px 18px #0001}
h1{font-size:21px;margin-top:0}
h2{font-size:17px}
label{display:block;font-weight:bold;margin:12px 0 6px}
input{width:100%;padding:12px;border:1px solid #ccd2d8;border-radius:9px;font-size:14px}
button{width:100%;padding:13px;margin-top:10px;border:0;border-radius:9px;background:#202832;color:white;font-size:14px;cursor:pointer}
button:disabled{opacity:.5}
.result{padding:13px;border-radius:10px;margin-top:12px;white-space:pre-wrap;word-break:break-word}
.ok{background:#d3f9d8}.err{background:#ffe3e3}
pre{direction:ltr;text-align:left;background:#111827;color:#e5e7eb;padding:13px;border-radius:10px;overflow:auto}
small{color:#66717c}
</style>
</head>
<body>
<main>

<div class="card">
<h1>❤️ تست API علاقه‌مندی‌های NightCast</h1>
<p>این فایل <b>فقط API علاقه‌مندی‌ها</b> را تست می‌کند.</p>
<small>هیچ بخش دیگری از Worker در این تست بررسی نمی‌شود.</small>
</div>

<div class="card">
<label>Worker URL</label>
<input id="worker" placeholder="آدرس Worker را وارد کنید">

<label>Token کاربر</label>
<input id="token" placeholder="NightCastToken">

<label>User ID</label>
<input id="userId" type="number" placeholder="مثلاً 1">

<label>Podcast ID</label>
<input id="podcastId" type="number" placeholder="مثلاً 5">
</div>

<div class="card">
<h2>۱. دریافت علاقه‌مندی‌های کاربر</h2>

<button onclick="run('GET_FAVORITES')">
📋 دریافت علاقه‌مندی‌ها
</button>

<button onclick="run('GET_STATUS')">
🔎 بررسی وضعیت یک پادکست
</button>
</div>

<div class="card">
<h2>۲. تغییر علاقه‌مندی</h2>

<button onclick="run('ADD')">
❤️ افزودن پادکست به علاقه‌مندی‌ها
</button>

<button onclick="run('REMOVE')">
💔 حذف پادکست از علاقه‌مندی‌ها
</button>
</div>

<div class="card">
<h2>نتیجه تست</h2>
<div id="result" class="result">هنوز تستی انجام نشده.</div>
<pre id="json">{}</pre>
</div>

</main>

<script>
function value(id){
    return document.getElementById(id).value.trim();
}

function base(){
    return value("worker").replace(/\/+$/,"");
}

function authHeaders(){
    const token=value("token");

    const headers={
        "Content-Type":"application/json"
    };

    if(token){
        headers.Authorization="Bearer "+token;
    }

    return headers;
}

async function request(path,method="GET",body=null){

    if(!base()){
        throw new Error("Worker URL وارد نشده است.");
    }

    const options={
        method,
        headers:authHeaders()
    };

    if(body!==null){
        options.body=JSON.stringify(body);
    }

    const response=await fetch(base()+path,options);

    const text=await response.text();

    let data;

    try{
        data=JSON.parse(text);
    }
    catch{
        data={raw:text};
    }

    return {
        ok:response.ok,
        status:response.status,
        path,
        data
    };
}

function show(result){

    const box=document.getElementById("result");

    box.className="result "+(result.ok?"ok":"err");

    box.textContent=
        (result.ok?"✅ موفق":"❌ خطا")
        +" | HTTP "
        +result.status
        +"\n"
        +result.path;

    document.getElementById("json").textContent=
        JSON.stringify(result.data,null,2);
}

async function run(type){

    const userId=value("userId");
    const podcastId=value("podcastId");

    try{

        let result;

        /*
        ==================================================
        مسیرهای فعلی API علاقه‌مندی
        ==================================================
        */

        if(type==="GET_FAVORITES"){

            result=await request(
                "/api/v1/public/favorites",
                "GET"
            );

        }

        else if(type==="GET_STATUS"){

            if(!podcastId){
                throw new Error("Podcast ID را وارد کنید.");
            }

            result=await request(
                "/api/v1/public/favorites/"
                +podcastId,
                "GET"
            );

        }

        else if(type==="ADD"){

            if(!podcastId){
                throw new Error("Podcast ID را وارد کنید.");
            }

            result=await request(
                "/api/v1/public/favorites",
                "POST",
                {
                    podcast_id:Number(podcastId)
                }
            );

        }

        else if(type==="REMOVE"){

            if(!podcastId){
                throw new Error("Podcast ID را وارد کنید.");
            }

            result=await request(
                "/api/v1/public/favorites/"
                +podcastId,
                "DELETE"
            );

        }

        show(result);

    }
    catch(error){

        show({
            ok:false,
            status:"-",
            path:"-",
            data:{
                error:error.message
            }
        });

    }
}
</script>

</body>
</html>
