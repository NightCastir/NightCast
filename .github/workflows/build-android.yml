name: Build NightCast Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug + Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Create clean capacitor.config.json
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "ir.nightcast.app",
            "appName": "NightCast",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            },
            "android": {
              "allowMixedContent": true,
              "backgroundColor": "#050a16"
            },
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 0,
                "launchAutoHide": true,
                "backgroundColor": "#050a16",
                "splashFullScreen": true,
                "splashImmersive": true
              },
              "StatusBar": {
                "style": "DARK",
                "backgroundColor": "#050a16"
              }
            }
          }
          EOF

      - name: Prepare www folder
        run: |
          rm -rf www
          mkdir -p www
          cp index.html manifest.json service-worker.js sw.js style.css app.js favicon.ico favicon.png logo.png www/ 2>/dev/null || true
          cp -r css js assets auth users www/ 2>/dev/null || true
          cp -r .well-known www/ 2>/dev/null || true
          find . -maxdepth 1 -name "*.html" ! -name "index.html" -exec cp {} www/ \; 2>/dev/null || true
          ls -la www/

      - name: Add Android platform
        run: |
          rm -rf android
          npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Decode Keystore
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > nightcast-release.keystore
            echo "Keystore decoded successfully"
            ls -lh nightcast-release.keystore
          else
            echo "No keystore secret found"
          fi

      - name: Build Release APK
        run: |
          if [ -f "nightcast-release.keystore" ]; then
            echo "Building signed Release APK..."
            cd android
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$(pwd)/../nightcast-release.keystore" \
              -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
              -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
              -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}" \
              --stacktrace
          else
            echo "Building unsigned Release APK..."
            cd android
            ./gradlew assembleRelease --stacktrace
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NightCast-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NightCast-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: List built APKs
        run: |
          echo "=== Built APKs ==="
          find android/app/build/outputs/apk -name "*.apk" -exec ls -lh {} \; || true
