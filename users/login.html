<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
NightCast | ورود
</title>


<meta name="theme-color" content="#0b1220">


<link rel="stylesheet" href="css/core.css">

<link rel="stylesheet" href="css/login.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


</head>



<body data-theme="dark">



<!-- =========================
AUTH LOADER
========================= -->


<div id="authLoader" class="auth-loader hidden">


<div class="loader-box">


<div class="loader-circle"></div>


<h3>
NightCast
</h3>


<p id="loaderText">

در حال اتصال...

</p>


</div>


</div>







<!-- =========================
LOGIN PAGE
========================= -->


<main class="login-page">






<section class="login-card">







<!-- BRAND -->

<div class="login-brand">


<div class="brand-icon">

<i class="fa-solid fa-radio"></i>

</div>



<h1>

Night<span>Cast</span>

</h1>



<p>

رادیوی تجربه، یادگیری و رشد فردی

</p>


</div>









<!-- MESSAGE -->


<div class="login-message">


<h2>

خوش آمدید

</h2>



<p>

برای تجربه کامل NightCast وارد شوید  
یا بدون حساب ادامه دهید.

</p>


</div>









<!-- OPENID BUTTON -->


<button

id="openIdLogin"

class="login-openid"

type="button">


<i class="fa-brands fa-google"></i>


<span>

ورود با Google

</span>


</button>








<div class="divider">


<span>

یا

</span>


</div>








<!-- GUEST LOGIN -->


<button

id="guestLogin"

class="login-guest"

type="button">


<i class="fa-solid fa-headphones"></i>


<span>

ادامه به عنوان مهمان

</span>


</button>









<!-- STATUS MESSAGE -->


<div

id="loginMessage"

class="login-status">


</div>









<!-- FEATURES -->


<div class="login-features">






<div class="feature">


<i class="fa-solid fa-cloud"></i>


<span>

ذخیره تاریخچه شنیدن

</span>


</div>







<div class="feature">


<i class="fa-solid fa-download"></i>


<span>

دانلود پادکست‌ها

</span>


</div>







<div class="feature">


<i class="fa-solid fa-heart"></i>


<span>

کتابخانه شخصی

</span>


</div>






</div>









<!-- FOOTER -->


<footer class="login-footer">


<p>

با ورود به NightCast قوانین استفاده را می‌پذیرید.

</p>


</footer>








</section>






</main>








<script src="js/login.js"></script>



</body>


</html>
