<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
NightCast Dashboard
</title>


<style>


body{

margin:0;

font-family:tahoma,Arial;

background:#111;

color:white;

}


.container{

max-width:900px;

margin:40px auto;

padding:20px;

}



.card{

background:#222;

padding:25px;

border-radius:15px;

box-shadow:0 10px 30px #0005;

margin-bottom:20px;

}



h1{

text-align:center;

}



.info{

font-size:18px;

line-height:2;

}



button{

background:#c0392b;

color:white;

border:0;

padding:12px 25px;

border-radius:8px;

cursor:pointer;

font-size:16px;

}



#message{

text-align:center;

margin-top:20px;

color:#ffcc00;

}


</style>


</head>



<body>



<div class="container">


<div class="card">


<h1>
پنل مدیریت NightCast
</h1>


<div id="message">

در حال بررسی دسترسی...

</div>


</div>



<div 
class="card"
id="adminBox"
style="display:none"
>


<h2>
اطلاعات مدیر
</h2>


<div class="info">


<div>
نام کاربری:
<span id="username"></span>
</div>


<div>
نام:
<span id="fullname"></span>
</div>


</div>


<br>


<button onclick="logout()">

خروج

</button>



</div>



</div>

<script>


const API =

"https://nightcast-api.tomasgermany2580.workers.dev";




async function checkSession(){



const token =

sessionStorage.getItem(
"NightCastSession"
);




if(!token){


window.location.href="login.html";

return;


}





try{


const response =

await fetch(

API + "/api/admin/me",

{

method:"GET",

headers:{

"Authorization":

"Bearer " + token

}

}

);





const data =

await response.json();





console.log(
"SESSION CHECK:",
data
);






if(data.logged){



document.getElementById("message")

.innerHTML=

"ورود تایید شد";




document.getElementById("adminBox")

.style.display="block";




document.getElementById("username")

.innerHTML=

data.admin.username;




document.getElementById("fullname")

.innerHTML=

data.admin.full_name || "";





}

else{


sessionStorage.removeItem(

"NightCastSession"

);



window.location.href="login.html";


}



}

catch(error){


console.error(

error

);


document.getElementById("message")

.innerHTML=

"خطا در ارتباط با سرور";


}



}






async function logout(){



const token =

sessionStorage.getItem(

"NightCastSession"

);




await fetch(

API + "/api/admin/logout",

{

method:"POST",

headers:{

"Authorization":

"Bearer " + token

}

}

);




sessionStorage.removeItem(

"NightCastSession"

);



window.location.href="login.html";



}






checkSession();



  </script>

  
</body>

</html>
