<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
NightCast API Diagnostic
</title>


<style>

body{

font-family:
Tahoma,
Arial;

background:#f5f5f5;

padding:20px;

direction:rtl;

}



h1{

color:#6c5ce7;

}



.card{

background:white;

border-radius:12px;

padding:20px;

margin-bottom:20px;

box-shadow:
0 5px 20px rgba(0,0,0,.08);

}



.ok{

color:green;

font-weight:bold;

}


.error{

color:red;

font-weight:bold;

}


.warning{

color:#e67e22;

font-weight:bold;

}



pre{

background:#111;

color:#0f0;

padding:15px;

border-radius:10px;

overflow:auto;

direction:ltr;

text-align:left;

}



button{


padding:12px 20px;

border:none;

background:#6c5ce7;

color:white;

border-radius:8px;

cursor:pointer;


}



table{

width:100%;

border-collapse:collapse;

}



td,th{

border:1px solid #ddd;

padding:8px;

}


</style>


</head>


<body>



<h1>
NightCast Ver4 API Diagnostic
</h1>




<div class="card">

<h3>
وضعیت Token
</h3>


<div id="tokenStatus">

در حال بررسی...

</div>


</div>





<div class="card">

<button onclick="runTests()">

شروع تست کامل

</button>

</div>






<div id="results"></div>









<script>


const API_URL =

"https://nightcast-api.tomasgermany2580.workers.dev/api/v1";





const token =

localStorage.getItem(

"NightCastToken"

);






function addResult(

title,

status,

content

){


const box =

document.createElement(

"div"

);


box.className="card";



box.innerHTML = `


<h3>

${title}

</h3>


<p class="${status}">

${status==="ok"

?

"✔ موفق"

:

"✖ خطا"

}

</p>


<pre>

${content}

</pre>


`;



document
.getElementById("results")
.appendChild(box);



}









function showToken(){



const area =

document.getElementById(

"tokenStatus"

);




if(token){



area.innerHTML = `


<p class="ok">

Token موجود است

</p>


<pre>

${token}

</pre>


`;



}

else{


area.innerHTML = `


<p class="error">

Token وجود ندارد

</p>


`;


}



}





async function request(

endpoint

){


const start =

Date.now();




try{



const response =

await fetch(

API_URL+endpoint,

{


headers:{


"Authorization":

"Bearer "+token,


"Content-Type":

"application/json"


}


}

);






const time =

Date.now()-start;






const text =

await response.text();






let data;



try{


data =

JSON.parse(text);


}

catch{


data=text;


}






return {


ok:

response.ok,


status:

response.status,


time,


data


};





}

catch(error){



return {


ok:false,


error:error.message



};



}



}







async function runTests(){


document
.getElementById("results")
.innerHTML="";



addResult(

"شروع تست",

"ok",

"شروع شد"

);





await testEndpoint(

"/auth/me"

);



await testEndpoint(

"/podcasts"

);



await testEndpoint(

"/admin/dashboard"

);



await testEndpoint(

"/admin/dashboard/latest"

);



await testEndpoint(

"/books"

);



await testEndpoint(

"/users"

);



}









async function testEndpoint(

endpoint

){



const result =

await request(

endpoint

);






if(result.error){



addResult(

endpoint,

"error",

result.error

);


return;


}





let extra="";




if(

endpoint==="/podcasts"

&&

result.data.podcasts

){


extra +=

"\n\n تعداد پادکست‌ها: "

+

result.data.podcasts.length;



}






addResult(

endpoint+

" | HTTP "+

result.status+

" | "

+

result.time+

" ms",

result.ok?

"ok":

"error",

JSON.stringify(

result.data,

null,

2

)

+

extra

);



}







showToken();



</script>



</body>

  </html>
