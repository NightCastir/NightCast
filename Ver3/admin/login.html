<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NightCast Login</title>

</head>


<body>


<h2>
ورود به پنل مدیریت NightCast
</h2>


<form id="loginForm">


<div>

<label>
نام کاربری:
</label>

<br>

<input 
id="username"
type="text"
value=""
>

</div>


<br>


<div>

<label>
رمز عبور:
</label>

<br>

<input 
id="password"
type="password"
value=""
>

</div>


<br>


<button type="submit">

ورود

</button>


</form>



<p id="message"></p>



<script>


const API_URL =

"https://nightcast-api.tomasgermany2580.workers.dev/api/v1";





document

.getElementById("loginForm")

.addEventListener(

"submit",

async function(e){


e.preventDefault();



const username =

document

.getElementById("username")

.value;



const password =

document

.getElementById("password")

.value;



document

.getElementById("message")

.innerHTML =

"در حال بررسی...";




try{


const response =

await fetch(

API_URL + "/auth/login",

{


method:"POST",


headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

username:username,

password:password

})


}

);





const data =

await response.json();





console.log(data);





if(data.success){


localStorage.setItem(

"NightCastToken",

data.token

);



document

.getElementById("message")

.innerHTML =

"ورود موفق";



setTimeout(()=>{


location.href="dashboard.html";


},1000);



}

else{


document

.getElementById("message")

.innerHTML =

data.message;



}



}


catch(error){



document

.getElementById("message")

.innerHTML =

error.message;



}



}


);


</script>


</body>

</html>
