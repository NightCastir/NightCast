name: NightCast Club Lifecycle and Admin Console Acceptance

on:
  push:
    branches:
      - main
      - feat/nightcast-club-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle-admin:
    name: Mission lifecycle, reward fulfillment, and admin console
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify lifecycle and admin authorization contract
        run: node tests/club-lifecycle-admin-acceptance.cjs
      - name: Verify route authorization and atomic redemption guards
        run: node tests/club-api-acceptance.cjs
      - name: Check admin console and Worker module syntax
        run: |
          node --check js/club-admin.js
          node --check workers/club-api.js
      - name: Verify schema and trigger acceptance
        run: node tests/club-schema-acceptance.cjs
