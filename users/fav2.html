<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NightCast Favorites Test</title>
<style>
body{font-family:tahoma,Arial;background:#111;color:#eee;padding:20px;margin:0}
.container{max-width:900px;margin:auto}
h1{text-align:center;color:#00d4ff}
.card{background:#1c1c1c;border-radius:14px;padding:20px;margin-bottom:20px;box-shadow:0 0 15px rgba(0,0,0,.45)}
label{display:block;margin-top:12px;margin-bottom:6px}
input{width:100%;box-sizing:border-box;padding:12px;background:#222;border:1px solid #444;color:#fff;border-radius:8px}
button{width:100%;padding:14px;border:0;border-radius:9px;background:#007bff;color:#fff;font-size:16px;font-weight:bold;cursor:pointer;margin-top:15px}
button:disabled{opacity:.5;cursor:not-allowed}
pre{background:#000;padding:15px;border-radius:10px;direction:ltr;text-align:left;overflow:auto;white-space:pre-wrap;min-height:300px}
.ok{color:#00ff88}.bad{color:#ff5555}.warn{color:#ffd369}
.small{color:#aaa;font-size:13px;line-height:1.8}
</style>
</head>
<body>
<div class="container">

<h1>🎙 NightCast Favorites Test</h1>

<div class="card">
<h2>اطلاعات تست</h2>

<label>Username</label>
<input id="username" placeholder="نام کاربری واقعی">

<label>Password</label>
<input id="password" type="password" placeholder="رمز عبور">

<label>Podcast ID</label>
<input id="podcastId" type="number" value="1" min="1">

<p class="small">
این تست از Login واقعی کاربر استفاده می‌کند و Token را فقط برای همین تست در حافظه نگه می‌دارد.
</p>

<button id="runButton" onclick="runAllTests()">
🚀 اجرای کامل تست Favorites
</button>
</div>

<div class="card">
<h2>نتیجه</h2>
<pre id="output">آماده تست...</pre>
</div>

</div>

<script>

const API_URL =
"https://nightcast-api.tomasgermany2580.workers.dev/api/v1";

let token = null;

function log(text){
    document.getElementById("output").textContent += text + "\n";
}

function clearLog(){
    document.getElementById("output").textContent = "";
}

async function request(endpoint, options = {}){

    const response = await fetch(
        API_URL + endpoint,
        options
    );

    let data;

    try{
        data = await response.json();
    }
    catch{
        data = {
            success:false,
            message:"Invalid JSON response"
        };
    }

    return {
        http: response.status,
        data
    };
}

function authHeaders(){
    return {
        "Content-Type":"application/json",
        "Authorization":"Bearer " + token
    };
}

async function runAllTests(){

    const button =
        document.getElementById("runButton");

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const podcastId =
        document.getElementById("podcastId").value.trim();

    if(!username || !password || !podcastId){

        alert("Username، Password و Podcast ID را کامل وارد کن.");
        return;
    }

    button.disabled = true;
    clearLog();

    try{

        log("========================================");
        log("NIGHTCAST FAVORITES TEST");
        log("========================================");
        log("");

        // 1
        log("1) تست اتصال Worker");

        let r = await request("/test");

        log("HTTP " + r.http);
        log(JSON.stringify(r.data,null,2));
        log("");

        if(!r.data.success){
            throw new Error("Worker connection failed");
        }

        // 2
        log("2) ورود کاربر تست");

        r = await request(
            "/public/login",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    username:username,
                    password:password
                })
            }
        );

        log("HTTP " + r.http);
        log(JSON.stringify(r.data,null,2));
        log("");

        if(!r.data.success || !r.data.token){

            throw new Error(
                "Login failed. اطلاعات کاربر را بررسی کن."
            );
        }

        token = r.data.token;

        log("✔ Token دریافت شد");
        log("");

        // 3
        log("3) دریافت علاقه‌مندی‌های فعلی کاربر");

        r = await request(
            "/public/favorites",
            {
                method:"GET",
                headers:authHeaders()
            }
        );

        log("HTTP " + r.http);
        log(JSON.stringify(r.data,null,2));
        log("");

        if(r.http !== 200 || !r.data.success){

            throw new Error(
                "Unable to load favorites"
            );
        }

        // 4
        log("4) بررسی وضعیت Podcast " + podcastId);

        r = await request(
            "/public/favorites/check/" + encodeURIComponent(podcastId),
            {
                method:"GET",
                headers:authHeaders()
            }
        );

        log("HTTP " + r.http);
        log(JSON.stringify(r.data,null,2));
        log("");

        if(r.http !== 200 || !r.data.success){

            throw new Error(
                "Favorite check failed"
            );
        }

        // 5
        log("5) افزودن Podcast " + podcastId + " به علاقه‌مندی‌ها");

        r = await request(
            "/public/favorites/" + encodeURIComponent(podcastId),
            {
                method:"POST",
                headers:authHeaders()
            }
        );

        log("HTTP " + r.http);
        log(JSON.stringify(r.data,null,2));
        log("");

        if(r.http !== 200 || !r.data.success){

            throw new Error(
                "Add favorite failed"
            );
        }

        // 6
        log("6) بررسی مجدد بعد از افزودن");

        r = await request(
            "/public/favorites/check/" + encodeURIComponent(podcastId),
            {
                method:"GET",
                headers:authHeaders()
            }
        );

        log("HTTP " + r.http);
        log(JSON.stringify(r.data,null,2));
        log("");

        if(
            r.http !== 200 ||
            !r.data.success ||
            r.data.favorite !== true
        ){

            throw new Error(
                "Favorite was not confirmed after adding"
            );
        }

        // 7
        log("7) حذف Podcast " + podcastId + " از علاقه‌مندی‌ها");

        r = await request(
            "/public/favorites/" + encodeURIComponent(podcastId),
            {
                method:"DELETE",
                headers:authHeaders()
            }
        );

        log("HTTP " + r.http);
        log(JSON.stringify(r.data,null,2));
        log("");

        if(r.http !== 200 || !r.data.success){

            throw new Error(
                "Remove favorite failed"
            );
        }

        // 8
        log("8) بررسی نهایی");

        r = await request(
            "/public/favorites/check/" + encodeURIComponent(podcastId),
            {
                method:"GET",
                headers:authHeaders()
            }
        );

        log("HTTP " + r.http);
        log(JSON.stringify(r.data,null,2));
        log("");

        if(
            r.http !== 200 ||
            !r.data.success ||
            r.data.favorite !== false
        ){

            throw new Error(
                "Favorite was not removed correctly"
            );
        }

        // 9
        log("9) دریافت نهایی لیست علاقه‌مندی‌ها");

        r = await request(
            "/public/favorites",
            {
                method:"GET",
                headers:authHeaders()
            }
        );

        log("HTTP " + r.http);
        log(JSON.stringify(r.data,null,2));
        log("");

        if(r.http !== 200 || !r.data.success){

            throw new Error(
                "Final favorites list failed"
            );
        }

        log("========================================");
        log("✅ TEST PASSED");
        log("========================================");
        log("");
        log(
            "Worker + Login + Favorites GET + Check + Add + Delete"
        );
        log("همگی با موفقیت تست شدند.");

    }
    catch(error){

        log("========================================");
        log("❌ TEST FAILED");
        log("========================================");
        log("");
        log(error.message);

    }
    finally{

        token = null;
        button.disabled = false;

    }
}

</script>

</body>
</html>
