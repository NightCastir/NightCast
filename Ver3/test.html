
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NightCast Test</title>


<style>

*{

box-sizing:border-box;
font-family:tahoma,Arial;

}


body{

margin:0;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#111827;

}


.box{

width:90%;
max-width:400px;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 10px 30px #0005;

}


h1{

text-align:center;
color:#111827;

}


p{

text-align:center;
color:#666;

}


label{

display:block;
margin-top:15px;
margin-bottom:5px;

}


input{

width:100%;
padding:12px;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;

}


button{

margin-top:25px;
width:100%;
padding:13px;
background:#2563eb;
color:white;
border:0;
border-radius:8px;
font-size:17px;
cursor:pointer;

}


#result{

margin-top:20px;
padding:10px;
border-radius:8px;
text-align:center;

}


.success{

background:#dcfce7;
color:#166534;

}


.error{

background:#fee2e2;
color:#991b1b;

}


.info{

background:#dbeafe;
color:#1e40af;

}


</style>

</head>


<body>


<div class="box">


<h1>
NightCast
</h1>


<p>
تست فرم ورود
</p>



<label>
نام کاربری
</label>


<input 
id="username"
type="text"
placeholder="hamed">



<label>
رمز عبور
</label>


<input
id="password"
type="password"
placeholder="رمز عبور">



<button onclick="loginTest()">

ورود

</button>



<div id="result">

</div>



</div>





<script>


function loginTest(){


let username =
document.getElementById("username").value.trim();


let password =
document.getElementById("password").value;



let result =
document.getElementById("result");




if(!username || !password){


result.className="error";

result.innerHTML=

"لطفاً همه فیلدها را پر کنید";


return;

}





result.className="info";


result.innerHTML=

"اطلاعات دریافت شد<br><br>"+
"Username: "+username+
"<br>"+
"Password: "+password;



}



</script>


</body>

</html>
