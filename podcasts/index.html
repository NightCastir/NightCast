<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta http-equiv="refresh" content="0;url=/">
  <link rel="canonical" href="https://nightcast.ir/">
  <title>NightCast | آرشیو پادکست‌ها</title>
  <script>
    (function () {
      "use strict";
      // Compatibility route for bookmarks and existing inbound links.
      // Keep query parameters and the requested fragment when returning to the canonical archive.
      var target = "/" + window.location.search + window.location.hash;
      if (window.location.pathname === "/podcasts/" || window.location.pathname === "/podcasts") {
        window.location.replace(target);
      }
    })();
  </script>
</head>
<body>
  <p><a href="/">ورود به آرشیو پادکست‌های NightCast</a></p>
</body>
