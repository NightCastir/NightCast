name: NightCast Login Page Load Acceptance

on:
  push:
    branches: [main]
    paths:
      - 'users/login.html'
      - 'users/css/**'
      - 'css/nightcast-shield.css'
      - 'css/nightcast-modal-viewport.css'
      - 'js/nightcast-theme.js'
      - 'js/nightcast-shield.js'
      - 'users/js/login.js'
      - 'tests/login-page-load-acceptance.cjs'
      - '.github/workflows/login-page-load-acceptance.yml'
  pull_request:
    branches: [main]
    paths:
      - 'users/login.html'
      - 'users/css/**'
      - 'css/nightcast-shield.css'
      - 'css/nightcast-modal-viewport.css'
      - 'js/nightcast-theme.js'
      - 'js/nightcast-shield.js'
      - 'users/js/login.js'
      - 'tests/login-page-load-acceptance.cjs'
      - '.github/workflows/login-page-load-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  login-page-load:
    name: Login page navigation, controls and browser errors
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local static server for the proposed revision
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/nightcast-login-http.log 2>&1 &
          for _ in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:4173/users/login.html >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/nightcast-login-http.log
          exit 1
      - name: Check login page and Google action in the checked-out revision
        run: node tests/login-page-load-acceptance.cjs
        env:
          NIGHTCAST_LOGIN_URL: http://127.0.0.1:4173/users/login.html
