<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
NightCast Admin Login
</title>


<link rel="stylesheet" href="../assets/css/core.css">
<link rel="stylesheet" href="../assets/css/components.css">

</head>


<body>


<div class="login-container">


    <div class="login-card">


        <h2>
            ورود به پنل مدیریت NightCast
        </h2>



        <form id="loginForm">


            <label>
                نام کاربری
            </label>


            <input
            id="username"
            type="text"
            autocomplete="username"
            >



            <label>
                رمز عبور
            </label>


            <input
            id="password"
            type="password"
            autocomplete="current-password"
            >



            <button 
            class="login-button"
            type="submit">

                ورود

            </button>


        </form>



        <div id="message"></div>


    </div>


</div>





<script src="../assets/js/core/api.js"></script>

<script src="../assets/js/core/ui.js"></script>





<script>


const form =

document.getElementById(
"loginForm"
);



const message =

document.getElementById(
"message"
);






form.addEventListener(

"submit",

async(e)=>{


e.preventDefault();



const username =

document.getElementById(
"username"
).value.trim();



const password =

document.getElementById(
"password"
).value.trim();





if(!username || !password){


message.innerHTML =

"لطفاً نام کاربری و رمز عبور را وارد کنید";


return;


}





UI.showLoader(

"در حال ورود..."

);




try{


const result =

await API.post(

"/auth/login",

{


username,

password


}

);





if(result.success){



localStorage.setItem(

"NightCastToken",

result.token

);



UI.hideLoader();



UI.success(

"ورود موفق"

);




setTimeout(()=>{


location.href =

"dashboard.html";


},800);



}



else{



UI.hideLoader();



message.innerHTML =

result.message ||

"نام کاربری یا رمز عبور اشتباه است";



}




}


catch(error){



UI.hideLoader();



console.error(

error

);



message.innerHTML =

"خطا در ارتباط با سرور";



}



}



);


</script>


</body>

</html>
