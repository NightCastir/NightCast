<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>مدیریت باشگاه شنوندگان | NightCast</title>
  <style>
    :root{color-scheme:dark;--bg:#070d1b;--panel:#101a2e;--line:#273752;--text:#edf4ff;--muted:#9baecb;--accent:#8b7cff;--ok:#4fd1a5;--warn:#ffca73;--danger:#ff8293}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#252454 0,transparent 40%),var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;line-height:1.7}
    main{max-width:1180px;margin:auto;padding:28px 18px 60px}.hero{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
    h1{font-size:clamp(1.35rem,3vw,2rem);margin:0}.sub{color:var(--muted);margin:5px 0 0}.status{padding:8px 13px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
    .notice{padding:12px 15px;border:1px solid var(--line);background:#101a2e;border-radius:12px;margin:14px 0;color:var(--muted)}.notice.error{border-color:#784050;color:#ffc0ca}.notice.ok{border-color:#285f54;color:#a4f2d6}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.panel{background:linear-gradient(145deg,rgba(18,29,51,.97),rgba(10,18,34,.97));border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0;box-shadow:0 16px 42px #0003}.panel.wide{grid-column:1/-1}
    h2{font-size:1.08rem;margin:0 0 13px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}label{font-size:.85rem;color:var(--muted)}
    input,select,textarea{width:100%;padding:11px 12px;background:#080f20;border:1px solid #30415e;border-radius:10px;color:var(--text);font:inherit;min-width:0}textarea{min-height:74px;resize:vertical}
    button{border:1px solid #4b4e86;background:#4b438d;color:white;border-radius:10px;padding:9px 13px;font:inherit;cursor:pointer}button.secondary{background:#18243b;border-color:#354662}button.good{background:#135747;border-color:#257d65}button.danger{background:#5d2938;border-color:#914256}button:disabled{opacity:.55;cursor:wait}
    .form-actions{display:flex;justify-content:flex-start;margin-top:12px}.list{display:grid;gap:9px}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#0b1426}.item-main{min-width:0}.item-title{font-weight:700;overflow-wrap:anywhere}.meta{color:var(--muted);font-size:.84rem;overflow-wrap:anywhere}.actions{display:flex;flex-wrap:wrap;gap:7px;flex-shrink:0}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-size:.76rem;color:var(--muted)}.pill.active{color:#a4f2d6;border-color:#286451}.empty{color:var(--muted);padding:14px;text-align:center;border:1px dashed var(--line);border-radius:12px}
    .metrics{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.metric{padding:8px 11px;border:1px solid var(--line);border-radius:11px;color:var(--muted)}.metric b{color:var(--text);margin-inline-start:6px}
    @media(max-width:760px){main{padding:18px 12px 40px}.grid{grid-template-columns:1fr}.panel.wide{grid-column:auto}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.item{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{flex:1}}
  </style>
</head>
<body>
<main>
  <header class="hero">
    <div><h1>مدیریت باشگاه شنوندگان</h1><p class="sub">مدیریت مأموریت‌ها، پاداش‌ها و تحویل درخواست‌ها — NightCast</p></div>
    <div id="connection" class="status">در حال بررسی دسترسی…</div>
  </header>
  <div id="notice" class="notice" role="status" aria-live="polite">در حال اتصال امن به API باشگاه…</div>
  <section id="dashboard" hidden>
    <div id="metrics" class="metrics"></div>
    <div class="grid">
      <section class="panel">
        <h2>ساخت مأموریت</h2>
        <form id="mission-form">
          <div class="form-grid">
            <div class="field full"><label for="mission-title">عنوان فارسی</label><input id="mission-title" name="title_fa" required maxlength="160"></div>
            <div class="field full"><label for="mission-description">شرح</label><textarea id="mission-description" name="description_fa" maxlength="1200"></textarea></div>
            <div class="field"><label for="mission-cadence">دوره</label><select id="mission-cadence" name="cadence"><option value="daily">روزانه</option><option value="weekly">هفتگی</option><option value="event">رویدادی</option><option value="once">یک‌بار</option></select></div>
            <div class="field"><label for="mission-type">نوع پیشرفت</label><select id="mission-type" name="event_type"><option value="listen">دقایق شنیدن پذیرفته‌شده</option><option value="listen_minutes">دقایق شنیدن</option><option value="podcast_play">شروع پخش پادکست</option></select></div>
            <div class="field"><label for="mission-target">هدف</label><input id="mission-target" name="target_value" type="number" min="1" max="1000000" value="3" required></div>
            <div class="field"><label for="mission-points">امتیاز</label><input id="mission-points" name="reward_points" type="number" min="0" max="100000" value="10"></div>
            <div class="field"><label for="mission-xp">XP</label><input id="mission-xp" name="reward_xp" type="number" min="0" max="100000" value="5"></div>
          </div>
          <div class="form-actions"><button type="submit">ایجاد مأموریت غیرفعال</button></div>
        </form>
      </section>
      <section class="panel">
        <h2>ساخت پاداش</h2>
        <form id="reward-form">
          <div class="form-grid">
            <div class="field full"><label for="reward-title">عنوان فارسی</label><input id="reward-title" name="title_fa" required maxlength="160"></div>
            <div class="field full"><label for="reward-description">شرح</label><textarea id="reward-description" name="description_fa" maxlength="1200"></textarea></div>
            <div class="field"><label for="reward-type">نوع پاداش</label><select id="reward-type" name="reward_type"><option value="digital">دیجیتال</option><option value="coupon">کد تخفیف</option><option value="merchandise">محصول فیزیکی</option><option value="experience">تجربه</option></select></div>
            <div class="field"><label for="reward-cost">هزینه امتیاز</label><input id="reward-cost" name="cost_points" type="number" min="1" max="100000000" value="50" required></div>
            <div class="field"><label for="reward-stock">موجودی (خالی = نامحدود)</label><input id="reward-stock" name="stock_remaining" type="number" min="0" max="10000000" placeholder="نامحدود"></div>
            <div class="field"><label for="reward-limit">حد دریافت هر کاربر (خالی = بدون سقف)</label><input id="reward-limit" name="max_per_user" type="number" min="1" max="100000" placeholder="بدون سقف"></div>
          </div>
          <div class="form-actions"><button type="submit">ایجاد پاداش غیرفعال</button></div>
        </form>
      </section>
      <section class="panel"><h2>مأموریت‌ها</h2><div id="missions" class="list"><div class="empty">در حال بارگذاری…</div></div></section>
      <section class="panel"><h2>پاداش‌ها</h2><div id="rewards" class="list"><div class="empty">در حال بارگذاری…</div></div></section>
      <section class="panel wide"><h2>درخواست‌های دریافت پاداش</h2><div id="redemptions" class="list"><div class="empty">در حال بارگذاری…</div></div></section>
    </div>
  </section>
</main>
<script src="js/club-admin.js?v=2" defer></script>
</body>
</html>
