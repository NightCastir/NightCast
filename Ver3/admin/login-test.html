<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex,nofollow"><title>NightCast Admin Login Test</title><style>

body{
    margin:0;
    padding:20px;
    background:#0f172a;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
}

.box{
    max-width:550px;
    margin:40px auto;
    background:#1e293b;
    padding:25px;
    border-radius:16px;
}

h1{
    text-align:center;
    font-size:22px;
}

label{
    display:block;
    margin:15px 0 7px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #475569;
    border-radius:8px;
    background:#0f172a;
    color:white;
    font-size:16px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:14px;
    margin-top:20px;
    border:0;
    border-radius:8px;
    background:white;
    color:#111827;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

#message{
    margin-top:18px;
    padding:14px;
    background:#020617;
    border-radius:8px;
    text-align:center;
    line-height:1.8;
}

#log{
    margin-top:10px;
    padding:15px;
    background:#020617;
    border-radius:8px;
    direction:ltr;
    text-align:left;
    white-space:pre-wrap;
    word-break:break-word;
    font-family:monospace;
    font-size:12px;
    line-height:1.8;
    min-height:120px;
}

.success{
    color:#86efac;
}

.error{
    color:#fca5a5;
}

</style></head><body><div class="box"><h1>
NightCast
</h1><p style="text-align:center;color:#94a3b8;">
تست واقعی ورود پنل مدیریت
</p><form
    id="loginForm"
    onsubmit="return login(event);"
><label for="username">
نام کاربری
</label><input
id="username"
type="text"
value="hamed"
autocomplete="username"

«»

<label for="password">
رمز عبور
</label><input
id="password"
type="password"
autocomplete="current-password"

«»

<button
id="loginButton"
type="submit"

«»

ورود

</button></form><div id="message">
آماده ورود...
</div><h3>
📋 گزارش عملیات
</h3><div id="log">
صفحه Login آماده است.
</div></div><script>


/*
|--------------------------------------------------------------------------
| API
|--------------------------------------------------------------------------
*/

var API =
"https://nightcast-api.tomasgermany2580.workers.dev/api/v1";


var logBox =
document.getElementById("log");


var messageBox =
document.getElementById("message");


var loginButton =
document.getElementById("loginButton");



/*
|--------------------------------------------------------------------------
| Logger
|--------------------------------------------------------------------------
*/

function addLog(text){

    var time =
        new Date().toLocaleTimeString("fa-IR");

    logBox.innerHTML +=
        "\n[" +
        time +
        "] " +
        text;

}



/*
|--------------------------------------------------------------------------
| Message
|--------------------------------------------------------------------------
*/

function message(text, type){

    messageBox.textContent =
        text;

    messageBox.className =
        type || "";

}



/*
|--------------------------------------------------------------------------
| REAL LOGIN
|--------------------------------------------------------------------------
*/

async function login(event){


    /*
    |--------------------------------------------------------------------------
    | این خط باید بلافاصله بعد از کلیک اجرا شود.
    |--------------------------------------------------------------------------
    */

    event.preventDefault();


    addLog(
        "✅ تابع Login اجرا شد."
    );


    var username =
        document
        .getElementById("username")
        .value
        .trim();


    var password =
        document
        .getElementById("password")
        .value;


    addLog(
        "Username دریافت شد."
    );


    if(!username){

        addLog(
            "❌ Username خالی است."
        );

        message(
            "نام کاربری را وارد کنید.",
            "error"
        );

        return false;

    }


    if(!password){

        addLog(
            "❌ Password خالی است."
        );

        message(
            "رمز عبور را وارد کنید.",
            "error"
        );

        return false;

    }


    loginButton.disabled =
        true;


    loginButton.textContent =
        "در حال ورود...";


    message(
        "⏳ در حال اتصال به Worker..."
    );


    addLog(
        "درخواست POST به /auth/login"
    );


    addLog(
        "API: " +
        API +
        "/auth/login"
    );


    try{


        /*
        |--------------------------------------------------------------------------
        | LOGIN REQUEST
        |--------------------------------------------------------------------------
        */

        var response =
            await fetch(

                API +
                "/auth/login",

                {

                    method:"POST",

                    mode:"cors",

                    headers:{

                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            username:
                                username,

                            password:
                                password

                        })

                }

            );


        addLog(
            "Worker پاسخ داد."
        );


        addLog(
            "HTTP Status: " +
            response.status
        );


        var text =
            await response.text();


        addLog(
            "Response دریافت شد."
        );


        /*
        |--------------------------------------------------------------------------
        | JSON
        |--------------------------------------------------------------------------
        */

        var data;


        try{

            data =
                JSON.parse(text);

        }

        catch(error){

            addLog(
                "❌ Response JSON نیست."
            );


            addLog(
                "Response:"
            );


            addLog(
                text
            );


            message(
                "❌ Worker پاسخ JSON نداد.",
                "error"
            );


            return false;

        }


        addLog(
            "JSON معتبر است."
        );


        /*
        |--------------------------------------------------------------------------
        | LOGIN RESULT
        |--------------------------------------------------------------------------
        */

        if(
            response.ok &&
            data.success === true
        ){

            addLog(
                "✅ Login موفق بود."
            );


            if(data.token){

                addLog(
                    "✅ Token دریافت شد."
                );

            }
            else{

                addLog(
                    "❌ Token دریافت نشد."
                );

            }


            if(data.user){

                addLog(
                    "Admin User دریافت شد."
                );


                if(data.user.username){

                    addLog(
                        "Username: " +
                        data.user.username
                    );

                }


                if(data.user.role){

                    addLog(
                        "Role: " +
                        data.user.role
                    );

                }

            }


            /*
            |--------------------------------------------------------------------------
            | Store temporary token
            |--------------------------------------------------------------------------
            */

            if(data.token){

                sessionStorage.setItem(
                    "NightCastToken",
                    data.token
                );


                addLog(
                    "✅ Token در SessionStorage ذخیره شد."
                );

            }


            /*
            |--------------------------------------------------------------------------
            | Dashboard
            |--------------------------------------------------------------------------
            */

            message(

                "✅ با موفقیت وارد شدید.\n" +
                "در حال اتصال به Dashboard...",

                "success"

            );


            addLog(
                "در حال انتقال به dashboard.html ..."
            );


            setTimeout(

                function(){

                    window.location.href =
                        "dashboard.html";

                },

                1000

            );


        }

        else{


            addLog(
                "❌ Login ناموفق بود."
            );


            if(data.message){

                addLog(
                    "Server Message: " +
                    data.message
                );

            }


            message(

                data.message ||
                "نام کاربری یا رمز عبور اشتباه است.",

                "error"

            );

        }


    }

    catch(error){


        addLog(
            "❌ خطای ارتباط:"
        );


        addLog(
            error.message ||
            String(error)
        );


        message(

            "❌ ارتباط با Worker برقرار نشد.",

            "error"

        );

    }


    finally{

        loginButton.disabled =
            false;


        loginButton.textContent =
            "ورود";

    }


    return false;

}

</script></body></html>
