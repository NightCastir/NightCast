name: NightCast Club Foundation Focused Acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    name: Foundation schema, migrations, and core API contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python for SQLite migration checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate club schema, migrations, themes, and client contracts
        run: node tests/club-schema-acceptance.cjs
      - name: Validate API authorization and transactional guards
        run: node tests/club-api-acceptance.cjs
      - name: Check API Worker syntax
        run: node --check workers/club-api.js
