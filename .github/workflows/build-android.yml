name: Build NightCast Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug + Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Node.js
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'


      # ============================================================
      # 3. Java 17
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'


      # ============================================================
      # 4. Android SDK
      #
      # Command-line Tools 12.0
      # Build number: 11076708
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '11076708'
          accept-android-sdk-licenses: true
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            ndk;27.0.11718014


      # ============================================================
      # 4.1 Verify Android SDK
      # ============================================================
      - name: Verify Android SDK
        run: |
          set -e

          echo "========================================"
          echo "ANDROID SDK VERIFICATION"
          echo "========================================"

          echo ""
          echo "JAVA:"
          java -version

          echo ""
          echo "NODE:"
          node --version

          echo ""
          echo "NPM:"
          npm --version

          echo ""
          echo "ANDROID_HOME:"
          echo "${ANDROID_HOME:-not-set}"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "${ANDROID_SDK_ROOT:-not-set}"

          echo ""
          echo "SDKMANAGER:"
          command -v sdkmanager

          sdkmanager --version

          echo ""
          echo "INSTALLED SDK PACKAGES:"
          sdkmanager --list_installed | grep -E \
            "platform-tools|platforms;android-34|build-tools;34.0.0|ndk;27.0.11718014" \
            || true

          echo ""
          echo "========================================"
          echo "ANDROID SDK OK"
          echo "========================================"


      # ============================================================
      # 5. Install npm dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          set -e

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi


      # ============================================================
      # 6. Create clean Capacitor configuration
      # ============================================================
      - name: Create clean capacitor.config.json
        run: |
          set -e

          cat > capacitor.config.json << 'EOF'
          {
            "appId": "ir.nightcast.app",
            "appName": "NightCast",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            },
            "android": {
              "allowMixedContent": true,
              "backgroundColor": "#050a16"
            },
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 0,
                "launchAutoHide": true,
                "backgroundColor": "#050a16",
                "splashFullScreen": true,
                "splashImmersive": true
              },
              "StatusBar": {
                "style": "DARK",
                "backgroundColor": "#050a16"
              }
            }
          }
          EOF

          echo ""
          echo "=== capacitor.config.json ==="
          cat capacitor.config.json


      # ============================================================
      # 7. Prepare www
      # ============================================================
      - name: Prepare www folder
        run: |
          set -e

          echo "========================================"
          echo "PREPARING WWW"
          echo "========================================"

          rm -rf www
          mkdir -p www

          echo ""
          echo "Copying root web files..."

          cp index.html www/ 2>/dev/null || true
          cp manifest.json www/ 2>/dev/null || true
          cp service-worker.js www/ 2>/dev/null || true
          cp sw.js www/ 2>/dev/null || true
          cp style.css www/ 2>/dev/null || true
          cp app.js www/ 2>/dev/null || true
          cp favicon.ico www/ 2>/dev/null || true
          cp favicon.png www/ 2>/dev/null || true
          cp logo.png www/ 2>/dev/null || true

          echo ""
          echo "Copying directories..."

          cp -r css www/ 2>/dev/null || true
          cp -r js www/ 2>/dev/null || true
          cp -r assets www/ 2>/dev/null || true
          cp -r auth www/ 2>/dev/null || true
          cp -r users www/ 2>/dev/null || true
          cp -r .well-known www/ 2>/dev/null || true

          # ==========================================================
          # IMPORTANT:
          # NightCast Android app uses users/index.html as its
          # Capacitor entry point.
          # ==========================================================
          echo ""
          echo "Checking NightCast main HTML..."

          if [ ! -f users/index.html ]; then
            echo ""
            echo "ERROR: users/index.html was not found."
            echo ""
            exit 1
          fi

          cp users/index.html www/index.html

          echo "SUCCESS:"
          echo "users/index.html -> www/index.html"

          echo ""
          echo "Copying additional HTML files..."

          find . \
            -maxdepth 1 \
            -type f \
            -name "*.html" \
            ! -name "index.html" \
            -exec cp {} www/ \; 2>/dev/null || true

          echo ""
          echo "=== MAIN APP FILE ==="

          ls -lh www/index.html

          echo ""
          echo "=== WWW DIRECTORY ==="

          find www \
            -maxdepth 4 \
            -type f \
            | sort


      # ============================================================
      # 7.1 Verify NightCast web entry
      # ============================================================
      - name: Verify NightCast web entry
        run: |
          set -e

          echo "Checking www/index.html..."

          test -f www/index.html

          SIZE=$(wc -c < www/index.html)

          echo "www/index.html size: ${SIZE} bytes"

          if [ "$SIZE" -lt 1000 ]; then
            echo "ERROR: www/index.html looks unexpectedly small."
            exit 1
          fi

          echo ""
          echo "First lines of www/index.html:"

          head -n 20 www/index.html

          echo ""
          echo "NightCast web entry verified."


      # ============================================================
      # 8. Create clean Android platform
      # ============================================================
      - name: Add Android platform
        run: |
          set -e

          rm -rf android

          npx cap add android


      # ============================================================
      # 8.1 Set NightCast Launcher Icon
      # ============================================================
      - name: Set NightCast Launcher Icon
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURING NIGHTCAST LAUNCHER ICON"
          echo "========================================"

          ICON_SOURCE="assets/icons/icon-512.png"
          RES_DIR="android/app/src/main/res"

          if [ ! -f "$ICON_SOURCE" ]; then
            echo "ERROR: NightCast icon not found:"
            echo "$ICON_SOURCE"
            exit 1
          fi

          mkdir -p "$RES_DIR/drawable-nodpi"
          mkdir -p "$RES_DIR/mipmap-anydpi-v26"
          mkdir -p "$RES_DIR/values"

          # ----------------------------------------------------------
          # Copy official NightCast icon
          # ----------------------------------------------------------
          cp "$ICON_SOURCE" \
             "$RES_DIR/drawable-nodpi/nightcast_icon.png"


          # ----------------------------------------------------------
          # Adaptive launcher icon
          # ----------------------------------------------------------
          cat > "$RES_DIR/mipmap-anydpi-v26/ic_launcher.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/nightcast_icon_background" />
              <foreground android:drawable="@drawable/nightcast_icon" />
          </adaptive-icon>
          EOF


          cat > "$RES_DIR/mipmap-anydpi-v26/ic_launcher_round.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/nightcast_icon_background" />
              <foreground android:drawable="@drawable/nightcast_icon" />
          </adaptive-icon>
          EOF


          # ----------------------------------------------------------
          # NightCast icon background
          # ----------------------------------------------------------
          cat > "$RES_DIR/values/nightcast_icon_colors.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="nightcast_icon_background">#050A16</color>
          </resources>
          EOF


          # ----------------------------------------------------------
          # Verify AndroidManifest
          # ----------------------------------------------------------
          python3 << 'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/Android
