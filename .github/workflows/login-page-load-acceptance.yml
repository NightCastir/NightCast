name: NightCast Login Page Load Acceptance

on:
  push:
    branches: [main]
    paths:
      - 'users/login.html'
      - 'users/css/**'
      - 'css/nightcast-shield.css'
      - 'css/nightcast-modal-viewport.css'
      - 'js/nightcast-theme.js'
      - 'js/nightcast-shield.js'
      - 'users/js/login.js'
      - 'tests/login-page-load-acceptance.cjs'
      - '.github/workflows/login-page-load-acceptance.yml'
  pull_request:
    branches: [main]
    paths:
      - 'users/login.html'
      - 'users/css/**'
      - 'css/nightcast-shield.css'
      - 'css/nightcast-modal-viewport.css'
      - 'js/nightcast-theme.js'
      - 'js/nightcast-shield.js'
      - 'users/js/login.js'
      - 'tests/login-page-load-acceptance.cjs'
      - '.github/workflows/login-page-load-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  login-page-load:
    name: Login page navigation, controls and browser errors
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Check live login page loads without browser errors
        run: node tests/login-page-load-acceptance.cjs
