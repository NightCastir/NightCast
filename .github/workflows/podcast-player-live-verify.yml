name: NightCast Podcast Player Live Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - 'index.html'
      - 'js/nightcast-app.js'
      - 'js/nightcast-player.js'
      - 'css/nightcast-base.css'
      - '.github/workflows/podcast-player-live-verify.yml'
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'js/nightcast-app.js'
      - 'js/nightcast-player.js'
      - 'css/nightcast-base.css'
      - '.github/workflows/podcast-player-live-verify.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: read
  deployments: read
  actions: read

concurrency:
  group: nightcast-player-live-verification
  cancel-in-progress: false

jobs:
  source-check:
    name: Verify committed player implementation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check visualizer and artwork details wiring
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const app = fs.readFileSync('js/nightcast-app.js', 'utf8');
          const player = fs.readFileSync('js/nightcast-player.js', 'utf8');
          const styles = fs.readFileSync('css/nightcast-base.css', 'utf8');
          const source = html + '\n' + app + '\n' + player + '\n' + styles;
          const checks = [
            ['visualizer canvas', /id=["']ncAudioVisualizer["']/.test(html)],
            ['real frequency analyser', /getByteFrequencyData/.test(source)],
            ['audio analyser connection', /createAnalyser\s*\(/.test(source)],
            ['clickable player artwork', /id=["']playerCover["'][^>]*nc-player-cover-clickable/.test(html) || /class=["'][^"']*nc-player-cover-clickable[^"']*["'][^>]*id=["']playerCover["']/.test(html)],
            ['keyboard activation', /playerCover\?\.addEventListener\(['"]keydown['"]/.test(source)],
            ['responsive visualizer styles', /\.nc-audio-visualizer-wrap/.test(source)]
          ];
          for (const [name, ok] of checks) console.log(`${ok ? 'PASS' : 'FAIL'} ${name}`);
          if (checks.some(([, ok]) => !ok)) process.exit(1);
          NODE

  pages-diagnostics:
    name: Inspect GitHub Pages publication settings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report Pages source and deployment configuration
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data } = await github.rest.repos.getPages({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              core.info(JSON.stringify({
                status: data.status,
                html_url: data.html_url,
                cname: data.cname,
                source: data.source,
                build_type: data.build_type,
                https_enforced: data.https_enforced
              }, null, 2));
              core.setOutput('pages_url', data.html_url || 'https://nightcastir.github.io');
              core.setOutput('pages_status', data.status || 'unknown');
            } catch (error) {
              core.error(`Unable to read GitHub Pages configuration (HTTP ${error.status || 'unknown'}): ${error.message}`);
              core.error('If Pages is disabled or this token cannot read Pages settings, configure/verify Settings > Pages in the repository.');
              throw error;
            }

  live-site-check:
    name: Verify feature is actually visible on production
    if: github.event_name != 'pull_request'
    needs: [source-check, pages-diagnostics]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Wait for production host to publish this commit
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://nightcast.ir/?nc_live_check=${GITHUB_SHA}"
            "https://nightcast.ir/podcasts/?nc_live_check=${GITHUB_SHA}"
            "https://nightcast.ir/index.html?nc_live_check=${GITHUB_SHA}"
            "https://www.nightcast.ir/?nc_live_check=${GITHUB_SHA}"
            "https://www.nightcast.ir/podcasts/?nc_live_check=${GITHUB_SHA}"
            "https://www.nightcast.ir/index.html?nc_live_check=${GITHUB_SHA}"
            "https://nightcastir.github.io/?nc_live_check=${GITHUB_SHA}"
            "https://nightcastir.github.io/podcasts/?nc_live_check=${GITHUB_SHA}"
            "https://nightcastir.github.io/index.html?nc_live_check=${GITHUB_SHA}"
          )
          deadline=$((SECONDS + 900))
          while (( SECONDS < deadline )); do
            for url in "${urls[@]}"; do
              echo "Checking ${url}"
              body="$(curl --location --silent --show-error --max-time 20 --user-agent 'NightCast-Live-Verification/1.0' "${url}" 2>/dev/null || true)"
              if [[ "${body}" == *'ncAudioVisualizer'* && "${body}" == *'nc-player-cover-clickable'* && "${body}" == *'/js/nightcast-app.js?v=2'* ]]; then
                asset_origin="$(printf '%s' "${url}" | sed -E 's#^(https?://[^/]+).*#\1#')"
                app_js="$(curl --location --silent --show-error --max-time 20 --user-agent 'NightCast-Live-Verification/1.0' "${asset_origin}/js/nightcast-app.js?v=2" 2>/dev/null || true)"
                player_js="$(curl --location --silent --show-error --max-time 20 --user-agent 'NightCast-Live-Verification/1.0' "${asset_origin}/js/nightcast-player.js?v=1" 2>/dev/null || true)"
                if [[ "${app_js}" == *'getByteFrequencyData'* && "${app_js}" == *'createAnalyser('* && "${app_js}" == *'playerCover'* && "${player_js}" == *'NightCastPodcastBridge'* ]]; then
                  echo "PASS: production HTML references the external app/player scripts and the published scripts contain the visualizer/player implementation."
                  exit 0
                fi
              fi
            done
            echo "Feature not visible yet; retrying in 30 seconds."
            sleep 30
          done
          echo "::error::Production site did not expose the podcast visualizer/artwork feature within 15 minutes. Review the Pages diagnostics above, the configured publishing branch/folder, custom domain/CNAME, and CDN/origin cache."
          exit 1
