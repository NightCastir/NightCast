<!DOCTYPE html>
<html lang="fa" dir="rtl">
<body>

<h3>تست NightCast Whisper</h3>

<button onclick="start()">
تولید زیرنویس
</button>

<pre id="out">
منتظر...
</pre>

<script>

async function start(){

const output =
document.getElementById("out");

output.innerText =
"در حال پردازش...";

try {

const res =
await fetch(
"https://nightcast-transcribe.tomasgermany2580.workers.dev",
{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

url:
"https://raw.githubusercontent.com/NightCastir/NightCast-Media/main/audio/01test.mp3"

})

});

const data =
await res.json();

output.innerText =
JSON.stringify(
data,
null,
2
);

}

catch(e){

output.innerText =
e.message;

}

}

</script>

</body>
</html>
