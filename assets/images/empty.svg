<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 600 420"
     width="600"
     height="420">

    <defs>

        <linearGradient id="bg"
                        x1="0"
                        y1="0"
                        x2="0"
                        y2="1">

            <stop offset="0%"
                  stop-color="#151515"/>

            <stop offset="100%"
                  stop-color="#0B0B0B"/>

        </linearGradient>

    </defs>

    <rect
        width="600"
        height="420"
        rx="28"
        fill="url(#bg)"/>

    <!-- Book -->

    <rect
        x="180"
        y="95"
        width="240"
        height="170"
        rx="12"
        fill="none"
        stroke="#D9A441"
        stroke-width="6"/>

    <line
        x1="300"
        y1="95"
        x2="300"
        y2="265"
        stroke="#D9A441"
        stroke-width="4"/>

    <!-- Pages -->

    <line
        x1="205"
        y1="130"
        x2="280"
        y2="130"
        stroke="#D9A441"
        stroke-width="3"/>

    <line
        x1="205"
        y1="155"
        x2="280"
        y2="155"
        stroke="#D9A441"
        stroke-width="3"/>

    <line
        x1="205"
        y1="180"
        x2="280"
        y2="180"
        stroke="#D9A441"
        stroke-width="3"/>

    <line
        x1="320"
        y1="130"
        x2="395"
        y2="130"
        stroke="#D9A441"
        stroke-width="3"/>

    <line
        x1="320"
        y1="155"
        x2="395"
        y2="155"
        stroke="#D9A441"
        stroke-width="3"/>

    <line
        x1="320"
        y1="180"
        x2="395"
        y2="180"
        stroke="#D9A441"
        stroke-width="3"/>

    <!-- Headphones -->

    <path
        d="M240 95
           C240 40 360 40 360 95"
        fill="none"
        stroke="#D9A441"
        stroke-width="8"/>

    <rect
        x="225"
        y="100"
        width="18"
        height="55"
        rx="8"
        fill="#D9A441"/>

    <rect
        x="357"
        y="100"
        width="18"
        height="55"
        rx="8"
        fill="#D9A441"/>

    <!-- Sound Waves -->

    <path
        d="M120 170
           Q140 150 160 170
           Q140 190 120 170"

        fill="none"
        stroke="#D9A441"
        stroke-width="4"/>

    <path
        d="M80 170
           Q110 135 140 170
           Q110 205 80 170"

        fill="none"
        stroke="#D9A441"
        stroke-width="4"
        opacity=".55"/>

    <path
        d="M480 170
           Q460 150 440 170
           Q460 190 480 170"

        fill="none"
        stroke="#D9A441"
        stroke-width="4"/>

    <path
        d="M520 170
           Q490 135 460 170
           Q490 205 520 170"

        fill="none"
        stroke="#D9A441"
        stroke-width="4"
        opacity=".55"/>

    <!-- Stars -->

    <circle cx="95" cy="60" r="2" fill="#D9A441"/>

    <circle cx="500" cy="55" r="2" fill="#D9A441"/>

    <circle cx="545" cy="90" r="1.8" fill="#D9A441"/>

    <circle cx="70" cy="110" r="1.8" fill="#D9A441"/>

</svg>
