<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0;url=/users/login.html">
  <title>ورود به NightCast</title>
  <script>
    (function () {
      "use strict";
      var target = new URL("/users/login.html", window.location.origin);
      var params = new URLSearchParams(window.location.search);
      var next = params.get("next");
      if (next && next.startsWith("/") && !next.startsWith("//")) {
        target.searchParams.set("next", next);
      }
      window.location.replace(target.toString());
    })();
  </script>
</head>
<body>
  <p>در حال انتقال به صفحه امن ورود NightCast…</p>
  <p><a href="/users/login.html">اگر انتقال خودکار انجام نشد، اینجا را لمس کنید.</a></p>
</body>
</html>
