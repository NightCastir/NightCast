name: NightCast Single-Document Archive Acceptance

on:
  push:
    branches:
      - feat/single-document-podcast-entry
      - fix/archive-acceptance-assets
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: single-document-archive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-architecture:
    name: Source, route and asset integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify one-document architecture and compatibility routes
        run: node tests/single-document-entry.cjs

  browser-regression:
    name: Browser, API and responsive regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: npm install --no-save playwright lightningcss yaml
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate workflow YAML
        run: node -e "require('yaml').parse(require('fs').readFileSync('.github/workflows/single-document-archive.yml','utf8'),{uniqueKeys:true}); console.log('Workflow YAML valid')"
      - name: Run full NightCast browser and API regression checks
        run: node tests/nightcast-acceptance.cjs
      - name: Verify live www catalogue readiness in a real browser
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/live-pagination-acceptance'
        run: node tests/live-entry-browser.cjs
      - name: Upload browser visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: single-document-archive-visual-audit-${{ github.run_number }}
          path: artifacts/visual/*.png
          if-no-files-found: warn
          retention-days: 14

  live-smoke-after-main:
    name: Public deployment smoke test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [source-architecture, browser-regression]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public root and legacy route after Pages propagation
        env:
          SITE_URL: https://www.nightcast.ir
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 300))
          attempt=0
          while (( SECONDS < deadline )); do
            attempt=$((attempt + 1))
            echo "Production smoke attempt $attempt"
            if curl --fail --silent --show-error --location --max-time 25 "$SITE_URL/?nc_smoke=${GITHUB_SHA}-${attempt}" -o /tmp/nightcast-root.html; then
              root_grid=false
              root_loader=false
              if grep -qi 'id="podcastGrid"' /tmp/nightcast-root.html; then root_grid=true; fi
              if grep -qi 'id="nc-entry-loader"' /tmp/nightcast-root.html; then root_loader=true; fi
              echo "www root markers: podcastGrid=${root_grid}, galaxyLoader=${root_loader}"
              if [[ "${root_grid}" == true && "${root_loader}" == true ]]; then
                if curl --fail --silent --show-error --location --max-time 25 "$SITE_URL/podcasts?nc_smoke=${GITHUB_SHA}-${attempt}" -o /tmp/nightcast-legacy.html; then
                  # curl follows HTTP redirects but does not execute the compatibility page's JS redirect.
                  if grep -qi 'id="podcastGrid"' /tmp/nightcast-legacy.html || { grep -q 'window.location.replace(target)' /tmp/nightcast-legacy.html && grep -qi 'rel="canonical" href="https://nightcast.ir/"' /tmp/nightcast-legacy.html; }; then
                    echo "PASS: www root serves the canonical archive with its integrated loader; legacy /podcasts either redirects at HTTP level or provides the immediate compatibility redirect."
                    exit 0
                  fi
                fi
              fi
            fi
            echo "Deployment/CDN has not exposed the expected root archive yet; retrying in 15 seconds."
            sleep 15
          done
          echo "::error::The www production root or legacy /podcasts route did not expose the canonical archive after five minutes."
          echo "Root response markers:"
          grep -oiE 'podcastGrid|nc-entry-loader|nc-splash|window.location.replace' /tmp/nightcast-root.html | sort | uniq -c || true
          exit 1
