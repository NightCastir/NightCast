<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta
        http-equiv="X-UA-Compatible"
        content="IE=edge">

    <meta
        name="theme-color"
        content="#0B0F14">

    <meta
        name="color-scheme"
        content="dark light">

    <meta
        name="application-name"
        content="NightCast">

    <meta
        name="apple-mobile-web-app-capable"
        content="yes">

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent">

    <meta
        name="apple-mobile-web-app-title"
        content="NightCast">

    <meta
        name="mobile-web-app-capable"
        content="yes">

    <title>
        NightCast | پادکست خلاصه و تحلیل کتاب‌های ارزشمند
    </title>

    <meta
        name="description"
        content="پادکست خلاصه و تحلیل کاربردی کتاب‌های ارزشمند. سریع یاد بگیر، عمیق‌تر فکر کن.">

    <meta
        name="keywords"
        content="خلاصه کتاب,پادکست کتاب,کتاب صوتی,مدیریت,روانشناسی,NightCast">

    <meta
        name="author"
        content="NightCast">

    <meta
        name="robots"
        content="index,follow">

    <link
        rel="canonical"
        href="https://nightcast.ir/v2/">

    <!-- Open Graph -->

    <meta property="og:type" content="website">

    <meta property="og:site_name" content="NightCast">

    <meta property="og:title"
        content="NightCast">

    <meta property="og:description"
        content="پادکست خلاصه و تحلیل کتاب‌های ارزشمند">

    <meta property="og:url"
        content="https://nightcast.ir/v2/">

    <meta property="og:image"
        content="assets/images/cover.webp">

    <!-- Twitter -->

    <meta
        name="twitter:card"
        content="summary_large_image">

    <!-- Manifest -->

    <link
        rel="manifest"
        href="manifest.json">

    <!-- Icons -->

    <link
        rel="icon"
        href="favicon.ico">

    <link
        rel="apple-touch-icon"
        href="assets/icons/icon-192.png">

    <!-- Fonts -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet" href="assets/css/reset.css">

    <link rel="stylesheet" href="assets/css/variables.css">

    <link rel="stylesheet" href="assets/css/layout.css">

    <link rel="stylesheet" href="assets/css/components.css">

    <link rel="stylesheet" href="assets/css/player.css">

    <link rel="stylesheet" href="assets/css/responsive.css">

    <link rel="stylesheet" href="assets/css/style.css">

</head>

<body>

    <!-- App -->

    <div id="app">

        <!-- Header -->
        <header
            id="header"
            role="banner">

<header
    id="header"
    class="app-header"
    role="banner">

    <div class="header-container">

        <!-- Left -->
        <div class="header-left">

            <button
                id="menu-button"
                class="icon-button"
                type="button"
                aria-label="منو">

                <i class="fa-solid fa-bars"></i>

            </button>

            <a
                href="/v2/"
                id="logo"
                class="logo"
                aria-label="NightCast">

                <img
                    src="assets/images/logo.png"
                    alt="NightCast Logo">

                <span>
                    NightCast
                </span>

            </a>

        </div>

        <!-- Center -->

        <div class="header-center">

            <form
                id="search-form"
                role="search"
                autocomplete="off">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                    id="search-input"
                    type="search"
                    placeholder="جستجوی کتاب، نویسنده یا موضوع..."
                    aria-label="جستجو">

                <button
                    id="search-clear"
                    type="button"
                    aria-label="پاک کردن">

                    <i class="fa-solid fa-xmark"></i>

                </button>

            </form>

        </div>

        <!-- Right -->

        <div class="header-right">

            <button
                id="theme-button"
                class="icon-button"
                type="button"
                aria-label="حالت شب">

                <i class="fa-solid fa-moon"></i>

            </button>

            <button
                id="notification-button"
                class="icon-button"
                type="button"
                aria-label="اعلان‌ها">

                <i class="fa-regular fa-bell"></i>

            </button>

            <button
                id="profile-button"
                class="icon-button"
                type="button"
                aria-label="حساب کاربری">

                <i class="fa-regular fa-user"></i>

            </button>

        </div>

    </div>

</header>
        </header>

        <!-- Main -->

        <main
            id="main"
            role="main">

            <!-- Podcast Feed -->

            <section
                id="podcast-feed"
                aria-label="Podcast Feed">

            </section>

        </main>

        <!-- Footer -->

        <footer
            id="footer"
            role="contentinfo">
        </footer>

    </div>

    <!-- Floating Player -->

    <aside
        id="player"
        aria-label="Audio Player">
    </aside>

    <!-- Bottom Sheet -->

    <section
        id="bottom-sheet"
        aria-hidden="true">
    </section>

    <!-- Dialog -->

    <section
        id="dialog"
        aria-hidden="true">
    </section>

    <!-- Toast -->

    <div
        id="toast"
        aria-live="polite">
    </div>

    <!-- Loading -->

    <div
        id="loading"
        aria-hidden="true">
    </div>

    <!-- Scripts -->

    <script
        type="module"
        src="assets/js/app.js"></script>

</body>

  </html>
