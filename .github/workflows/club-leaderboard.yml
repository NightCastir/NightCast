name: NightCast Club Leaderboard
on:
  push:
    branches: [main, feat/nightcast-club-engagement-v1]
    paths:
      - 'data/club-quiz-questions.json'
      - 'migrations/club/0004_engagement.sql'
      - 'tests/club-engagement-acceptance.cjs'
      - '.github/workflows/club-leaderboard.yml'
  pull_request:
    branches: [main]
    paths:
      - 'data/club-quiz-questions.json'
      - 'migrations/club/0004_engagement.sql'
      - 'tests/club-engagement-acceptance.cjs'
      - '.github/workflows/club-leaderboard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  leaderboard-contract:
    name: NightCast Club Leaderboard contract acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python for SQLite migration tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate leaderboard contract and schema constraints
        env:
          CLUB_FEATURE: 'leaderboard'
        run: node tests/club-engagement-acceptance.cjs
