<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<title>
NightCast Dashboard API Test
</title>

<link rel="stylesheet" href="../assets/css/core.css">

<style>

body{

font-family:tahoma;
background:#f5f6fa;
padding:30px;

}


.box{

background:#111;
color:#00ff88;
padding:20px;
border-radius:10px;
direction:ltr;
white-space:pre-wrap;

}

.card{

background:white;
padding:20px;
margin-bottom:20px;
border-radius:10px;

}


</style>

</head>


<body>


<h2>
🧪 NightCast Dashboard API Test
</h2>



<div class="card">

<h3>
Statistics
</h3>

<div id="stats">

Loading...

</div>

</div>





<div class="card">

<h3>
Latest Podcasts
</h3>

<table border="1" width="100%">

<thead>

<tr>

<th>
Title
</th>

<th>
Status
</th>

<th>
Date
</th>


</tr>


</thead>


<tbody id="podcasts">

</tbody>


</table>


</div>





<div class="box" id="debug">

Starting...

</div>






<script src="../assets/js/core/api.js"></script>


<script>


async function runTest(){



let debug=[];



try{



const dashboard =

await API.get(

"/dashboard"

);



debug.push(

"Dashboard API OK"

);





document.getElementById(

"stats"

).innerHTML = `


Podcast :

${dashboard.statistics.podcasts}

<br>

Books :

${dashboard.statistics.books}

<br>

Users :

${dashboard.statistics.users}

<br>

Plays :

${dashboard.statistics.plays}


`;





}

catch(e){


debug.push(

"Dashboard ERROR : "

+e.message

);


}






try{



const latest =

await API.get(

"/dashboard/latest"

);



debug.push(

"Latest API OK"

);




let html="";



latest.podcasts.forEach(

p=>{


html += `


<tr>

<td>

${p.title}

</td>


<td>

${p.status}

</td>


<td>

${p.created_at}

</td>


</tr>


`;


}

);



document.getElementById(

"podcasts"

).innerHTML=html;



}

catch(e){



debug.push(

"Latest ERROR : "

+e.message

);



}







try{


const activity =

await API.get(

"/activity"

);



debug.push(

"Activity API OK"

);


}

catch(e){


debug.push(

"Activity ERROR : "

+e.message

);


}






document.getElementById(

"debug"

).innerHTML =

debug.join("\n");




}





document.addEventListener(

"DOMContentLoaded",

runTest

);



</script>



</body>

</html>
