<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,initial-scale=1,viewport-fit=cover">

    <title>NightCast</title>

    <meta name="theme-color" content="#0B1220">

    <meta name="color-scheme" content="dark">

    <meta name="description"
          content="NightCast | رادیوی تجربه، یادگیری و رشد فردی">

    <link rel="icon" href="images/favicon.png">

    <link rel="apple-touch-icon"
          href="images/icon-192.png">

    <link rel="manifest"
          href="manifest.json">

    <link rel="stylesheet"
          href="css/splash.css">

</head>

<body>

<div id="appSplash" class="splash">

    <div class="background-glow"></div>

    <div class="logo-wrapper">

        <div class="logo-circle">

            <svg
                viewBox="0 0 64 64"
                width="54"
                height="54"
                fill="none"
                xmlns="http://www.w3.org/2000/svg">

                <circle
                    cx="32"
                    cy="32"
                    r="22"
                    stroke="currentColor"
                    stroke-width="3"/>

                <circle
                    cx="32"
                    cy="32"
                    r="6"
                    fill="currentColor"/>

                <path
                    d="M12 32H6M58 32H52M32 12V6M32 58V52"
                    stroke="currentColor"
                    stroke-width="3"
                    stroke-linecap="round"/>

            </svg>

        </div>

        <h1>

            Night<span>Cast</span>

        </h1>

        <p>

            رادیوی تجربه، یادگیری و رشد فردی

        </p>

    </div>

    <div class="loader">

        <div class="loader-bar">

            <span id="loaderProgress"></span>

        </div>

        <small>

            در حال آماده‌سازی...

        </small>

    </div>

    <div class="version">

        Version 1.0

    </div>

</div>

<noscript>

برای استفاده از NightCast باید JavaScript فعال باشد.

</noscript>

<script src="js/auth.js"></script>

<script src="js/router.js"></script>

</body>

</html>
