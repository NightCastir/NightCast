<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
NightCast User API Console
</title>


<style>

body{

font-family:tahoma,Arial;

background:#111;

color:#eee;

padding:20px;

}



.container{

max-width:1000px;

margin:auto;

}



h1{

text-align:center;

color:#00d4ff;

}



.card{

background:#1c1c1c;

border-radius:12px;

padding:20px;

margin-bottom:20px;

box-shadow:0 0 15px rgba(0,0,0,.5);

}



h2{

color:#ffd369;

border-bottom:1px solid #333;

padding-bottom:10px;

}



input,
textarea{

width:100%;

padding:10px;

margin:7px 0;

background:#222;

border:1px solid #444;

color:white;

border-radius:6px;

box-sizing:border-box;

}



button{

background:#007bff;

color:white;

border:none;

padding:10px 18px;

border-radius:8px;

cursor:pointer;

margin:5px;

}



button:hover{

opacity:.8;

}



pre{

background:#000;

padding:15px;

border-radius:10px;

direction:ltr;

text-align:left;

overflow:auto;

min-height:150px;

}



.row{

display:grid;

grid-template-columns:1fr 1fr;

gap:15px;

}



.status{

padding:15px;

background:#222;

border-radius:8px;

margin-top:10px;

}



.green{

color:#00ff88;

}



.red{

color:#ff5555;

}



@media(max-width:700px){

.row{

grid-template-columns:1fr;

}

}


</style>


</head>


<body>


<div class="container">


<h1>
🎙 NightCast User API Console
</h1>


<div class="card">


<h2>
Worker Status
</h2>


<button onclick="testAPI()">

تست اتصال API

</button>


<div id="status" class="status">

آماده تست...

</div>


</div>



<div class="card">


<h2>
Public Podcasts
</h2>


<div class="row">


<div>

<label>
Page
</label>


<input id="page" value="1">


</div>



<div>

<label>
Limit
</label>


<input id="limit" value="5">


</div>


</div>


<button onclick="getPodcasts()">

دریافت پادکست‌ها

</button>


</div>


<div class="card">


<h2>
Register User
</h2>


<input id="regUsername"

placeholder="username">



<input id="regPassword"

placeholder="password"

type="password">



<input id="regName"

placeholder="full name">



<button onclick="registerUser()">

ثبت نام

</button>


</div>


<div class="card">


<h2>
Login User
</h2>


<input id="loginUsername"

placeholder="username">



<input id="loginPassword"

placeholder="password"

type="password">



<button onclick="loginUser()">

ورود

</button>


</div>


<div class="card">


<h2>
User Session Tools
</h2>


<button onclick="checkMe()">

بررسی کاربر فعلی

</button>


<button onclick="checkDownload()">

تست دانلود

</button>


<button onclick="showToken()">

نمایش Token

</button>


<button onclick="logoutUser()">

خروج

</button>


</div>


<div class="card">


<h2>
API Response
</h2>


<pre id="output">

Waiting...

</pre>


</div>


</div>


<script>
  
// =====================================
// NIGHTCAST USER API CONSOLE
// PART 2/5
// API CORE + WORKER TEST + PODCASTS
// =====================================



const API_URL =

"https://nightcast-api.tomasgermany2580.workers.dev/api/v1";





// =====================================
// OUTPUT LOGGER
// =====================================


function showOutput(data){


document.getElementById("output").textContent =

JSON.stringify(

data,

null,

2

);


}







// =====================================
// API REQUEST
// =====================================


async function apiRequest(

endpoint,

options={}

){


try{


const response =

await fetch(

API_URL + endpoint,

options

);



const data =

await response.json();



showOutput(data);



return data;


}

catch(error){


const result = {


success:false,

error:error.message

};



showOutput(result);



return result;


}


}







// =====================================
// TEST WORKER CONNECTION
// =====================================


async function testAPI(){


const result =

await apiRequest(

"/test"

);




const status =

document.getElementById("status");





if(result.success){


status.innerHTML =


`

<span class="green">

✔ اتصال موفق

</span>

<br>

${result.message}

`;



}

else{


status.innerHTML =


`

<span class="red">

✖ خطا در اتصال

</span>

`;



}


}








// =====================================
// GET PUBLIC PODCASTS
// =====================================


async function getPodcasts(){


const page =

document.getElementById("page").value;



const limit =

document.getElementById("limit").value;





const result =

await apiRequest(

`/public/podcasts?page=${page}&limit=${limit}`

);



return result;


  }
  
// =====================================
// PART 3/5
// REGISTER + LOGIN USER
// =====================================





// =====================================
// REGISTER USER
// =====================================


async function registerUser(){



const username =

document.getElementById("regUsername").value;



const password =

document.getElementById("regPassword").value;



const full_name =

document.getElementById("regName").value;





if(!username || !password){


showOutput({

success:false,

message:"Username and password required"

});


return;


}





const result =

await apiRequest(

"/public/register",

{


method:"POST",


headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

username:username,

password:password,

full_name:full_name

})


}

);



return result;


}









// =====================================
// LOGIN USER
// =====================================


async function loginUser(){



const username =

document.getElementById("loginUsername").value;



const password =

document.getElementById("loginPassword").value;





if(!username || !password){


showOutput({

success:false,

message:"Username and password required"

});


return;


}






const result =

await apiRequest(

"/public/login",

{


method:"POST",


headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

username:username,

password:password

})


}

);








if(

result.success

&&

result.token

){



localStorage.setItem(

"NightCastUserToken",

result.token

);





document.getElementById("status").innerHTML =


`

<span class="green">

✔ ورود موفق

</span>

<br>

Token ذخیره شد

`;



}



else{



document.getElementById("status").innerHTML =


`

<span class="red">

✖ ورود ناموفق

</span>

`;



}



return result;



}








// =====================================
// GET USER TOKEN
// =====================================


function getUserToken(){



return localStorage.getItem(

"NightCastUserToken"

);


  }
  
// =====================================
// PART 4/5
// AUTH + DOWNLOAD + LOGOUT
// =====================================





// =====================================
// AUTH HEADER
// =====================================


function getAuthHeaders(){



const token =

localStorage.getItem(

"NightCastUserToken"

);




if(!token){


return {

"Content-Type":"application/json"

};


}




return {


"Content-Type":"application/json",


"Authorization":

"Bearer " + token


};


}








// =====================================
// CHECK CURRENT USER
// =====================================


async function checkMe(){



const result =

await apiRequest(

"/public/me",

{


method:"GET",


headers:

getAuthHeaders()


}

);



return result;


}








// =====================================
// DOWNLOAD CHECK
// =====================================


async function checkDownload(){



const id =

prompt(

"شماره ID پادکست را وارد کنید"

);





if(!id){


return;


}






const result =

await apiRequest(

"/public/download/" + id,

{


method:"GET",


headers:

getAuthHeaders()


}

);



return result;


}









// =====================================
// SHOW TOKEN
// =====================================


function showToken(){



const token =

localStorage.getItem(

"NightCastUserToken"

);





showOutput({


token:

token

?

token.substring(0,20)+"..."

:

null


});


}









// =====================================
// LOGOUT USER
// =====================================


async function logoutUser(){



const token =

localStorage.getItem(

"NightCastUserToken"

);





localStorage.removeItem(

"NightCastUserToken"

);





showOutput({

success:true,

message:

"User token removed",

token:

token

?

token.substring(0,20)+"..."

:

null


});





document.getElementById("status").innerHTML =


`

<span class="green">

✔ خروج انجام شد

</span>

`;



  }
  


// =====================================
// PART 5/5
// FINAL CHECK
// =====================================



console.log(

"NightCast User API Console Loaded"

);



</script>


</body>


</html>
