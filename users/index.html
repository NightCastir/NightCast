<!DOCTYPE html>

<html lang="fa" dir="rtl">


<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
NightCast User API Console
</title>



<style>


body{

font-family:tahoma,Arial;

background:#111;

color:#eee;

padding:20px;

}



.container{

max-width:1000px;

margin:auto;

}



h1{

text-align:center;

color:#00d4ff;

}



.card{

background:#1c1c1c;

border-radius:12px;

padding:20px;

margin-bottom:20px;

box-shadow:0 0 15px rgba(0,0,0,.5);

}



h2{

color:#ffd369;

border-bottom:1px solid #333;

padding-bottom:10px;

}



input,
textarea{


width:100%;

padding:10px;

margin:7px 0;

background:#222;

border:1px solid #444;

color:white;

border-radius:6px;

box-sizing:border-box;


}



button{


background:#007bff;

color:white;

border:none;

padding:10px 18px;

border-radius:8px;

cursor:pointer;

margin:5px;


}



button:hover{

opacity:.8;

}



pre{


background:#000;

padding:15px;

border-radius:10px;

direction:ltr;

text-align:left;

overflow:auto;

min-height:150px;


}



.row{


display:grid;

grid-template-columns:1fr 1fr;

gap:15px;


}



.status{


padding:15px;

background:#222;

border-radius:8px;

margin-top:10px;


}



.green{

color:#00ff88;

}



.red{

color:#ff5555;

}





/* USER PROFILE */


.user-profile{


background:#15222d;

border:1px solid #00d4ff;


}



.user-info{


line-height:2;

font-size:16px;


}



.user-online{


color:#00ff88;

font-weight:bold;


}



.user-guest{


color:#ffd369;

font-weight:bold;


}





@media(max-width:700px){


.row{


grid-template-columns:1fr;


}


}



</style>



</head>





<body>



<div class="container">






<h1>

🎙 NightCast User API Console

</h1>







<!-- ===============================
CURRENT USER
================================ -->


<div class="card user-profile">


<h2>

👤 کاربر فعلی

</h2>



<div id="userInfo" class="user-info">


در حال بررسی نشست کاربر...


</div>



</div>








<!-- ===============================
WORKER STATUS
================================ -->


<div class="card">


<h2>

Worker Status

</h2>



<button onclick="testAPI()">


تست اتصال API


</button>



<div id="status" class="status">


آماده تست...


</div>



</div>








<!-- ===============================
PUBLIC PODCASTS
================================ -->


<div class="card">


<h2>

Public Podcasts

</h2>



<div class="row">



<div>

<label>

Page

</label>


<input id="page" value="1">


</div>




<div>

<label>

Limit

</label>


<input id="limit" value="5">


</div>



</div>





<button onclick="getPodcasts()">


دریافت پادکست‌ها


</button>



</div>








<!-- ===============================
REGISTER
================================ -->


<div class="card">


<h2>

Register User

</h2>



<input id="regUsername"

placeholder="username">



<input id="regPassword"

placeholder="password"

type="password">



<input id="regName"

placeholder="full name">



<button onclick="registerUser()">


ثبت نام


</button>



</div>








<!-- ===============================
LOGIN
================================ -->


<div class="card">


<h2>

Login User

</h2>



<input id="loginUsername"

placeholder="username">



<input id="loginPassword"

placeholder="password"

type="password">



<button onclick="loginUser()">


ورود


</button>



</div>








<!-- ===============================
SESSION TOOLS
================================ -->


<div class="card">


<h2>

User Session Tools

</h2>



<button onclick="checkMe()">

بررسی کاربر فعلی

</button>



<button onclick="checkDownload()">

تست دانلود

</button>



<button onclick="showToken()">

نمایش Token

</button>



<button onclick="logoutUser()">

خروج

</button>



</div>








<!-- ===============================
OUTPUT
================================ -->


<div class="card">


<h2>

API Response

</h2>



<pre id="output">


Waiting...


</pre>



</div>





</div>








<script>


// =====================================
// NIGHTCAST USER API CONSOLE
// PART 1/3
// API CORE
// =====================================



const API_URL =


"https://nightcast-api.tomasgermany2580.workers.dev/api/v1";







// =====================================
// OUTPUT
// =====================================


function showOutput(data){


document.getElementById(

"output"

).textContent =


JSON.stringify(

data,

null,

2

);



}








// =====================================
// API REQUEST
// =====================================


async function apiRequest(

endpoint,

options={}

){


try{


const response =


await fetch(

API_URL + endpoint,

options

);



const data =


await response.json();



showOutput(data);



return data;



}

catch(error){


const result = {


success:false,

error:error.message


};



showOutput(result);



return result;



}


}







// =====================================
// TEST API
// =====================================


async function testAPI(){


const result =


await apiRequest(

"/test"

);




const status =


document.getElementById(

"status"

);





if(result.success){


status.innerHTML =



`

<span class="green">

✔ اتصال موفق

</span>

<br>

${result.message}

`;



}

else{


status.innerHTML =



`

<span class="red">

✖ خطا در اتصال

</span>

`;



}



}







// =====================================
// GET PUBLIC PODCASTS
// =====================================


async function getPodcasts(){


const page =


document.getElementById(

"page"

).value;




const limit =


document.getElementById(

"limit"

).value;





return await apiRequest(


`/public/podcasts?page=${page}&limit=${limit}`


);



}

   // =====================================
// PART 2/3
// REGISTER + LOGIN USER
// =====================================





// =====================================
// REGISTER USER
// =====================================


async function registerUser(){



const username =

document.getElementById(

"regUsername"

).value;



const password =

document.getElementById(

"regPassword"

).value;



const full_name =

document.getElementById(

"regName"

).value;






if(!username || !password){


showOutput({


success:false,


message:

"Username and password required"


});


return;


}






const result =


await apiRequest(


"/public/register",


{


method:"POST",



headers:{


"Content-Type":

"application/json"


},



body:JSON.stringify({


username,


password,


full_name


})


}



);



return result;



}









// =====================================
// LOGIN USER
// =====================================


async function loginUser(){



const username =


document.getElementById(

"loginUsername"

).value;




const password =


document.getElementById(

"loginPassword"

).value;







if(!username || !password){



showOutput({


success:false,


message:

"Username and password required"



});



return;


}









const result =


await apiRequest(


"/public/login",


{


method:"POST",



headers:{


"Content-Type":

"application/json"


},



body:JSON.stringify({


username,


password


})



}



);









if(

result.success

&&

result.token

){



localStorage.setItem(


"NightCastToken",


result.token



);





if(result.user){



localStorage.setItem(


"NightCastUser",


JSON.stringify(result.user)



);


}






document.getElementById(

"status"

).innerHTML =


`

<span class="green">

✔ ورود موفق

</span>


<br>


اطلاعات نشست ذخیره شد

`;





loadCurrentUser();





}



else{


document.getElementById(

"status"

).innerHTML =



`

<span class="red">

✖ ورود ناموفق

</span>

`;



}




return result;



}









// =====================================
// AUTH HEADER
// =====================================


function getAuthHeaders(){



const token =


localStorage.getItem(


"NightCastToken"


);





if(!token){


return {


"Content-Type":

"application/json"


};


}





return {



"Content-Type":

"application/json",



"Authorization":

"Bearer " + token



};



}









// =====================================
// CHECK CURRENT USER
// =====================================


async function checkMe(){



const result =


await apiRequest(


"/public/me",



{


method:"GET",



headers:


getAuthHeaders()



}



);





if(result.success && result.user){



localStorage.setItem(


"NightCastUser",


JSON.stringify(result.user)



);



loadCurrentUser();



}




return result;



}









// =====================================
// DOWNLOAD TEST
// =====================================


async function checkDownload(){



const id =


prompt(


"شماره ID پادکست را وارد کنید"


);





if(!id){


return;


}





return await apiRequest(



"/public/download/" + id,



{


method:"GET",



headers:


getAuthHeaders()



}



);



}


     // =====================================
// PART 3/3
// USER INFO + TOKEN + LOGOUT
// =====================================







// =====================================
// LOAD CURRENT USER
// =====================================


function loadCurrentUser(){



const box =


document.getElementById(

"userInfo"

);





const token =


localStorage.getItem(

"NightCastToken"

);




const userData =


localStorage.getItem(

"NightCastUser"

);






if(!token || !userData){



box.innerHTML =



`

<div class="user-guest">

⚠️ کاربری وارد نشده است

</div>

`;



return;



}






try{



const user =


JSON.parse(userData);





box.innerHTML =



`

<div>

🟢 وضعیت:

<span class="user-online">

وارد شده

</span>

</div>


<div>

👤 نام:

${user.full_name || "-"}

</div>


<div>

🆔 Username:

${user.username || "-"}

</div>


<div>

📧 Email:

${user.email || "-"}

</div>


<div>

⭐ Role:

${user.role || "user"}

</div>


`;





}

catch(error){



box.innerHTML =



`

<span class="red">

خطا در خواندن اطلاعات کاربر

</span>

`;



}




}









// =====================================
// SHOW TOKEN
// =====================================


function showToken(){



const token =


localStorage.getItem(

"NightCastToken"

);





showOutput({


token:

token

?

token.substring(0,30)+"..."

:

null



});



}









// =====================================
// LOGOUT
// =====================================


async function logoutUser(){



const token =


localStorage.getItem(

"NightCastToken"

);






try{



if(token){



await fetch(



API_URL + "/auth/logout",



{


method:"POST",



headers:{



"Authorization":

"Bearer " + token



}



}



);



}



}

catch(error){



console.log(

"Logout API Error",

error

);



}






localStorage.removeItem(

"NightCastToken"

);



localStorage.removeItem(

"NightCastUser"

);







document.getElementById(

"status"

).innerHTML =



`

<span class="green">

✔ خروج انجام شد

</span>

`;





loadCurrentUser();






}









// =====================================
// INITIAL LOAD
// =====================================


loadCurrentUser();





console.log(

"NightCast User API Console Loaded"

);



</script>



</body>


</html>
