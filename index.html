<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NightCast | پلی به سوی آینده</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap');


*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}


body{

    font-family:'Vazirmatn',sans-serif;

    min-height:100vh;

    background:
    radial-gradient(circle at top,#243b55,#141e30 60%);

    color:white;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:30px;

}


.container{

    width:100%;
    max-width:900px;

    text-align:center;

}


.logo{

    width:120px;
    height:120px;

    margin:auto;

    border-radius:50%;

    background:
    linear-gradient(135deg,#00c6ff,#0072ff);

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:45px;

    font-weight:800;

    box-shadow:
    0 0 40px rgba(0,198,255,.5);

}


h1{

    margin-top:25px;

    font-size:38px;

    font-weight:800;

}


.subtitle{

    margin-top:10px;

    font-size:18px;

    color:#ddd;

}


.social-grid{

    margin-top:45px;

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(180px,1fr));

    gap:22px;

}



.social-card{

    text-decoration:none;

    color:white;

    background:

    rgba(255,255,255,.08);

    backdrop-filter:blur(15px);

    border:1px solid rgba(255,255,255,.15);

    border-radius:25px;

    padding:25px 15px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:15px;

    transition:.35s;


}



.social-card:hover{

    transform:translateY(-10px) scale(1.03);

    background:
    rgba(255,255,255,.18);

    box-shadow:
    0 20px 40px rgba(0,0,0,.3);

}



.social-card img{

    width:55px;

    height:55px;

}



.social-card span{

    font-size:18px;

    font-weight:600;

}



.footer{

    margin-top:45px;

    color:#aaa;

    font-size:14px;

}



@media(max-width:500px){

h1{
font-size:30px;
}

.social-grid{

grid-template-columns:
repeat(2,1fr);

}

.social-card{

padding:18px 8px;

}

}


</style>

</head>


<body>


<div class="container">




<h1>
رادیو NightCast
