<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
NightCast Ver4 - API Test 2
</title>


<style>

body{

font-family:tahoma;
background:#f5f6fa;
padding:20px;
direction:rtl;

}


h1{

color:#6c5ce7;

}


.box{

background:white;
border-radius:15px;
padding:20px;
margin-bottom:20px;
box-shadow:0 5px 20px #0001;

}


.title{

font-size:20px;
font-weight:bold;
margin-bottom:15px;

}


.success{

color:green;
font-weight:bold;

}


.error{

color:red;
font-weight:bold;

}


pre{

background:#111;
color:#00ff88;
padding:15px;
border-radius:10px;
overflow:auto;
direction:ltr;

}


table{

width:100%;
border-collapse:collapse;

}


td,th{

border:1px solid #ddd;
padding:10px;
text-align:center;

}


button{

background:#6c5ce7;
color:white;
border:0;
padding:12px 25px;
border-radius:10px;
font-size:16px;

}


</style>


</head>



<body>


<h1>
🧪 NightCast Ver4 API Test 2
</h1>


<button onclick="runTest()">
شروع تست
</button>




<div class="box">

<div class="title">
Token Status
</div>

<div id="tokenResult">

در انتظار...

</div>

</div>






<div class="box">

<div class="title">
Auth /me
</div>

<pre id="authResult">
-
</pre>

</div>







<div class="box">

<div class="title">
Dashboard API
</div>

<pre id="dashboardResult">
-
</pre>

</div>








<div class="box">

<div class="title">
Podcasts API
</div>

<div id="podcastCount">
-
</div>


<table>

<thead>

<tr>

<th>
ID
</th>

<th>
Title
</th>

<th>
Status
</th>

<th>
Date
</th>

</tr>

</thead>


<tbody id="podcastTable">

</tbody>


</table>


</div>







<div class="box">

<div class="title">
Books API
</div>

<pre id="booksResult">
-
</pre>

</div>








<div class="box">

<div class="title">
Users API
</div>

<pre id="usersResult">
-
</pre>

</div>









<script>


const API_URL =

"https://nightcast-api.tomasgermany2580.workers.dev/api/v1";






function token(){


return localStorage.getItem(
"NightCastToken"
);


}







async function request(endpoint){



try{


const headers={

"Content-Type":
"application/json"

};



const t=token();


if(t){

headers.Authorization =
"Bearer "+t;

}




const res =
await fetch(

API_URL+endpoint,

{

headers

}

);



const data =
await res.json();



return {

status:res.status,

data

};


}

catch(e){


return {

error:e.message

};


}



}









async function runTest(){



// TOKEN


const t=token();



document.getElementById(
"tokenResult"
).innerHTML =

t

?

"<span class='success'>✅ Token موجود است</span>"

:

"<span class='error'>❌ Token وجود ندارد</span>";









// AUTH ME


let auth =
await request(
"/auth/me"
);



document.getElementById(
"authResult"
).textContent =

JSON.stringify(
auth,
null,
2
);









// DASHBOARD


let dashboard =
await request(
"/admin/dashboard"
);



document.getElementById(
"dashboardResult"
).textContent =

JSON.stringify(
dashboard,
null,
2
);









// PODCASTS


let podcasts =
await request(
"/podcasts"
);




if(
podcasts.data &&
podcasts.data.podcasts
){



const list =
podcasts.data.podcasts;



document.getElementById(
"podcastCount"
).innerHTML =

"<span class='success'>تعداد پادکست: "
+
list.length
+
"</span>";




let html="";



list.forEach(p=>{


html += `

<tr>

<td>${p.id}</td>

<td>${p.title || "-"}</td>

<td>${p.status || "-"}</td>

<td>${p.created_at || "-"}</td>

</tr>

`;


});



document.getElementById(
"podcastTable"
).innerHTML=html;


}

else{


document.getElementById(
"podcastCount"
).innerHTML=

"<span class='error'>خطا در دریافت پادکست</span>";


}









// BOOKS


let books =
await request(
"/books"
);



document.getElementById(
"booksResult"
).textContent =

JSON.stringify(
books,
null,
2
);









// USERS


let users =
await request(
"/users"
);



document.getElementById(
"usersResult"
).textContent =

JSON.stringify(
users,
null,
2
);






}



</script>



</body>

  </html>
