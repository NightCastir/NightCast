
<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex,nofollow,noarchive"><title>ورود مدیریت NightCast</title><style>

}

}

</style></head><body><div class="container"><div class="card"><div class="logo">

</div><div class="subtitle">

📋 گزارش عملیات
</div><div id="log">
صفحه Login آماده است.
</div></div></div><script>

"use strict";


/*
|--------------------------------------------------------------------------
| NightCast API
|--------------------------------------------------------------------------
*/

const API_BASE =
"https://nightcast-api.tomasgermany2580.workers.dev/api/v1";


const TOKEN_KEY =
"NightCastToken";


const USER_KEY =
"NightCastAdminUser";


const DASHBOARD =
"dashboard.html";



/*
|--------------------------------------------------------------------------
| Elements
|--------------------------------------------------------------------------
*/

const form =
document.getElementById("loginForm");


const usernameInput =
document.getElementById("username");


const passwordInput =
document.getElementById("password");


const loginButton =
document.getElementById("loginButton");


const message =
document.getElementById("message");


const logBox =
document.getElementById("log");



/*
|--------------------------------------------------------------------------
| Logger
|--------------------------------------------------------------------------
*/

function log(text){

    const time =
        new Date().toLocaleTimeString("fa-IR");

    logBox.textContent +=
        "\n[" +
        time +
        "] " +
        text;

    logBox.scrollTop =
        logBox.scrollHeight;

}



/*
|--------------------------------------------------------------------------
| Message
|--------------------------------------------------------------------------
*/

function showMessage(
    text,
    type=""
){

    message.className =
        type;

    message.textContent =
        text;

}



/*
|--------------------------------------------------------------------------
| Login
|--------------------------------------------------------------------------
*/

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const username =
            usernameInput.value.trim();


        const password =
            passwordInput.value;


        if(!username){

            showMessage(
                "نام کاربری را وارد کنید.",
                "error"
            );

            usernameInput.focus();

            return;

        }


        if(!password){

            showMessage(
                "رمز عبور را وارد کنید.",
                "error"
            );

            passwordInput.focus();

            return;

        }


        loginButton.disabled =
            true;


        loginButton.textContent =
            "در حال ورود...";


        logBox.textContent =
            "";


        log(
            "شروع فرآیند ورود."
        );


        log(
            "Username دریافت شد."
        );


        log(
            "درخواست ارسال می‌شود:"
        );


        log(
            API_BASE +
            "/auth/login"
        );


        showMessage(
            "⏳ در حال بررسی اطلاعات ورود..."
        );


        try{


            /*
            |--------------------------------------------------------------------------
            | مرحله 1
            |--------------------------------------------------------------------------
            */

            const loginResponse =
                await fetch(

                    API_BASE +
                    "/auth/login",

                    {

                        method:"POST",

                        mode:"cors",

                        headers:{

                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"

                        },

                        cache:"no-store",

                        body:
                            JSON.stringify({

                                username:
                                    username,

                                password:
                                    password

                            })

                    }

                );


            log(
                "پاسخ Login دریافت شد."
            );


            log(
                "HTTP Status: " +
                loginResponse.status
            );


            let loginData;


            try{

                loginData =
                    await loginResponse.json();

            }

            catch(error){

                log(
                    "❌ پاسخ Worker JSON نیست."
                );


                showMessage(
                    "❌ پاسخ نامعتبر از Worker دریافت شد.",
                    "error"
                );


                return;

            }


            log(
                "JSON با موفقیت دریافت شد."
            );


            /*
            |--------------------------------------------------------------------------
            | Login failure
            |--------------------------------------------------------------------------
            */

            if(
                !loginResponse.ok ||
                loginData.success !== true
            ){

                log(
                    "❌ Login ناموفق."
                );


                log(
                    "Message: " +
                    (
                        loginData.message ||
                        "بدون پیام"
                    )
                );


                showMessage(

                    "❌ ورود ناموفق بود.\n" +
                    (
                        loginData.message ||
                        "نام کاربری یا رمز عبور اشتباه است."
                    ),

                    "error"

                );


                return;

            }


            /*
            |--------------------------------------------------------------------------
            | Token
            |--------------------------------------------------------------------------
            */

            if(
                typeof loginData.token !== "string" ||
                loginData.token.length < 20
            ){

                log(
                    "❌ Login موفق اعلام شد ولی Token وجود ندارد."
                );


                showMessage(
                    "❌ Session دریافت نشد.",
                    "error"
                );


                return;

            }


            /*
            |--------------------------------------------------------------------------
            | Token received
            |--------------------------------------------------------------------------
            */

            log(
                "✅ Login موفق."
            );


            log(
                "✅ Session Token دریافت شد."
            );


            /*
            |--------------------------------------------------------------------------
            | User
            |--------------------------------------------------------------------------
            */

            if(loginData.user){

                log(
                    "Admin Username: " +
                    (
                        loginData.user.username ||
                        username
                    )
                );


                log(
                    "Admin Role: " +
                    (
                        loginData.user.role ||
                        "نامشخص"
                    )
                );

            }



            /*
            |--------------------------------------------------------------------------
            | مرحله 2 — Verify Session
            |--------------------------------------------------------------------------
            */

            showMessage(
                "⏳ Login موفق شد؛ در حال بررسی Session..."
            );


            log(
                "در حال بررسی Session با /auth/me"
            );


            const meResponse =
                await fetch(

                    API_BASE +
                    "/auth/me",

                    {

                        method:"GET",

                        mode:"cors",

                        headers:{

                            "Accept":
                                "application/json",

                            "Authorization":
                                "Bearer " +
                                loginData.token

                        },

                        cache:"no-store"

                    }

                );


            log(
                "/auth/me HTTP Status: " +
                meResponse.status
            );


            let meData;


            try{

                meData =
                    await meResponse.json();

            }

            catch(error){

                log(
                    "❌ پاسخ /auth/me JSON نیست."
                );


                showMessage(
                    "❌ Session قابل بررسی نیست.",
                    "error"
                );


                return;

            }


            /*
            |--------------------------------------------------------------------------
            | Session failed
            |--------------------------------------------------------------------------
            */

            if(
                !meResponse.ok ||
                meData.success !== true
            ){

                log(
                    "❌ Session توسط Worker تأیید نشد."
                );


                log(
                    "Session Message: " +
                    (
                        meData.message ||
                        "بدون پیام"
                    )
                );


                showMessage(
                    "❌ Login انجام شد ولی Session معتبر نیست.",
                    "error"
                );


                return;

            }


            /*
            |--------------------------------------------------------------------------
            | SUCCESS
            |--------------------------------------------------------------------------
            */

            log(
                "✅ Session معتبر است."
            );


            log(
                "✅ Login با موفقیت تأیید شد."
            );


            /*
            |--------------------------------------------------------------------------
            | Save temporary session
            |--------------------------------------------------------------------------
            |
            | فقط برای تست Dashboard فعلی.
            |
            */

            sessionStorage.setItem(
                TOKEN_KEY,
                loginData.token
            );


            if(loginData.user){

                sessionStorage.setItem(

                    USER_KEY,

                    JSON.stringify({

                        id:
                            loginData.user.id ??
                            null,

                        username:
                            loginData.user.username ??
                            null,

                        full_name:
                            loginData.user.full_name ??
                            null,

                        role:
                            loginData.user.role ??
                            null

                    })

                );

            }


            log(
                "✅ Session برای Dashboard آماده شد."
            );


            showMessage(

                "✅ با موفقیت وارد شدید.\n" +
                "Session معتبر است.\n" +
                "در حال ورود به Dashboard...",

                "success"

            );


            log(
                "در حال انتقال به dashboard.html ..."
            );


            /*
            |--------------------------------------------------------------------------
            | Redirect
            |--------------------------------------------------------------------------
            */

            setTimeout(
                function(){

                    window.location.href =
                        DASHBOARD;

                },
                1000
            );


        }

        catch(error){


            log(
                "❌ خطای Fetch:"
            );


            log(
                error.message ||
                String(error)
            );


            showMessage(

                "❌ ارتباط با Worker برقرار نشد.\n" +
                (
                    error.message ||
                    "خطای نامشخص"
                ),

                "error"

            );

        }


        finally{

            loginButton.disabled =
                false;


            loginButton.textContent =
                "ورود";

        }

    }

);

</script></body></html>
