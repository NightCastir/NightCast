
name: Build NightCast Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # امکان اجرای دستی

jobs:
  build:
    name: Build Debug + Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          npm install
          npx cap --version

      - name: Add Android platform (if not exists)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ---------- Debug APK ----------
      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      # ---------- Release APK (signed if secrets exist) ----------
      - name: Decode Keystore (if available)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > nightcast-release.keystore
          echo "keystore properties created"

      - name: Create keystore.properties
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          cat > android/keystore.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../nightcast-release.keystore
          EOF

      - name: Configure signing in build.gradle
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          # اضافه کردن signingConfigs به build.gradle اگر وجود نداشته باشد
          if ! grep -q "signingConfigs" android/app/build.gradle; then
            sed -i '/android {/a\    signingConfigs {\n        release {\n            if (project.hasProperty("KEYSTORE_PASSWORD")) {\n                storeFile file(KEYSTORE_FILE)\n                storePassword KEYSTORE_PASSWORD\n                keyAlias KEY_ALIAS\n                keyPassword KEY_PASSWORD\n            }\n        }\n    }' android/app/build.gradle
          fi

      - name: Build Release APK
        run: |
          cd android
          if [ -f "../nightcast-release.keystore" ]; then
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=../nightcast-release.keystore \
              -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
              -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
              -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}" \
              --stacktrace
          else
            ./gradlew assembleRelease --stacktrace
            echo "⚠️ Release APK is unsigned (no keystore secrets provided)"
          fi

      # ---------- Upload Artifacts ----------
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NightCast-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NightCast-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: List built APKs
        run: |
          echo "=== Built APKs ==="
          find android/app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;
