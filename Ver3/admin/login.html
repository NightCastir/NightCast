<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NightCast Login</title>

<link rel="stylesheet" href="../css/style.css">

</head>


<body>


<div class="login-container">


    <div class="login-box">


        <h1>
            NightCast
        </h1>


        <p>
            ورود به پنل مدیریت
        </p>



        <form id="loginForm">


            <div class="form-group">

                <label>
                    نام کاربری
                </label>

                <input 
                type="text"
                id="username"
                placeholder="Username"
                >

            </div>




            <div class="form-group">

                <label>
                    رمز عبور
                </label>

                <input
                type="password"
                id="password"
                placeholder="Password"
                >

            </div>




            <button type="submit">

                ورود

            </button>



            <div id="message"></div>


        </form>



    </div>


</div>


<script src="../js/login.js"></script>


</body>

</html>
