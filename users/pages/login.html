<!DOCTYPE html>

<html lang="fa" dir="rtl">


<head>


<meta charset="UTF-8">


<meta name="viewport"
content="width=device-width, initial-scale=1.0">



<title>

ورود به NightCast

</title>





<link rel="stylesheet"
href="../css/user-core.css">


<link rel="stylesheet"
href="../css/user-layout.css">


<link rel="stylesheet"
href="../css/user-components.css">


<link rel="stylesheet"
href="../css/user-responsive.css">



</head>





<body data-page="login">





<!-- ==========================
LOADER
========================== -->


<div id="globalLoader"
class="loader-container">



<div class="loader"></div>



<p>

لطفاً کمی صبر کنید...

</p>



</div>









<!-- ==========================
LOGIN WRAPPER
========================== -->


<main class="auth-page">





<div class="auth-box">





<div class="auth-logo">


<span>

◉

</span>



NightCast



</div>








<h1>

ورود به رادیو NightCast

</h1>





<p>

برای ذخیره علاقه‌مندی‌ها،
دانلود و ثبت نظر وارد شوید.

</p>








<div class="auth-tabs">



<button
class="auth-tab active"
data-tab="emailLogin">


ایمیل


</button>






<button
class="auth-tab"
data-tab="smsLogin">


پیامک


</button>




</div>









<!-- ==========================
EMAIL LOGIN FORM
========================== -->


<section
id="emailLogin"
class="auth-form active">





<div class="form-group">


<label>

نام کاربری / ایمیل

</label>



<input
type="text"
id="loginUsername"
placeholder="example@email.com">



</div>








<div class="form-group">


<label>

رمز عبور

</label>



<input
type="password"
id="loginPassword"
placeholder="رمز عبور">



</div>








<button
id="btnEmailLogin"
class="btn btn-primary full">


ورود


</button>





</section>


<!-- ==========================
SMS LOGIN FORM
========================== -->


<section
id="smsLogin"
class="auth-form">






<div class="form-group">


<label>

شماره موبایل

</label>




<input

type="tel"

id="phoneNumber"

placeholder="0912xxxxxxx">



</div>









<div class="form-group">


<label>

کد تأیید

</label>




<input

type="number"

id="smsCode"

placeholder="کد پیامک شده">



</div>









<button

id="btnSendSMS"

class="btn btn-secondary full">


ارسال کد ورود


</button>








<button

id="btnVerifySMS"

class="btn btn-primary full">


تأیید و ورود


</button>






</section>









<!-- ==========================
SOCIAL LOGIN PLACEHOLDER
(FUTURE OPENAI / GOOGLE)
========================== -->



<div class="social-login">





<div class="divider">


<span>

یا

</span>


</div>







<button

class="social-btn"

id="btnOpenAILogin">


ورود سریع با حساب OpenAI


</button>








<button

class="social-btn"

id="btnGoogleLogin">


ورود با Google


</button>







</div>









<!-- ==========================
REGISTER
========================== -->



<div class="auth-footer">





<p>


حساب کاربری ندارید؟



<a href="register.html">


ثبت‌نام کنید


</a>



</p>








<p>


<a href="../index.html">


ورود به عنوان مهمان


</a>


</p>






</div>








</div>


</main>







<!-- ==========================
TOAST
========================== -->


<div id="toastContainer"></div>







<script src="../js/api.js"></script>

<script src="../js/auth.js"></script>

<script src="../js/ui.js"></script>

<script src="../js/login.js"></script>





</body>


</html>
