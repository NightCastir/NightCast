<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NightCast CMS</title>


<link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet" href="../css/admin.css">

<link rel="stylesheet" href="../css/responsive.css">


</head>


<body>


<div class="wrapper">


<!-- SIDEBAR -->

<aside class="sidebar">


<div class="logo">

🎙 NightCast

</div>



<nav class="menu">


<a href="#" data-view="dashboard">

🏠 داشبورد

</a>


<a href="#" data-view="podcasts">

🎙 پادکست‌ها

</a>


<a href="#" data-view="books">

📚 کتاب‌ها

</a>


<a href="#" data-view="authors">

👤 نویسنده‌ها

</a>


<a href="#" data-view="categories">

🏷 دسته‌بندی‌ها

</a>


<a href="#" data-view="media">

🖼 مدیا

</a>


<a href="#" data-view="users">

👥 کاربران

</a>


<a href="#" data-view="settings">

⚙ تنظیمات

</a>



</nav>



<div class="logout">


<button id="btnLogout">

🚪 خروج

</button>


</div>


</aside>





<!-- MAIN -->


<section class="main">



<header class="header">


<h2>

NightCast CMS

</h2>



<div class="user" id="userInfo">

در حال بررسی...

</div>



</header>



<main class="content">


<div class="card" id="contentArea">


<h2>

به پنل مدیریت NightCast خوش آمدید

</h2>


<p>

سیستم مدیریت پادکست و محتوای صوتی

</p>


</div>



</main>



</section>



</div>

  <!-- DASHBOARD CARDS -->

<div id="dashboardWidgets" style="display:none;">


<div class="stats-grid">


<div class="stat-card">

<div class="stat-icon">
🎙
</div>

<div>

<h3>
پادکست‌ها
</h3>

<strong id="podcastCount">
0
</strong>

</div>

</div>




<div class="stat-card">

<div class="stat-icon">
👥
</div>

<div>

<h3>
کاربران
</h3>

<strong>
1
</strong>

</div>

</div>





<div class="stat-card">

<div class="stat-icon">
▶️
</div>

<div>

<h3>
شنونده‌ها
</h3>

<strong>
0
</strong>

</div>

</div>





<div class="stat-card">

<div class="stat-icon">
📁
</div>

<div>

<h3>
مدیا
</h3>

<strong>
0
</strong>

</div>

</div>


</div>


</div>





</main>


</section>


</div>





<!-- SCRIPTS -->


<script src="../js/auth.js"></script>

<script src="../js/podcasts.js"></script>



<script>



document
.querySelectorAll(".menu a")
.forEach(item=>{


item.addEventListener(

"click",

function(e){


e.preventDefault();



const view =
this.dataset.view;



const area =
document.getElementById("contentArea");




if(view==="dashboard"){


area.innerHTML =

`

<div class="card">


<h2>
داشبورد
</h2>


<div class="stats-grid">


<div class="stat-card">

<h3>
🎙 پادکست‌ها
</h3>

<p>
مدیریت قسمت‌های صوتی
</p>

</div>



<div class="stat-card">

<h3>
🖼 مدیا
</h3>

<p>
فایل‌های صوتی و تصویری
</p>

</div>


</div>


</div>


`;



}





else if(view==="podcasts"){


loadPodcasts();


}





else{


area.innerHTML =

`

<div class="card">


<h2>

${this.innerText}

</h2>


<p>

این بخش در حال توسعه است.

</p>


</div>


`;



}



}


);


});





document

.getElementById("btnLogout")

.onclick = logout;



</script>



</body>

</html>
