name: Build NightCast APK

on:
  workflow_dispatch:   # دستی اجرا می‌شود
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json << EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

      - name: Generate Keystore (برای امضای APK)
        run: |
          keytool -genkeypair -v \
            -keystore android.keystore \
            -alias nightcast \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass nightcast123 \
            -keypass nightcast123 \
            -dname "CN=NightCast, OU=Dev, O=NightCast, L=Tehran, ST=Tehran, C=IR"

      - name: Create TWA Manifest
        run: |
          cat > twa-manifest.json << EOF
          {
            "packageId": "ir.nightcast.app",
            "host": "nightcast.ir",
            "name": "NightCast",
            "launcherName": "NightCast",
            "display": "standalone",
            "themeColor": "#050a16",
            "themeColorDark": "#050a16",
            "navigationColor": "#050a16",
            "navigationColorDark": "#050a16",
            "backgroundColor": "#050a16",
            "enableNotifications": true,
            "startUrl": "/",
            "iconUrl": "https://nightcast.ir/assets/icons/icon-512.png",
            "maskableIconUrl": "https://nightcast.ir/assets/icons/icon-512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "android.keystore",
              "alias": "nightcast"
            },
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap"
          }
          EOF

      - name: Initialize TWA Project
        run: |
          bubblewrap init --manifest=./twa-manifest.json --directory=twa --skipPwaValidation || true

      - name: Build APK
        working-directory: twa
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: nightcast123
          BUBBLEWRAP_KEY_PASSWORD: nightcast123
        run: |
          printf "Y\nY\nY\nY\n" | bubblewrap build --skipPwaValidation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NightCast-APK
          path: |
            twa/*.apk
            twa/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
