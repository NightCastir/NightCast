<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<title>NightCast Upload Test</title>

</head>


<body>


<h2>
تست آپلود NightCast Media
</h2>



<input 
type="file"
id="file"
>



<select id="type">

<option value="cover">
Cover
</option>

<option value="audio">
Audio
</option>

</select>



<button onclick="upload()">

آپلود

</button>


<pre id="result"></pre>




<script>


const API =

"https://nightcast-api.tomasgermany2580.workers.dev/api/v1";



async function upload(){



const file =

document.getElementById("file").files[0];



const type =

document.getElementById("type").value;



const token =

localStorage.getItem("NightCastToken");



const form = new FormData();


form.append(
"file",
file
);


form.append(
"type",
type
);





const response =

await fetch(

API+"/media/upload",

{

method:"POST",

headers:{


"Authorization":

"Bearer "+token


},

body:form


}

);



const data =

await response.json();



document.getElementById("result").innerHTML =

JSON.stringify(
data,
null,
2
);



}


</script>


</body>

</html>
