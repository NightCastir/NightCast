
<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
NightCast Books
</title>


<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/dashboard.css">

</head>


<body>


<div class="nc-app">


<!-- SIDEBAR -->

<aside class="nc-sidebar">


<div class="nc-sidebar-header">

<h2>
NightCast
</h2>

</div>


<nav class="nc-sidebar-menu">


<a class="nc-menu-item">

🏠

<span>
داشبورد
</span>

</a>


<a class="nc-menu-item active">

📚

<span>
کتاب‌ها
</span>

</a>


<a class="nc-menu-item">

🎙

<span>
پادکست‌ها
</span>

</a>


</nav>


</aside>



<section class="nc-main">



<header class="nc-header">

<h3>
مدیریت کتاب‌ها
</h3>

</header>



<main class="nc-content">


<div class="nc-container">



<section class="nc-card">


<div class="nc-card-header">

<h2 class="nc-card-title">

افزودن کتاب جدید

</h2>

</div>



<div class="nc-form">



<label>
عنوان کتاب
</label>

<input 
id="bookTitle"
type="text"
placeholder="عنوان کتاب">


<label>
Slug
</label>

<input 
id="bookSlug"
type="text"
placeholder="slug">


<label>
نویسنده
</label>

<select id="authorSelect">

<option>
در حال بارگذاری...
</option>

</select>



<label>
دسته‌بندی
</label>

<select id="categorySelect">

<option>
در حال بارگذاری...
</option>

</select>



<label>
توضیحات
</label>

<textarea 
id="description"
rows="5">
</textarea>



<label>
سال انتشار
</label>

<input
id="publishYear"
type="number">



<label>
تعداد صفحات
</label>

<input
id="pages"
type="number">



<label>
وضعیت
</label>

<select id="status">

<option value="draft">
پیش‌نویس
</option>

<option value="published">
منتشر شده
</option>

</select>



<label>

تصویر جلد (URL)

</label>


<input
id="coverUrl"
type="text">



<button 
id="saveBook"
class="nc-btn nc-btn-primary">

ذخیره کتاب

</button>



</div>


</section>




<section class="nc-card">


<div class="nc-card-header">

<h2 class="nc-card-title">

لیست کتاب‌ها

</h2>


</div>


<div id="booksList">

در حال دریافت کتاب‌ها...

</div>


</section>




</div>


</main>



</section>


</div>



<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/books.js"></script>


</body>

</html>
