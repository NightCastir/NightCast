<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>NightCast API Tester</title>

<style>

body{

background:#111;

color:#fff;

font-family:tahoma;

padding:20px;

}

button{

width:100%;

padding:15px;

margin:8px 0;

font-size:18px;

cursor:pointer;

}

pre{

background:#000;

padding:15px;

border-radius:10px;

overflow:auto;

min-height:250px;

white-space:pre-wrap;

}

</style>

</head>

<body>

<h2>

NightCast API Tester

</h2>

<button onclick="login()">

Login

</button>

<button onclick="checkSession()">

Check Session

</button>

<button onclick="logout()">

Logout

</button>

<hr>

<button onclick="books()">

Books

</button>

<button onclick="authors()">

Authors

</button>

<button onclick="categories()">

Categories

</button>

<button onclick="podcasts()">

Podcasts

</button>

<button onclick="tags()">

Tags

</button>

<button onclick="settings()">

Settings

</button>

<button onclick="testCreatePodcast()">
تست ثبت پادکست
</button>

<pre id="result"></pre>
  
<hr>

<pre id="result"></pre>

<script>

const API =
"https://nightcast-api.tomasgermany2580.workers.dev";

function token(){

return sessionStorage.getItem(
"NightCastSession"
);

}

function show(data){

document.getElementById("result").textContent=

JSON.stringify(data,null,2);

}
  async function login(){

const username =
prompt("Username");

const password =
prompt("Password");

const r =
await fetch(
API + "/api/admin/login",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
username,
password
})
}
);

const data =
await r.json();

if(data.success){

sessionStorage.setItem(
"NightCastSession",
data.token
);

}

show(data);

}

async function testCreatePodcast(){


const token = sessionStorage.getItem(
"NightCastSession"
);



const response = await fetch(

"https://nightcast-api.tomasgermany2580.workers.dev/api/podcasts",

{

method:"POST",

headers:{

"Content-Type":"application/json",

"Authorization":"Bearer " + token

},


body:JSON.stringify({

title:"تست از Test.html",

episode_number:1,

summary:"تست ثبت پادکست",

status:"draft"

})


}

);



const data = await response.json();


console.log(data);


document.getElementById("result").innerHTML =
JSON.stringify(data,null,2);



  }

async function checkSession(){

const r =
await fetch(
API + "/api/admin/me",
{
headers:{
Authorization:
"Bearer "
+
token()
}
}
);

show(
await r.json()
);

}

await fetch(

{
method:"POST",
headers:{
Authorization:
"Bearer "
+
token()
}
}
);

sessionStorage.removeItem(
"NightCastSession"
);

show(
await r.json()
);

}
