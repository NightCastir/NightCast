<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020411">
<meta name="description" content="صفحه مورد نظر در رادیو NightCast پیدا نشد">
<title>404 | NightCast Radio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
*{box-sizing:border-box}
:root{
 --cyan:#00eaff;--blue:#087cff;--purple:#812cff;--pink:#ff24d8;
 --white:#f8fbff;--muted:#aeb9d8;--bg:#02030d;
}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
 font-family:Vazirmatn,system-ui,sans-serif;color:var(--white);background:
 radial-gradient(circle at 50% 48%,#10165b 0%,#070a27 18%,transparent 43%),
 radial-gradient(circle at 4% 0%,#064c9a 0,transparent 28%),
 radial-gradient(circle at 100% 0%,#5a0c9b 0,transparent 28%),
 linear-gradient(145deg,#02030c,#040619 50%,#02030b);
}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.bg-orb{position:fixed;border-radius:50%;filter:blur(35px);pointer-events:none;z-index:1}
.orb1{width:35vw;height:35vw;left:-15vw;top:25vh;background:#006cff22;animation:orb 9s ease-in-out infinite alternate}
.orb2{width:32vw;height:32vw;right:-13vw;top:10vh;background:#c300ff1c;animation:orb 11s ease-in-out -3s infinite alternate}
@keyframes orb{to{transform:translate(7vw,-5vh) scale(1.25)}}

.grid{
 position:fixed;inset:-100px;z-index:1;opacity:.13;pointer-events:none;
 background-image:linear-gradient(#00d9ff 1px,transparent 1px),linear-gradient(90deg,#00d9ff 1px,transparent 1px);
 background-size:60px 60px;transform:perspective(500px) rotateX(58deg) translateY(25%);
 animation:grid 14s linear infinite;
}
@keyframes grid{to{background-position:0 60px}}
.vignette{position:fixed;inset:0;z-index:4;pointer-events:none;background:radial-gradient(circle,transparent 45%,#000b 100%)}
.scan{
 position:fixed;left:0;right:0;top:-5px;height:2px;z-index:5;
 background:linear-gradient(90deg,transparent,#00eaff,transparent);
 box-shadow:0 0 22px #00eaff;opacity:.35;animation:scan 6s linear infinite;
}
@keyframes scan{to{top:105vh}}

header{
 position:fixed;top:25px;right:30px;z-index:10;
 display:flex;align-items:center;gap:10px;font-weight:800;font-size:14px;
}
.live{width:9px;height:9px;border-radius:50%;background:#00f0ff;box-shadow:0 0 8px #00f0ff,0 0 20px #00f0ff;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25;transform:scale(.55)}}

main{
 position:relative;z-index:7;width:100%;height:100%;
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 padding:25px 18px;text-align:center;
}

/* ================== NIGHTCAST NEON LOGO ================== */
.logo{
 position:relative;width:min(360px,70vw);aspect-ratio:1;margin-bottom:-4px;
 transform-style:preserve-3d;animation:float 4.5s ease-in-out infinite;
 cursor:pointer;
}
@keyframes float{
 0%,100%{transform:translateY(0) rotateX(0) rotateY(0)}
 50%{transform:translateY(-13px) rotateX(2deg) rotateY(-2deg)}
}
.ring{
 position:absolute;inset:2%;border-radius:50%;
 background:conic-gradient(from 205deg,#ff28db,#7a2cff,#086cff,#0eeaff,#19e8ff,#ff28db);
 -webkit-mask:radial-gradient(circle,transparent 0 77%,#000 78% 82%,transparent 83%);
 mask:radial-gradient(circle,transparent 0 77%,#000 78% 82%,transparent 83%);
 filter:drop-shadow(0 0 8px #ff2bdd) drop-shadow(0 0 18px #008cff);
 animation:spin 7s linear infinite;
}
.ring:after{
 content:"";position:absolute;inset:0;border-radius:50%;
 background:conic-gradient(transparent 0 35%,#fff 37%,transparent 39% 72%,#fff 74%,transparent 76%);
 filter:blur(2px);opacity:.85;
}
@keyframes spin{to{transform:rotate(360deg)}}

.headset{
 position:absolute;left:9%;right:9%;top:15%;height:72%;
 border:20px solid transparent;border-top-color:#1beaff;border-left-color:#9a29ff;border-right-color:#12dfff;
 border-radius:50% 50% 16% 16%;
 filter:drop-shadow(0 0 8px #00eaff) drop-shadow(0 0 17px #862cff);
 animation:head 3s ease-in-out infinite;
}
@keyframes head{50%{filter:drop-shadow(0 0 13px #00eaff) drop-shadow(0 0 27px #862cff)}}
.ear{
 position:absolute;top:51%;width:11%;height:39%;border-radius:24px;
 background:linear-gradient(#a22cff,#2222a4 48%,#00eaff);
 box-shadow:0 0 9px #8d2cff,0 0 25px #00dfff;
}
.ear.l{left:-5%}.ear.r{right:-5%}
.ear:after{content:"";position:absolute;inset:7px 4px;border-radius:20px;background:repeating-linear-gradient(135deg,#ffffff16 0 2px,transparent 2px 5px)}

.nclogo{
 position:absolute;z-index:3;inset:23% 18% 17%;
 display:flex;align-items:center;justify-content:center;
 font:900 clamp(88px,17vw,160px)/.8 Arial,sans-serif;letter-spacing:-24px;
 filter:drop-shadow(0 0 10px #fff) drop-shadow(0 0 25px #6d35ff) drop-shadow(0 0 30px #00dfff);
}
.nclogo b{background:linear-gradient(145deg,#fff 15%,#dcdcff 52%,#a03cff);-webkit-background-clip:text;color:transparent}
.nclogo b:last-child{background:linear-gradient(210deg,#fff 15%,#dfffff 50%,#15caff);-webkit-background-clip:text;color:transparent}
.play{
 position:absolute;z-index:6;left:50%;top:52%;transform:translate(-50%,-50%);
 width:25%;aspect-ratio:1;border-radius:50%;
 background:radial-gradient(circle at 35% 30%,#18235b,#030713 65%);
 border:2px solid #fff;box-shadow:0 0 10px #fff,0 0 25px #00eaff,inset 0 0 18px #00aaff;
 animation:playPulse 1.6s ease-in-out infinite;
}
.play:after{
 content:"";position:absolute;left:43%;top:32%;
 border-top:18px solid transparent;border-bottom:18px solid transparent;border-left:27px solid #fff;
 filter:drop-shadow(0 0 8px #00eaff);
}
@keyframes playPulse{50%{transform:translate(-50%,-50%) scale(1.08);box-shadow:0 0 16px #fff,0 0 40px #00eaff,inset 0 0 25px #00aaff}}
.bars{position:absolute;z-index:8;left:50%;bottom:13%;transform:translateX(-50%);display:flex;align-items:end;gap:5px;height:35px}
.bars i{width:4px;border-radius:5px;background:linear-gradient(#ff28d9,#00eaff);box-shadow:0 0 8px #00eaff;animation:bar .7s ease-in-out infinite alternate}
.bars i:nth-child(1){height:11px;animation-delay:-.3s}.bars i:nth-child(2){height:23px;animation-delay:-.1s}.bars i:nth-child(3){height:32px;animation-delay:-.5s}.bars i:nth-child(4){height:18px;animation-delay:-.2s}.bars i:nth-child(5){height:29px;animation-delay:-.4s}.bars i:nth-child(6){height:14px;animation-delay:-.7s}.bars i:nth-child(7){height:25px;animation-delay:-.15s}
@keyframes bar{to{transform:scaleY(.3)}}

/* Signal waves */
.waves{position:absolute;inset:-7%;border-radius:50%;pointer-events:none}
.wave{position:absolute;inset:18%;border:1px solid #00eaff55;border-radius:50%;animation:wave 3s ease-out infinite}
.wave:nth-child(2){animation-delay:1s}.wave:nth-child(3){animation-delay:2s}
@keyframes wave{0%{transform:scale(.7);opacity:0}20%{opacity:.8}100%{transform:scale(1.25);opacity:0}}

.error{
 margin-top:0;font:900 clamp(76px,13vw,132px)/.8 Arial,sans-serif;letter-spacing:8px;
 background:linear-gradient(90deg,#ff25da,#fff 42%,#0deaff 78%);
 -webkit-background-clip:text;color:transparent;
 filter:drop-shadow(0 0 16px #0adfff44);animation:glitch 4.5s infinite;
}
@keyframes glitch{
 0%,89%,100%{transform:translate(0);clip-path:inset(0)}
 90%{transform:translate(-5px);clip-path:inset(15% 0 55% 0)}
 91%{transform:translate(5px);clip-path:inset(60% 0 8% 0)}
 92%{transform:translate(0);clip-path:inset(0)}
}
h1{font-size:clamp(20px,3.6vw,31px);margin:12px 0 5px;font-weight:900}
.desc{margin:4px auto 18px;max-width:600px;color:var(--muted);font-size:14px;line-height:2}

.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{
 position:relative;min-width:180px;padding:12px 20px;border-radius:14px;
 color:#fff;text-decoration:none;font-size:13px;font-weight:800;
 border:1px solid #ffffff2b;background:#ffffff09;backdrop-filter:blur(12px);
 transition:.3s;overflow:hidden;
}
.btn:before{content:"";position:absolute;top:0;bottom:0;width:70px;right:-90px;background:linear-gradient(90deg,transparent,#fff6,transparent);transform:skewX(-20deg);animation:sheen 3.2s infinite}
@keyframes sheen{0%,55%{right:-90px}80%,100%{right:120%}}
.btn:hover{transform:translateY(-4px);border-color:#00eaff99;box-shadow:0 0 28px #00eaff22}
.btn.primary{background:linear-gradient(100deg,#7026e9dd,#009de9dd);box-shadow:0 0 25px #2b6dff35}

.signal{margin-top:15px;font-size:10px;color:#617097;letter-spacing:1px}
.signal b{color:#00eaff}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#00eaff;box-shadow:0 0 8px #00eaff;margin-left:5px;animation:blink 1s infinite}
footer{position:fixed;bottom:13px;z-index:8;color:#4d5a79;font-size:10px}

@media(max-height:760px){
 .logo{width:min(270px,57vw)}
 .error{font-size:78px}
 h1{font-size:21px}.desc{margin-bottom:12px}
}
@media(max-width:520px){
 header{top:17px;right:18px;font-size:12px}
 .logo{width:280px}
 .desc{font-size:12px;max-width:350px}
 .btn{min-width:155px;padding:11px 14px}
 footer{bottom:7px}
}
@media(prefers-reduced-motion:reduce){
 *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>

<body>
<canvas id="space"></canvas>
<div class="bg-orb orb1"></div><div class="bg-orb orb2"></div>
<div class="grid"></div><div class="scan"></div><div class="vignette"></div>

<header><span class="live"></span> رادیو NightCast</header>

<main>
 <div class="logo" id="logo" aria-label="NightCast">
   <div class="waves"><div class="wave"></div><div class="wave"></div><div class="wave"></div></div>
   <div class="ring"></div>
   <div class="headset"><span class="ear l"></span><span class="ear r"></span></div>
   <div class="nclogo"><b>N</b><b>C</b></div>
   <div class="play"></div>
   <div class="bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
 </div>

 <div class="error">404</div>
 <h1>این موج پیدا نشد!</h1>
 <p class="desc">
   فرکانسی که به دنبال آن هستید در دسترس نیست؛
   شاید صفحه جابه‌جا شده یا آدرس را اشتباه وارد کرده‌اید.
 </p>

 <div class="actions">
   <a class="btn primary" href="/"><i class="fa-solid fa-house"></i>&nbsp; بازگشت به NightCast</a>
   <a class="btn" href="javascript:history.back()"><i class="fa-solid fa-arrow-right"></i>&nbsp; صفحه قبلی</a>
 </div>

 <div class="signal"><span class="dot"></span> SIGNAL LOST &nbsp;•&nbsp; ERROR <b>404</b> &nbsp;•&nbsp; NIGHTCAST RADIO</div>
</main>

<footer>پلی به سوی آینده • NightCast</footer>

<script>
/* =========================
   Animated deep-space field
   ========================= */
const c=document.getElementById("space"),x=c.getContext("2d");
let W,H,D,stars=[],shooters=[],mouse={x:0,y:0};
function resize(){
 W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);
 c.width=W*D;c.height=H*D;c.style.width=W+"px";c.style.height=H+"px";
 x.setTransform(D,0,0,D,0,0);
 stars=Array.from({length:Math.min(170,Math.max(70,W*H/8000))},()=>({
  x:Math.random()*W,y:Math.random()*H,z:Math.random(),
  s:Math.random()*1.5+.2,a:Math.random()*.75+.15,
  h:Math.random()>.55?190:280
 }));
}
function starfield(){
 x.clearRect(0,0,W,H);
 for(const p of stars){
  p.y-=.08+p.z*.18;
  p.x+=Math.sin(p.y*.004)*.03;
  if(p.y<0){p.y=H;p.x=Math.random()*W}
  let a=p.a*(.65+.35*Math.sin(Date.now()*.002+p.x));
  x.beginPath();x.fillStyle=`hsla(${p.h},100%,75%,${a})`;
  x.shadowBlur=7;x.shadowColor=`hsl(${p.h},100%,65%)`;
  x.arc(p.x,p.y,p.s*(.5+p.z),0,Math.PI*2);x.fill();
 }
 x.shadowBlur=0;

 /* shooting stars */
 if(Math.random()<.018) shooters.push({
   x:Math.random()*W,y:Math.random()*H*.45,
   vx:7+Math.random()*7,vy:3+Math.random()*4,life:0
 });
 for(let i=shooters.length-1;i>=0;i--){
   const s=shooters[i];s.x+=s.vx;s.y+=s.vy;s.life++;
   const g=x.createLinearGradient(s.x,s.y,s.x-s.vx*6,s.y-s.vy*6);
   g.addColorStop(0,"rgba(255,255,255,.95)");
   g.addColorStop(.25,"rgba(0,234,255,.55)");g.addColorStop(1,"transparent");
   x.strokeStyle=g;x.lineWidth=2;x.beginPath();x.moveTo(s.x,s.y);x.lineTo(s.x-s.vx*7,s.y-s.vy*7);x.stroke();
   if(s.life>35)shooters.splice(i,1);
 }
 requestAnimationFrame(starfield);
}
resize();starfield();addEventListener("resize",resize);

/* Logo follows pointer/touch slightly */
const logo=document.getElementById("logo");
addEventListener("pointermove",e=>{
 const px=e.clientX/innerWidth-.5,py=e.clientY/innerHeight-.5;
 logo.style.transform=`translate(${px*14}px,${py*14}px) rotateX(${py*-5}deg) rotateY(${px*5}deg)`;
 mouse.x=e.clientX;mouse.y=e.clientY;
});
addEventListener("pointerleave",()=>logo.style.transform="");

/* Click the logo: temporary "radio pulse" */
logo.addEventListener("click",()=>{
 logo.animate([
  {transform:"scale(1)"},{transform:"scale(1.12)"},{transform:"scale(1)"}
 ],{duration:650,easing:"cubic-bezier(.2,1.6,.3,1)"});
});

/* Keyboard accessibility */
document.addEventListener("keydown",e=>{
 if(e.key==="Escape") location.href="/";
});
</script>
</body>
</html>
