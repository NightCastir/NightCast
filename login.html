<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>ورود | NightCast</title>

<link
rel="stylesheet"
href="style.css">

<link
rel="stylesheet"
href="css/profile.css">

</head>

<body>

<div class="user-card">

<div class="user-info">

<h2>

ورود به NightCast

</h2>

<p>

ایمیل یا شماره موبایل خود را وارد کنید

</p>

</div>

</div>

<div class="profile-menu">

<input

id="identity"

type="text"

autocomplete="username"

autocapitalize="off"

autocorrect="off"

spellcheck="false"

inputmode="email"

placeholder="example@gmail.com یا +989123456789">

<button

class="edit-profile"

id="sendCode">

ادامه

</button>

</div>

<div

id="verifyBox"

style="display:none">

<div class="profile-menu">

<input

id="verifyCode"

type="text"

maxlength="6"

inputmode="numeric"

autocomplete="one-time-code"

placeholder="کد ۶ رقمی">

<button

class="edit-profile"

id="verify">

ورود

</button>

</div>

</div>

<div

id="loading"

style="display:none">

در حال برقراری ارتباط...

</div>

<div id="toast"></div>

<script src="login.js"></script>

</body>

</html>
