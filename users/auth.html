<!DOCTYPE html>

<html lang="fa" dir="rtl">


<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
NightCast | ورود
</title>



<meta name="theme-color" content="#0b1220">



<link rel="stylesheet" href="css/core.css">


<link rel="stylesheet" href="css/auth.css">



<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">



</head>



<body data-theme="dark">





<div id="authLoader" class="auth-loader hidden">


<div class="loader-circle"></div>


<p>
در حال اتصال...
</p>


</div>








<main class="auth-page">






<section class="auth-card">






<div class="brand">


<div class="brand-icon">

<i class="fa-solid fa-radio"></i>

</div>




<h1>

Night<span>Cast</span>

</h1>


<p>
رادیوی تجربه
</p>


</div>









<div class="welcome">


<h2>
خوش آمدید
</h2>



<p>

برای ادامه تجربه شنیدن وارد شوید یا به عنوان مهمان ادامه دهید.

</p>


</div>









<div class="auth-actions">





<button

id="openidButton"

class="openid-btn">


<i class="fa-brands fa-google"></i>


<span>
ورود با OpenID
</span>


</button>








<button

id="guestButton"

class="guest-btn">


<i class="fa-solid fa-headphones"></i>


<span>
ادامه به عنوان مهمان
</span>


</button>







</div>










<div class="auth-footer">


<div>

<i class="fa-solid fa-shield-halved"></i>


ورود امن با OpenID


</div>



<div>

<i class="fa-solid fa-download"></i>


دانلود نیازمند حساب کاربری است


</div>



</div>








<div
id="authMessage"
class="auth-message">


</div>







</section>






</main>






<script src="js/auth-page.js"></script>



</body>


</html>
