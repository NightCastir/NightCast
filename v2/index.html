<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">


    <title>
        NightCast | پادکست خلاصه و تحلیل کتاب
    </title>


    <meta name="description"
          content="رادیو NightCast، پادکست خلاصه و تحلیل کتاب‌های ارزشمند">


    <meta name="theme-color"
          content="#0b1220">


    <link rel="icon"
          href="assets/images/logo.png">


    <link rel="manifest"
          href="manifest.json">


    <!-- Main CSS -->

    <link rel="stylesheet"
          href="assets/css/style.css?v=1.0.0">


    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


</head>



<body>



<!-- =========================
     HEADER
========================= -->

<header id="header">


    <div class="header-container">


        <a href="./"
           class="brand">


            <img src="assets/images/logo.png"
                 alt="NightCast">


            <span>
                NightCast
            </span>


        </a>



        <div class="header-actions">


            <button class="icon-btn"
                    id="search-btn">

                <i class="fa-solid fa-search"></i>

            </button>



            <button class="icon-btn"
                    id="user-btn">

                <i class="fa-solid fa-user"></i>

            </button>



            <button class="icon-btn"
                    id="theme-btn">

                <i class="fa-solid fa-moon"></i>

            </button>



            <button class="menu-btn">

                <i class="fa-solid fa-bars"></i>

            </button>


        </div>


    </div>



</header>






<!-- =========================
     MAIN
========================= -->


<main>



<!-- HERO -->

<section id="hero">


    <div class="hero-content">


        <img src="assets/images/logo.png"
             class="hero-image"
             alt="NightCast">


        <h1>

            پادکست خلاصه و تحلیل کتاب

        </h1>



        <p>

            مهم‌ترین ایده‌های کتاب‌های ارزشمند
            را کوتاه، عمیق و کاربردی بشنوید.

        </p>



        <button class="primary-btn">

            <i class="fa-solid fa-play"></i>

            شروع شنیدن

        </button>


    </div>


</section>






<!-- SEARCH BOX -->

<section id="search-box"
         class="hidden">


    <input type="text"
           placeholder="جستجوی کتاب، نویسنده یا موضوع...">


</section>






<!-- PODCAST LIST -->


<section id="podcast-feed">


</section>






<!-- GLOBAL PLAYER -->


<section id="player">


    <audio id="audio-player"
           controls>


    </audio>


</section>






</main>






<!-- =========================
     FOOTER
========================= -->


<footer id="footer">


    <div class="footer-container">


        <div>


            <img src="assets/images/logo.png"
                 alt="NightCast">


            <p>

                رادیو NightCast

                <br>

                خلاصه و تحلیل کتاب‌های ارزشمند

            </p>


        </div>





        <div class="social-links">


            <a href="#">

                <i class="fa-brands fa-youtube"></i>

            </a>


            <a href="#">

                <i class="fa-brands fa-telegram"></i>

            </a>


            <a href="#">

                <i class="fa-solid fa-globe"></i>

            </a>


        </div>




    </div>




    <div class="copyright">


        © 2026 NightCast

    </div>



</footer>






<!-- =========================
     JAVASCRIPT
========================= -->


<script src="assets/js/services/feed-service.js?v=1.0.0"></script>
<script src="assets/js/components/player.js?v=1.0.0"></script>

<script src="assets/js/components/feed.js?v=1.0.0"></script>


<script src="assets/js/app.js?v=1.0.0"></script>



</body>

</html>
