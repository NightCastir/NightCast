<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#050817">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex,follow">
  <title>NightCast | رادیوی فرهنگی</title>
  <style>
    :root{color-scheme:dark;--space:#050817;--blue:#83dfff;--gold:#f0c987;--violet:#a99bff}
    *{box-sizing:border-box}
    html,body{width:100%;min-height:100%;margin:0;background:var(--space)}
    body{min-height:100svh;min-width:320px;overflow:hidden;color:#f4f7ff;font-family:Vazirmatn,Tahoma,Arial,sans-serif}
    .nc-splash{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 50% 42%,rgba(34,67,140,.32),transparent 35%),radial-gradient(ellipse at 15% 85%,rgba(83,47,145,.18),transparent 38%),linear-gradient(145deg,#030510,#080f28 55%,#030510)}
    .nc-nebula{position:absolute;inset:-30%;pointer-events:none;opacity:.55;filter:blur(22px);background:conic-gradient(from 0deg at 50% 50%,transparent 0 16%,rgba(54,125,255,.12) 21%,transparent 30% 42%,rgba(157,104,255,.12) 48%,transparent 58% 72%,rgba(89,216,255,.1) 78%,transparent 88%);animation:nc-nebula-turn 32s linear infinite}
    .nc-starfield,.nc-starfield:before,.nc-starfield:after{position:absolute;inset:-12%;content:"";pointer-events:none;background-image:radial-gradient(1px 1px at 8% 17%,#fff 55%,transparent 70%),radial-gradient(2px 2px at 22% 67%,#9de6ff 55%,transparent 70%),radial-gradient(1px 1px at 39% 31%,#fff 55%,transparent 70%),radial-gradient(1px 1px at 61% 14%,#f0c987 55%,transparent 70%),radial-gradient(2px 2px at 78% 52%,#fff 55%,transparent 70%),radial-gradient(1px 1px at 90% 82%,#9de6ff 55%,transparent 70%),radial-gradient(1px 1px at 48% 88%,#fff 55%,transparent 70%);background-size:290px 260px;animation:nc-stars-drift 18s linear infinite}
    .nc-starfield:before{transform:scale(1.2);opacity:.42;background-position:130px 70px;background-size:370px 330px;animation-duration:27s;animation-direction:reverse}
    .nc-starfield:after{transform:scale(.85);opacity:.3;background-position:55px 140px;background-size:210px 230px;animation-duration:13s}
    .nc-center{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;width:min(90vw,440px);padding:26px 20px;text-align:center;animation:nc-arrive 1s cubic-bezier(.2,.8,.2,1) both}
    .nc-emblem{position:relative;width:clamp(132px,36vw,178px);aspect-ratio:1;display:grid;place-items:center;margin-bottom:36px;filter:drop-shadow(0 0 32px rgba(83,167,255,.18))}
    .nc-orbit{position:absolute;inset:14%;border:1px solid rgba(137,211,255,.7);border-radius:50%;transform:rotate(-28deg) scaleX(1.7);animation:nc-orbit-a 3.6s linear infinite}
    .nc-orbit:before{content:"";position:absolute;width:8px;height:8px;left:12%;top:14%;border-radius:50%;background:var(--gold);box-shadow:0 0 14px 4px rgba(240,201,135,.65)}
    .nc-orbit--b{inset:4%;border-color:rgba(169,155,255,.52);transform:rotate(55deg) scaleX(1.5);animation:nc-orbit-b 5.2s linear infinite}
    .nc-orbit--b:before{width:5px;height:5px;left:82%;top:15%;background:var(--blue);box-shadow:0 0 14px 4px rgba(131,223,255,.7)}
    .nc-orbit--c{inset:25%;border-color:rgba(240,201,135,.42);transform:rotate(12deg) scaleX(1.55);animation:nc-orbit-a 2.7s linear infinite reverse}
    .nc-core{position:relative;width:38%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 32% 27%,#fff 0,#b8eaff 8%,#6a9ff3 24%,#252b6b 56%,#080c20 75%);box-shadow:0 0 25px rgba(108,183,255,.7),0 0 68px rgba(85,119,255,.35),inset -12px -13px 22px rgba(0,0,0,.65);animation:nc-core-breathe 2.1s ease-in-out infinite}
    .nc-core:after{content:"";position:absolute;inset:-20%;border-radius:50%;border:1px solid rgba(174,219,255,.2);box-shadow:0 0 28px rgba(91,172,255,.12)}
    .nc-wordmark{font-family:Vazirmatn,Tahoma,Arial,sans-serif;font-size:clamp(1.45rem,5vw,2rem);font-weight:800;letter-spacing:.17em;direction:ltr;color:#f8fbff;text-shadow:0 0 26px rgba(128,196,255,.25)}
    .nc-tagline{margin-top:9px;color:#b9c9e7;font-size:clamp(.84rem,2.7vw,.98rem);line-height:1.9}
    .nc-progress-wrap{width:min(270px,72vw);margin-top:30px}
    .nc-progress-label{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;color:#9eb4d9;font-size:.72rem}
    .nc-live-dot{display:inline-block;width:6px;height:6px;margin-inline-end:7px;border-radius:50%;background:#8de5ff;box-shadow:0 0 12px #8de5ff;animation:nc-dot-pulse 1.1s ease-in-out infinite}
    .nc-progress{position:relative;height:5px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.09);border:1px solid rgba(176,212,255,.19);box-shadow:0 0 22px rgba(79,146,255,.12),inset 0 1px rgba(255,255,255,.07)}
    .nc-progress:before{content:"";position:absolute;inset:0 auto 0 0;width:43%;border-radius:inherit;background:linear-gradient(90deg,transparent,var(--gold) 24%,#fff5d9 45%,var(--blue) 78%,transparent);box-shadow:0 0 15px rgba(131,223,255,.8);animation:nc-progress-run 1.05s cubic-bezier(.55,.05,.45,.95) infinite}
    .nc-progress:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent);transform:translateX(-100%);animation:nc-progress-sheen 1.8s linear infinite}
    .nc-footer{margin-top:15px;color:rgba(174,193,224,.58);font-size:.68rem;letter-spacing:.08em;direction:ltr}
    .nc-footer:before,.nc-footer:after{content:"✦";display:inline-block;margin:0 9px;color:rgba(240,201,135,.65);font-size:.65rem;animation:nc-twinkle 1.7s ease-in-out infinite}
    .nc-footer:after{animation-delay:.8s}
    @keyframes nc-stars-drift{0%{transform:translate3d(0,0,0)}50%{transform:translate3d(-2.5%,1.5%,0)}100%{transform:translate3d(-5%,3%,0)}}
    @keyframes nc-orbit-a{from{rotate:0deg}to{rotate:360deg}}
    @keyframes nc-orbit-b{from{rotate:360deg}to{rotate:0deg}}
    @keyframes nc-core-breathe{0%,100%{transform:scale(.96);filter:brightness(.95)}50%{transform:scale(1.06);filter:brightness(1.25)}}
    @keyframes nc-progress-run{0%{transform:translateX(260%)}100%{transform:translateX(-280%)}}
    @keyframes nc-progress-sheen{to{transform:translateX(100%)}}
    @keyframes nc-nebula-turn{to{transform:rotate(360deg) scale(1.04)}}
    @keyframes nc-dot-pulse{0%,100%{opacity:.5;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
    @keyframes nc-twinkle{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
    @keyframes nc-arrive{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
    @media(max-height:560px){.nc-center{transform:scale(.78);padding:8px}.nc-emblem{margin-bottom:18px}.nc-progress-wrap{margin-top:18px}}
    @media(prefers-reduced-motion:reduce){.nc-nebula{animation:nc-nebula-turn 90s linear infinite}.nc-starfield,.nc-starfield:before,.nc-starfield:after{animation-duration:60s}.nc-orbit,.nc-orbit--b,.nc-core,.nc-progress:before,.nc-progress:after,.nc-live-dot,.nc-footer:before,.nc-footer:after{animation-duration:inherit!important}}
  </style>
</head>
<body>
  <main class="nc-splash" role="status" aria-live="polite" aria-label="در حال ورود به NightCast">
    <div class="nc-nebula" aria-hidden="true"></div>
    <div class="nc-starfield" aria-hidden="true"></div>
    <section class="nc-center">
      <div class="nc-emblem" aria-hidden="true">
        <span class="nc-orbit"></span><span class="nc-orbit nc-orbit--b"></span><span class="nc-orbit nc-orbit--c"></span><span class="nc-core"></span>
      </div>
      <div class="nc-wordmark">NIGHTCAST</div>
      <div class="nc-tagline">صداهایی برای کشف جهان‌های تازه</div>
      <div class="nc-progress-wrap">
        <div class="nc-progress-label"><span><i class="nc-live-dot"></i>در حال آماده‌سازی تجربه شنیداری</span><span aria-hidden="true">✦</span></div>
        <div class="nc-progress" role="progressbar" aria-label="در حال آماده‌سازی NightCast" aria-valuemin="0" aria-valuemax="100" aria-valuetext="در حال آماده‌سازی"></div>
      </div>
      <div class="nc-footer">CULTURE · STORIES · SOUND</div>
    </section>
  </main>
  <noscript><p style="position:fixed;bottom:20px;inset-inline:20px;text-align:center;color:#fff"><a href="/podcasts" style="color:#9de5ff">ورود به آرشیو پادکست‌های NightCast</a></p></noscript>
  <script>
    (function () {
      "use strict";
      var target = "/podcasts";
      window.setTimeout(function () {
        window.location.replace(target);
      }, 1550);
    })();
  </script>

<script>
/* NightCast app-like interaction layer; retire legacy PWA registrations. */
(function(){
  'use strict';
  document.addEventListener('contextmenu',function(event){event.preventDefault();});
  document.addEventListener('keydown',function(event){
    if((event.ctrlKey||event.metaKey)&&(['+','=','-','0','Add','Subtract'].includes(event.key)))event.preventDefault();
  },{capture:true});
  if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(registrations){registrations.forEach(function(registration){registration.unregister();});}).catch(function(){});}
})();
</script>
</body>
</html>
