name: Build NightCast Android APK

concurrency:
  group: nightcast-android-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - feat/cinematic-cosmos-redesign
    paths-ignore:
      - downloadrelease/NightCast.apk
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug + Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Node.js
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify canonical Android source structure
        run: |
          set -euo pipefail
          node tests/android-source-structure.cjs
          node tests/android-release-readiness.cjs


      # ============================================================
      # 3. Java 17
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java
        run: |
          set -e
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          echo "Checking JavaScript syntax in repository files..."
          find . -path './.git' -prune -o -path './node_modules' -prune -o -type f -name '*.js' -print0 \
            | xargs -0 -r -n1 node --check
          echo "JavaScript syntax checks passed."

      - name: Check inline JavaScript and critical asset references
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          
          const htmlFiles = ['index.html', 'users/index.html'];
          for (const file of htmlFiles) {
            const html = fs.readFileSync(file, 'utf8');
            const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi)];
            let checked = 0;
            for (const [index, match] of scripts.entries()) {
              const attrs = match[1] || '';
              const body = match[2] || '';
              if (/\bsrc\s*=/.test(attrs) || /application\/ld\+json/i.test(attrs) || !body.trim()) continue;
              new vm.Script(body, { filename: file + ':inline-script-' + index });
              checked++;
            }
            console.log('TRUE | Inline JavaScript syntax | ' + file + ' (' + checked + ' scripts)');
          }

          const critical = [
            'js/auth.js',
            'js/cosmic-experience.js',
            'js/router.js',
            'js/update-checker.js',
            'css/splash.css',
            'css/cosmic-experience.css',
            'users/index.html',
            'users/js/auth-page.js',
            'auth/login.html',
            'css/nightcast-cosmos.css',
            'css/nightcast-base.css',
            'css/nightcast-performance.css',
            'css/nightcast-profile.css',
            'js/nightcast-app.js',
            'js/nightcast-player.js',
            'js/nightcast-cosmos.js'
          ];
          for (const file of critical) {
            if (!fs.existsSync(file)) throw new Error('Missing critical asset: ' + file);
          }
          const root = fs.readFileSync('index.html', 'utf8');
          const rootApp = fs.readFileSync('js/nightcast-app.js', 'utf8');
          const rootSource = root + '\n' + rootApp;
          const archive = fs.readFileSync('users/index.html', 'utf8');

          // The root document is the canonical podcast archive and contains its own readiness loader.
          if (!root.includes('id="podcastGrid"') || !root.includes('id="nc-entry-loader"') || !rootSource.includes('function loadPodcasts')) {
            throw new Error('Root document is missing the podcast archive or its integrated readiness loader.');
          }
          if (!rootSource.includes('Promise.allSettled([loadPodcasts(), loadFavorites()])') || !rootSource.includes('dismissArchiveLoader')) {
            throw new Error('Root archive loader must wait for podcast data and favorites before dismissing.');
          }
          const authPageScript = fs.readFileSync('users/js/auth-page.js', 'utf8');
          const googleLoginPage = fs.readFileSync('users/login.html', 'utf8');
          const googleLoginScript = fs.readFileSync('users/js/login.js', 'utf8');
          const legacyAuthPage = fs.readFileSync('auth/login.html', 'utf8');
          const legacyWelcomePage = fs.readFileSync('users/auth.html', 'utf8');
          const legacySmsPage = fs.readFileSync('users/loginnew.html', 'utf8');
          const legacySmsScript = fs.readFileSync('users/js/loginnew.js', 'utf8');
          if (!authPageScript.includes('"/login"')) {
            throw new Error('Legacy auth entry must redirect to the canonical Google-only /login page.');
          }
          if (!/LOGIN_PAGE:\s*"\/login"/.test(rootSource) || rootSource.includes('/auth/login.html')) {
            throw new Error('Every archive login entry must use the canonical Google-only /login route.');
          }
          if (!googleLoginPage.includes('id="googleLoginButton"') ||
              !googleLoginScript.includes('/public/openid/google') ||
              !googleLoginScript.includes('NightCastGoogleAuth')) {
            throw new Error('Canonical login must use Google sign-in and exchange the Google ID token with the NightCast API.');
          }
          if (!legacySmsPage.includes('url=/login') ||
              !legacySmsScript.includes('new URL("/login"')) {
            throw new Error('Legacy SMS login page and script must redirect to the canonical Google-only /login page.');
          }
          if (googleLoginScript.includes('guestLogin') ||
              /passwordForm|smsRequestForm|smsVerifyForm|oidcButton|guestButton/.test(legacyAuthPage + legacyWelcomePage + legacySmsPage + legacySmsScript)) {
            throw new Error('Guest, password, SMS, or generic OpenID login paths must not be exposed by login pages.');
          }
          for (const ref of ['/css/cosmic-experience.css', '/css/nightcast-cosmos.css', '/js/nightcast-cosmos.js']) {
            if (!root.includes(ref)) throw new Error('Root archive is missing reference: ' + ref);
          }
          // Validate asset paths independently from cache-busting versions (?v=1, ?v=2, ?v=3, ...).
          // A CSS release can advance before its paired JavaScript release; CI must not require a stale query string.
          const hasVersionedAsset = (html, attribute, expectedPath) => {
            const expected = new URL(expectedPath, 'https://nightcast.invalid/');
            const attrs = [...html.matchAll(/\b(href|src)\s*=\s*["']([^"']+)["']/gi)];
            return attrs.some(match => {
              if (match[1].toLowerCase() !== attribute) return false;
              try {
                const url = new URL(match[2], 'https://nightcast.invalid/users/');
                return url.pathname === expected.pathname && /^\d+$/.test(url.searchParams.get('v') || '');
              } catch {
                return false;
              }
            });
          };
          if (!hasVersionedAsset(root, 'href', '/css/nightcast-cosmos.css')) {
            throw new Error('Archive page is missing a versioned NightCast Cosmos CSS reference');
          }
          if (!hasVersionedAsset(root, 'src', '/js/nightcast-cosmos.js')) {
            throw new Error('Archive page is missing a versioned NightCast Cosmos JavaScript reference');
          }
          NODE

      - name: Install npm dependencies
        run: |
          set -e

          if [ -f package-lock.json ]; then
            echo "package-lock.json found. Using npm ci."
            npm ci
          else
            echo "No package-lock.json found. Using npm install."
            npm install
          fi

      # ============================================================
      # 4. Android SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Use the action's maintained default command-line tools version.
          accept-android-sdk-licenses: true
          packages: ''


      # ============================================================
      # 5. Install Android SDK packages
      # ============================================================
      - name: Install Android SDK packages
        run: |
          set -e

          echo "=== Installing Android SDK packages ==="

          sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.0.11718014"

          echo ""
          echo "=== Installed Android SDK packages ==="

          sdkmanager --list_installed


      # ============================================================
      # 6. Validate the single canonical Capacitor configuration
      # ============================================================
      - name: Validate capacitor.config.ts
        run: |
          set -euo pipefail

          test -s capacitor.config.ts
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('capacitor.config.ts', 'utf8');
          const required = [
            ["appId", /appId:\s*'ir\.nightcast\.app'/],
            ["appName", /appName:\s*'NightCast'/],
            ["remote entry URL", /url:\s*'https:\/\/nightcast\.ir'/],
            ["HTTPS scheme", /androidScheme:\s*'https'/],
            ["www hostname allowlist", /allowNavigation:\s*\[[^\]]*'www\.nightcast\.ir'/s],
            ["apex hostname allowlist", /allowNavigation:\s*\[[^\]]*'nightcast\.ir'/s]
          ];
          for (const [label, pattern] of required) {
            if (!pattern.test(source)) throw new Error('capacitor.config.ts missing required setting: ' + label);
            console.log('TRUE | Canonical Capacitor setting | ' + label);
          }
          if (fs.existsSync('capacitor.config.json')) {
            throw new Error('Do not maintain a second root Capacitor config; capacitor.config.ts is authoritative.');
          }
          NODE

      # ============================================================
      # 7. Prepare www
      # ============================================================
      - name: Prepare www folder
        run: |
          set -e

          rm -rf www
          mkdir -p www

          echo "=== Preparing NightCast web assets ==="

          # ----------------------------------------------------------
          # NightCast user interface
          # ----------------------------------------------------------

          if [ ! -f "index.html" ]; then
            echo "ERROR: root index.html not found."
            exit 1
          fi

          cp index.html www/index.html

          echo "Root index.html copied to www/index.html."

          # ----------------------------------------------------------
          # Root web files
          # ----------------------------------------------------------
          cp version.json www/version.json
          cp style.css www/ 2>/dev/null || true
          cp app.js www/ 2>/dev/null || true

          cp favicon.ico www/ 2>/dev/null || true
          cp favicon.png www/ 2>/dev/null || true
          cp logo.png www/ 2>/dev/null || true


          # ----------------------------------------------------------
          # Root directories
          # ----------------------------------------------------------

          cp -r css www/ 2>/dev/null || true
          cp -r js www/ 2>/dev/null || true
          cp js/update-checker.js www/js/update-checker.js
          node -e 'const fs=require("node:fs"); const v=require("./version.json").version; fs.writeFileSync("www/js/nightcast-version.js", "window.NIGHTCAST_APP_VERSION = " + JSON.stringify(v) + ";" + String.fromCharCode(10));'
          cp -r assets www/ 2>/dev/null || true
          cp -r auth www/ 2>/dev/null || true
          cp -r .well-known www/ 2>/dev/null || true


          # ----------------------------------------------------------
          # Preserve users directory
          # ----------------------------------------------------------

          mkdir -p www/users

          cp -r users/* www/users/ 2>/dev/null || true


          # ----------------------------------------------------------
          # Copy other root HTML files
          # ----------------------------------------------------------

          find . \
            -maxdepth 1 \
            -type f \
            -name "*.html" \
            ! -name "index.html" \
            -exec cp {} www/ \; 2>/dev/null || true


          # ----------------------------------------------------------
          # Verify entry point
          # ----------------------------------------------------------

          echo ""
          echo "=== www/index.html ==="

          test -f www/index.html

          wc -c www/index.html
          wc -l www/index.html


          echo ""
          echo "=== www directory ==="

          find www \
            -maxdepth 4 \
            -type f \
            | sort


      # ============================================================
      # 8. Create Android platform
      # ============================================================
      - name: Add Android platform
        run: |
          set -e

          rm -rf android

          npx cap add android

      # ============================================================
      # 8.1. Set NightCast App Version
      # ============================================================
      - name: Set NightCast App Version
        run: |
          set -e

          python3 << 'PY'
          import json
          import re
          from pathlib import Path

          # ----------------------------------------------------------
          # Read version.json
          # ----------------------------------------------------------

          version_file = Path("version.json")

          if not version_file.exists():
              raise SystemExit("ERROR: version.json not found.")

          data = json.loads(
              version_file.read_text(encoding="utf-8")
          )

          version = str(
              data.get("version", "")
          ).strip()

          if not re.fullmatch(
              r"\d+\.\d+\.\d+",
              version
          ):
              raise SystemExit(
                  f"ERROR: Invalid version in version.json: {version}"
              )

          major, minor, patch = map(
              int,
              version.split(".")
          )

          # ----------------------------------------------------------
          # Generate Android versionCode
          #
          # 5.2.0 -> 50200
          # Version values are derived from version.json; no release version is hardcoded.
          # 5.3.0 -> 50300
          # ----------------------------------------------------------

          version_code = (
              major * 10000
              + minor * 100
              + patch
          )

          # ----------------------------------------------------------
          # Update android/app/build.gradle
          # ----------------------------------------------------------

          gradle_file = Path(
              "android/app/build.gradle"
          )

          if not gradle_file.exists():
              raise SystemExit(
                  "ERROR: android/app/build.gradle not found."
              )

          gradle = gradle_file.read_text(
              encoding="utf-8"
          )

          default_config = re.search(
              r"(defaultConfig\s*\{)(.*?)(^\s*\})",
              gradle,
              re.DOTALL | re.MULTILINE
          )

          if not default_config:
              raise SystemExit(
                  "ERROR: defaultConfig block not found."
              )

          block = default_config.group(2)

          # Remove existing versionCode/versionName if present.
          block = re.sub(
              r"(?m)^\s*versionCode\s+.*\n?",
              "",
              block
          )

          block = re.sub(
              r"(?m)^\s*versionName\s+.*\n?",
              "",
              block
          )

          version_lines = (
              f"\n"
              f"        versionCode {version_code}\n"
              f"        versionName \"{version}\"\n"
          )

          block = version_lines + block

          gradle = (
              gradle[:default_config.start(2)]
              + block
              + gradle[default_config.end(2):]
          )

          gradle_file.write_text(
              gradle,
              encoding="utf-8"
          )

          # ----------------------------------------------------------
          # Create local app-version.js
          # ----------------------------------------------------------

          app_version_file = Path(
              "www/app-version.js"
          )

          app_version_file.write_text(
              f'''(function () {{
          "use strict";

          window.NIGHTCAST_APP_VERSION = "{version}";

          function updateVersionLabel() {{
              const element =
                  document.querySelector(".version");

              if (element) {{
                  element.textContent =
                      "Version " +
                      window.NIGHTCAST_APP_VERSION;
              }}
          }}

          if (document.readyState === "loading") {{
              document.addEventListener(
                  "DOMContentLoaded",
                  updateVersionLabel
              );
          }} else {{
              updateVersionLabel();
          }}
          }})();
          ''',
              encoding="utf-8"
          )

          # ----------------------------------------------------------
          # Load app-version.js before update-checker.js
          # ----------------------------------------------------------

          index_file = Path(
              "www/index.html"
          )

          index = index_file.read_text(
              encoding="utf-8"
          )

          checker_tag = (
              '<script src="js/update-checker.js"></script>'
          )

          version_tag = (
              '<script src="app-version.js"></script>'
          )

          # The root entry point is now the podcast archive. Inject the version
          # script only when the page includes the update checker; do not assume
          # every standalone entry document needs that checker.
          if checker_tag in index and version_tag not in index:
              index = index.replace(
                  checker_tag,
                  version_tag
                  + "\n"
                  + checker_tag,
                  1
              )
          elif checker_tag not in index:
              print("Root entry has no update-checker script; version label injection skipped.")

          index_file.write_text(
              index,
              encoding="utf-8"
          )

          print("")
          print("========================================")
          print(" NightCast Version Configuration")
          print("========================================")
          print(f" versionName : {version}")
          print(f" versionCode : {version_code}")
          print("========================================")
          print("")

          print("=== Android version ===")
          for line in gradle.splitlines():
              if (
                  "versionCode" in line
                  or "versionName" in line
              ):
                  print(line)

          print("")
          print("=== www/app-version.js ===")
          print(
              app_version_file.read_text(
                  encoding="utf-8"
              )
          )
          PY
      # ============================================================
      # 9. Set NightCast Launcher Icon
      # ============================================================
      - name: Set NightCast Launcher Icon
        run: |
          set -e

          echo "=== Configuring NightCast launcher icon ==="

          ICON_SOURCE="assets/icons/icon-512.png"
          RES_DIR="android/app/src/main/res"

          if [ ! -f "$ICON_SOURCE" ]; then
            echo "ERROR: NightCast icon not found:"
            echo "$ICON_SOURCE"
            exit 1
          fi

          mkdir -p "$RES_DIR/drawable-nodpi"
          mkdir -p "$RES_DIR/mipmap-anydpi-v26"
          mkdir -p "$RES_DIR/values"


          cp "$ICON_SOURCE" \
            "$RES_DIR/drawable-nodpi/nightcast_icon.png"


          cat > "$RES_DIR/mipmap-anydpi-v26/ic_launcher.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/nightcast_icon_background" />
              <foreground android:drawable="@drawable/nightcast_icon" />
          </adaptive-icon>
          EOF


          cat > "$RES_DIR/mipmap-anydpi-v26/ic_launcher_round.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/nightcast_icon_background" />
              <foreground android:drawable="@drawable/nightcast_icon" />
          </adaptive-icon>
          EOF


          cat > "$RES_DIR/values/nightcast_icon_colors.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="nightcast_icon_background">#050A16</color>
          </resources>
          EOF


          python3 << 'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if not manifest.exists():
              raise SystemExit(
                  "AndroidManifest.xml was not generated."
              )

          text = manifest.read_text(encoding="utf-8")
          permission = 'android.permission.POST_NOTIFICATIONS'
          if permission not in text:
              text = text.replace('<manifest', '<manifest', 1)
              manifest_start = text.find('<manifest')
              end = text.find('>', manifest_start)
              text = text[:end + 1] + '\n    <uses-permission android:name="' + permission + '" />' + text[end + 1:]
          receiver = '<receiver android:name="ir.nightcast.app.NightCastQuizCountdownReceiver" android:enabled="true" android:exported="false" />'
          if 'NightCastQuizCountdownReceiver' not in text:
              text = text.replace('</application>', receiver + '\n    </application>')
          manifest.write_text(text, encoding="utf-8")

          if '@mipmap/ic_launcher' not in text:
              raise SystemExit(
                  "ic_launcher reference not found in AndroidManifest.xml"
              )

          print("Android launcher icon references verified.")
          PY


          echo ""
          echo "=== NightCast launcher icon ==="

          ls -lh \
            "$RES_DIR/drawable-nodpi/nightcast_icon.png"


      # ============================================================
      # 10. Add Native Google Sign-In
      # ============================================================
      - name: Install tracked native Android sources
        run: |
          set -euo pipefail

          SOURCE_DIR="android-template/src/main/java/ir/nightcast/app"
          TARGET_DIR="android/app/src/main/java/ir/nightcast/app"

          test -s "$SOURCE_DIR/MainActivity.java"
          test -s "$SOURCE_DIR/NightCastGoogleAuth.java"
          test -s "$SOURCE_DIR/NightCastNotifications.java"
          test -s "$SOURCE_DIR/NightCastQuizCountdownReceiver.java"
          test -s "$SOURCE_DIR/NightCastPodcastWorker.java"
          mkdir -p "$TARGET_DIR"
          cp "$SOURCE_DIR/MainActivity.java" "$TARGET_DIR/MainActivity.java"
          cp "$SOURCE_DIR/NightCastGoogleAuth.java" "$TARGET_DIR/NightCastGoogleAuth.java"
          cp "$SOURCE_DIR/NightCastNotifications.java" "$TARGET_DIR/NightCastNotifications.java"
          cp "$SOURCE_DIR/NightCastQuizCountdownReceiver.java" "$TARGET_DIR/NightCastQuizCountdownReceiver.java"
          cp "$SOURCE_DIR/NightCastPodcastWorker.java" "$TARGET_DIR/NightCastPodcastWorker.java"

          grep -q '^package ir\.nightcast\.app;' "$TARGET_DIR/MainActivity.java"
          grep -q '^package ir\.nightcast\.app;' "$TARGET_DIR/NightCastGoogleAuth.java"
          grep -q 'registerPlugin(NightCastGoogleAuth.class)' "$TARGET_DIR/MainActivity.java"
          grep -q '@CapacitorPlugin(name = "NightCastGoogleAuth")' "$TARGET_DIR/NightCastGoogleAuth.java"
          grep -q 'registerPlugin(NightCastNotifications.class)' "$TARGET_DIR/MainActivity.java"
          grep -q '@CapacitorPlugin(name = "NightCastNotifications"' "$TARGET_DIR/NightCastNotifications.java"

          echo "TRUE | Native Android source files copied from tracked templates."
          echo "TRUE | MainActivity registers NightCastGoogleAuth."
          echo "TRUE | Google sign-in plugin annotation is present."


      # ============================================================
      # 11. Add Google Credential Manager dependencies
      # ============================================================
      - name: Add Google Credential Manager dependencies
        run: |
          set -e

          python3 << 'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")

          if not path.exists():
              raise SystemExit(
                  "android/app/build.gradle was not generated."
              )

          text = path.read_text(encoding="utf-8")

          dependencies = [
              'implementation "androidx.credentials:credentials:1.6.0"',
              'implementation "androidx.credentials:credentials-play-services-auth:1.6.0"',
              'implementation "com.google.android.libraries.identity.googleid:googleid:1.2.0"',
              'implementation "androidx.work:work-runtime:2.9.1"',
          ]

          marker = "dependencies {"

          if marker not in text:
              raise SystemExit(
                  "Could not find dependencies block."
              )

          missing = [
              dep for dep in dependencies
              if dep not in text
          ]

          if missing:
              insertion = marker + "\n"

              for dep in missing:
                  insertion += f"    {dep}\n"

              text = text.replace(
                  marker,
                  insertion,
                  1
              )

              path.write_text(
                  text,
                  encoding="utf-8"
              )

          print(
              "Google Credential Manager dependencies configured."
          )
          PY


          echo ""
          echo "=== Google dependencies ==="

          grep -nE \
            "credentials:|credentials-play-services|googleid:" \
            android/app/build.gradle


      # ============================================================
      # 12. Verify Native Google Sign-In
      # ============================================================
      - name: Verify native Google Sign-In configuration
        run: |
          set -e

          test -f \
            android/app/src/main/java/ir/nightcast/app/MainActivity.java

          test -f \
            android/app/src/main/java/ir/nightcast/app/NightCastGoogleAuth.java


          grep -q \
            '^package ir\.nightcast\.app;' \
            android/app/src/main/java/ir/nightcast/app/MainActivity.java

          grep -q \
            '^package ir\.nightcast\.app;' \
            android/app/src/main/java/ir/nightcast/app/NightCastGoogleAuth.java


          grep -q \
            'registerPlugin(NightCastGoogleAuth.class)' \
            android/app/src/main/java/ir/nightcast/app/MainActivity.java


          grep -q \
            '@CapacitorPlugin(name = "NightCastGoogleAuth")' \
            android/app/src/main/java/ir/nightcast/app/NightCastGoogleAuth.java


          grep -q \
            'androidx.credentials:credentials:1.6.0' \
            android/app/build.gradle


          grep -q \
            'androidx.credentials:credentials-play-services-auth:1.6.0' \
            android/app/build.gradle


          grep -q \
            'com.google.android.libraries.identity.googleid:googleid:1.2.0' \
            android/app/build.gradle


          grep -q \
            '242292157493-km4c11qgkf0lr3e6pv9paspkn95jbf3a.apps.googleusercontent.com' \
            android/app/src/main/java/ir/nightcast/app/NightCastGoogleAuth.java


          if grep -q \
            'GoogleIdTokenParsingException' \
            android/app/src/main/java/ir/nightcast/app/NightCastGoogleAuth.java
          then
              echo "ERROR: obsolete Google exception detected."
              exit 1
          fi


          echo "Native Google Sign-In configuration verified."


      # ============================================================
      # 13. Sync Capacitor
      # ============================================================
      - name: Sync Capacitor
        run: |
          set -euo pipefail

          npx cap sync android

          # Capacitor must carry the canonical remote website settings into
          # the actual Android package. Checking only the source JSON is not enough.
          GENERATED_CONFIG="android/app/src/main/assets/capacitor.config.json"
          test -s "$GENERATED_CONFIG"
          node - "$GENERATED_CONFIG" <<'NODE'
          const fs = require('node:fs');
          const file = process.argv[2];
          const config = JSON.parse(fs.readFileSync(file, 'utf8'));
          const server = config.server || {};
          const allowed = server.allowNavigation || [];
          if (server.url !== 'https://nightcast.ir') {
            throw new Error('Generated Android config does not load https://nightcast.ir');
          }
          if (server.androidScheme !== 'https') {
            throw new Error('Generated Android config must use the HTTPS scheme');
          }
          if (!allowed.includes('www.nightcast.ir') || !allowed.includes('nightcast.ir')) {
            throw new Error('Generated Android config must allow both NightCast hostnames in the WebView');
          }
          console.log('TRUE | Packaged Android config loads the live NightCast website.');
          console.log('TRUE | Both NightCast hostnames remain in the app WebView.');
          NODE


      # ============================================================
      # 14. Verify Android configuration
      # ============================================================
      - name: Verify Android configuration
        run: |
          set -e

          echo "=== Canonical Capacitor configuration ==="
          cat capacitor.config.ts


          echo ""
          echo "=== Android applicationId ==="

          grep -R \
            'applicationId' \
            android/app/build.gradle || true


          echo ""
          echo "=== Android namespace ==="

          grep -R \
            'namespace' \
            android/app/build.gradle || true


          echo ""
          echo "=== Native Java files ==="

          find \
            android/app/src/main/java/ir/nightcast/app \
            -maxdepth 1 \
            -type f \
            -print


          echo ""
          echo "=== Capacitor web entry ==="

          test -f www/index.html

          echo "www/index.html exists."


      # ============================================================
      # 15. Make Gradle executable
      # ============================================================
      - name: Make gradlew executable
        run: |
          set -e

          chmod +x android/gradlew


      # ============================================================
      # 16. Validate Gradle configuration
      # ============================================================
      - name: Validate Gradle configuration
        run: |
          set -e

          cd android

          ./gradlew \
            :app:dependencies \
            --stacktrace \
            --no-daemon


      # ============================================================
      # 17. Build Debug APK
      # ============================================================
      - name: Build Debug APK
        id: build_debug
        run: |
          set -e

          cd android

          ./gradlew \
            :app:assembleDebug \
            --stacktrace \
            --no-daemon


      # ============================================================
      # 18. Decode release keystore
      # ============================================================
      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 detected."
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > nightcast-release.keystore
            test -s nightcast-release.keystore || {
              echo "ERROR: Decoded keystore is empty."
              exit 1
            }
            echo "Keystore decoded successfully."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret found."
            echo "Release APK will be built unsigned."
          fi


      # ============================================================
      # 19. Build Release APK
      # ============================================================
      - name: Build Release APK
        id: build_release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -f "nightcast-release.keystore" ]; then
            echo "Building signed Release APK..."

            # A keystore without all matching credentials cannot produce a valid signed release.
            for secret_name in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
              if [ -z "${!secret_name:-}" ]; then
                echo "ERROR: $secret_name is required when ANDROID_KEYSTORE_BASE64 is configured."
                exit 1
              fi
            done

            cd android
            ./gradlew \
              :app:assembleRelease \
              -Pandroid.injected.signing.store.file="$(pwd)/../nightcast-release.keystore" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
              --stacktrace \
              --no-daemon
          else
            echo "Building unsigned Release APK..."
            cd android
            ./gradlew \
              :app:assembleRelease \
              --stacktrace \
              --no-daemon
          fi


      # ============================================================
      # 20. Verify APK output
      # ============================================================
      - name: Verify APKs
        id: verify_apks
        run: |
          set -e

          echo "=== Debug APKs ==="

          find \
            android/app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;


          echo ""
          echo "=== Release APKs ==="

          find \
            android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;


          echo ""
          echo "APK verification complete."


      # ============================================================
      # 21. Upload Debug APK
      # ============================================================
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NightCast-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error


      # ============================================================
      # 22. Upload Release APK
      # ============================================================
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NightCast-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error


      # ============================================================
      # 22.1 Publish Release APK to downloadrelease on main only
      # ============================================================
      - name: Publish APK to downloadrelease
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          # Keep the built artifact outside the checkout: retrying publication
          # must not rebase a binary APK commit over a concurrently changed APK.
          cp "$APK" /tmp/NightCast-release.apk
          test -s /tmp/NightCast-release.apk
          ls -lh /tmp/NightCast-release.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            # Start every attempt from the latest main, then apply only the APK.
            git fetch origin main
            git reset --hard origin/main
            VERSION="$(python3 -c 'import json; print(json.load(open("version.json"))["version"])')"
            EXPECTED_CODE="$(python3 -c 'import json; v=json.load(open("version.json"))["version"]; a,b,c=map(int,v.split(".")); print(a*10000+b*100+c)')"
            AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
            test -x "$AAPT"
            BADGING="$("$AAPT" dump badging /tmp/NightCast-release.apk)"
            if ! printf '%s\n' "$BADGING" | grep -F "versionCode='$EXPECTED_CODE' versionName='$VERSION'" >/dev/null; then
              echo "ERROR: Refusing to publish stale/mismatched APK."
              echo "Expected versionName=$VERSION versionCode=$EXPECTED_CODE"
              printf '%s\n' "$BADGING" | grep '^package:' || true
              exit 1
            fi
            mkdir -p downloadrelease
            cp /tmp/NightCast-release.apk downloadrelease/NightCast.apk
            test -s downloadrelease/NightCast.apk
            git add downloadrelease/NightCast.apk
            if git diff --cached --quiet; then
              echo "The published APK is unchanged."
              exit 0
            fi
            # VERSION and EXPECTED_CODE above are read from the latest main version.json.
            # The APK metadata check above prevents publishing an APK for a different version.
            git commit -m "Publish NightCast ${VERSION} release APK"
            if git push origin HEAD:main; then
              echo "Release APK published successfully."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying from the latest main."
            sleep 2
          done
          echo "Unable to publish APK after 3 attempts."
          exit 1

      # ============================================================
      # 23. Final result
      # ============================================================
      - name: List built APKs
        run: |
          echo ""
          echo "========================================"
          echo "        NIGHTCAST APK BUILD RESULT"
          echo "========================================"

          echo ""
          echo "Debug APK:"

          find \
            android/app/build/outputs/apk/debug \
            -name "*.apk" \
            -exec ls -lh {} \; || true


          echo ""
          echo "Release APK:"

          find \
            android/app/build/outputs/apk/release \
            -name "*.apk" \
            -exec ls -lh {} \; || true


          echo ""
          echo "========================================"
          echo "              BUILD DONE"
          echo "========================================"

      - name: Report Android APK build TRUE/FALSE
        if: always()
        env:
          DEBUG_OUTCOME: ${{ steps.build_debug.outcome }}
          RELEASE_OUTCOME: ${{ steps.build_release.outcome }}
          APK_VERIFY_OUTCOME: ${{ steps.verify_apks.outcome }}
        run: |
          if [ "$DEBUG_OUTCOME" = "success" ] && [ "$RELEASE_OUTCOME" = "success" ] && [ "$APK_VERIFY_OUTCOME" = "success" ]; then
            echo "TRUE | 6. Android Debug and Release APK build"
            echo "TRUE | 6. Android Debug and Release APK build" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "FALSE | 6. Android Debug and Release APK build (debug=$DEBUG_OUTCOME, release=$RELEASE_OUTCOME, verify=$APK_VERIFY_OUTCOME)"
            echo "FALSE | 6. Android Debug and Release APK build (debug=$DEBUG_OUTCOME, release=$RELEASE_OUTCOME, verify=$APK_VERIFY_OUTCOME)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
