<body>

<div id="appSplash" class="splash">

    <div class="background-glow"></div>

    <div class="logo-wrapper">

        <div class="logo-circle">

            <svg
                viewBox="0 0 64 64"
                width="54"
                height="54"
                fill="none"
                xmlns="http://www.w3.org/2000/svg">

                <circle
                    cx="32"
                    cy="32"
                    r="22"
                    stroke="currentColor"
                    stroke-width="3"/>

                <circle
                    cx="32"
                    cy="32"
                    r="6"
                    fill="currentColor"/>

                <path
                    d="M12 32H6M58 32H52M32 12V6M32 58V52"
                    stroke="currentColor"
                    stroke-width="3"
                    stroke-linecap="round"/>

            </svg>

        </div>

        <h1>

            Night<span>Cast</span>

        </h1>

        <p>

            رادیوی تجربه، یادگیری و رشد فردی

        </p>

    </div>

    <div class="loader">

        <div class="loader-bar">

            <span id="loaderProgress"></span>

        </div>

        <small>

            در حال آماده‌سازی...

        </small>

    </div>

    <div class="version">

        Version 1.0

    </div>

</div>

<noscript>

برای استفاده از NightCast باید JavaScript فعال باشد.

</noscript>

<script src="js/auth.js"></script>

<script src="js/router.js"></script>
<script src="js/update-checker.js"></script> 
<script>
window.addEventListener("load", function () {

    if (
        window.NightCastUpdateChecker &&
        typeof window.NightCastUpdateChecker.check === "function"
    ) {
        window.NightCastUpdateChecker.check();
    }

});
</script>    
<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("/service-worker.js")
            .then(registration => {
                console.log(
                    "NightCast Service Worker:",
                    registration.scope
                );
            })
            .catch(error => {
                console.error(
                    "Service Worker registration failed:",
                    error
                );
            });
    });
}
</script>
</body>
