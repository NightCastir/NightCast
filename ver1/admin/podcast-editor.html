
<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>


<meta charset="UTF-8">


<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>
Podcast Editor | NightCast
</title>



<link rel="stylesheet" href="css/variables.css">

<link rel="stylesheet" href="css/reset.css">

<link rel="stylesheet" href="css/layout.css">

<link rel="stylesheet" href="css/components.css">

<link rel="stylesheet" href="css/responsive.css">

<link rel="stylesheet" href="css/podcast-editor.css">


</head>



<body>



<div class="nc-app">



<!-- =====================
 HEADER
===================== -->


<header class="nc-header">


<div>

<h2>

ویرایش پادکست

</h2>

</div>



<div>


<button class="nc-btn nc-btn-secondary">

بازگشت

</button>


</div>


</header>




<!-- =====================
 CONTENT
===================== -->


<main class="nc-content">


<div class="nc-container">

<!-- =====================
     PODCAST BASIC INFO
===================== -->


<section class="nc-card">


<div class="nc-card-header">

<h3 class="nc-card-title">

اطلاعات اصلی پادکست

</h3>

</div>




<div class="nc-form-grid">



<div class="nc-field">


<label>

عنوان پادکست

</label>


<input

type="text"

id="podcastTitle"

placeholder="مثلاً خلاصه کتاب اوج پرواز"

>


</div>





<div class="nc-field">


<label>

شماره قسمت

</label>


<input

type="number"

id="episodeNumber"

placeholder="مثلاً 1"

>


</div>





<div class="nc-field">


<label>

وضعیت انتشار

</label>


<select id="status">


<option value="draft">

پیش نویس

</option>


<option value="published">

منتشر شده

</option>



</select>


</div>





<div class="nc-field">


<label>

تاریخ انتشار

</label>


<input

type="date"

id="publishDate"

>


</div>



</div>



</section>






<!-- =====================
     BOOK INFO
===================== -->


<section class="nc-card">


<div class="nc-card-header">


<h3 class="nc-card-title">

اطلاعات کتاب مرتبط

</h3>


</div>




<div class="nc-form-grid">



<div class="nc-field">


<label>

انتخاب کتاب

</label>



<select id="bookSelect">


<option>

در حال بارگذاری کتاب‌ها...

</option>


</select>


</div>




</div>



</section>
