name: NightCast Statistic Panel Removal Acceptance
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'users/index.html'
      - 'js/nightcast-app.js'
      - '.github/workflows/remove-stat-cards-acceptance.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'users/index.html'
      - 'js/nightcast-app.js'
      - '.github/workflows/remove-stat-cards-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stats-removal-check:
    name: Verify count panels are absent and scripts stay safe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check canonical archive counters and legacy alias
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const files = ['index.html'];
          let failed = false;
          for (const file of files) {
            const html = fs.readFileSync(file, 'utf8');
            const app = fs.readFileSync('js/nightcast-app.js', 'utf8');
            const source = html + '\n' + app;
            const checks = [
              ['top podcast counter markup removed', !/\bid=["']podcastCount["']/.test(html)],
              ['top book counter markup removed', !/\bid=["']bookCount["']/.test(html)],
              ['top favorite counter markup removed', !/\bid=["']favoriteCount["']/.test(html)],
              ['profile counter markup removed', !/\bid=["']profile(?:Podcast|Book|Favorite)Count["']/.test(html)],
              ['profile statistic cards absent from HTML', !/class=["'][^"']*\bprofile-stats\b/.test(html)],
              ['counter updates guard missing elements', /if \(els\.count\)/.test(source) && /if \(els\.books\)/.test(source) && /if \(els\.favCount\)/.test(source)],
              ['podcast feed update function remains', /function updateStats\s*\(/.test(source) && /function loadPodcasts\s*\(/.test(source)]
            ];
            for (const [name, ok] of checks) {
              console.log(`${ok ? 'PASS' : 'FAIL'} | ${file} | ${name}`);
              if (!ok) failed = true;
            }
          }
          const alias = fs.readFileSync('users/index.html', 'utf8');
          const aliasChecks = [
            ['legacy archive is a lightweight alias', alias.length < 2000],
            ['legacy archive is noindex', /noindex,follow/.test(alias)],
            ['legacy archive does not duplicate statistic panels', !/podcastCount|bookCount|favoriteCount|profile-stats/.test(alias)],
            ['legacy archive preserves the canonical redirect', /window.location.replace\(target.toString\(\)\)/.test(alias)]
          ];
          for (const [name, ok] of aliasChecks) {
            console.log(`${ok ? 'PASS' : 'FAIL'} | users/index.html | ${name}`);
            if (!ok) failed = true;
          }
          if (failed) process.exit(1);
          NODE
