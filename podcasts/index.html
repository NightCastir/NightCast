<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="https://nightcast.ir/">
  <title>NightCast | آرشیو پادکست‌ها</title>
  <script>
    (function () {
      "use strict";
      // Compatibility route for bookmarks and existing inbound links.
      // Keep query parameters but never emit a fragment when returning to the canonical archive.
      var targetUrl = new URL("/", window.location.origin);
      targetUrl.search = window.location.search;
      targetUrl.searchParams.set("__route", "podcasts");
      var target = targetUrl.toString();
      if (/^\/podcasts(?:\/index\.html)?\/?$/.test(window.location.pathname)) {
        window.location.replace(target);
      }
    })();
  </script>
</head>
<body>
  <p><a href="/">ورود به آرشیو پادکست‌های NightCast</a></p>
</body>
</html>
