<title>NightCast Admin Connection Test</title><style>

</style></head><body><div class="container"><div class="card"><h1>

</div></div></div><script>

"use strict";


/*
|--------------------------------------------------------------------------
| تنظیمات واقعی NightCast
|--------------------------------------------------------------------------
*/


const API_BASE =
"https://nightcast-api.tomasgermany2580.workers.dev/api/v1";


const DASHBOARD =
"dashboard.html";


/*
|--------------------------------------------------------------------------
| عناصر صفحه
|--------------------------------------------------------------------------
*/


const form =
document.getElementById(
    "loginForm"
);


const usernameInput =
document.getElementById(
    "username"
);


const passwordInput =
document.getElementById(
    "password"
);


const loginButton =
document.getElementById(
    "loginButton"
);


const result =
document.getElementById(
    "result"
);


const logBox =
document.getElementById(
    "log"
);



/*
|--------------------------------------------------------------------------
| Token فقط در حافظه
|--------------------------------------------------------------------------
|
| عمداً LocalStorage استفاده نمی‌کنیم.
|
*/


let sessionToken = null;



/*
|--------------------------------------------------------------------------
| Logger
|--------------------------------------------------------------------------
*/


function log(message){

    const time =
        new Date()
        .toLocaleTimeString(
            "fa-IR"
        );


    logBox.textContent +=
        "\n[" +
        time +
        "] " +
        message;


    logBox.scrollTop =
        logBox.scrollHeight;

}



/*
|--------------------------------------------------------------------------
| Status
|--------------------------------------------------------------------------
*/


function showResult(
    message,
    type=""
){

    result.className =
        type;


    result.textContent =
        message;

}



/*
|--------------------------------------------------------------------------
| Login
|--------------------------------------------------------------------------
*/


form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const username =
            usernameInput.value.trim();


        const password =
            passwordInput.value;


        if(!username){

            showResult(
                "نام کاربری را وارد کنید.",
                "error"
            );

            return;

        }


        if(!password){

            showResult(
                "رمز عبور را وارد کنید.",
                "error"
            );

            return;

        }


        loginButton.disabled =
            true;


        showResult(
            "⏳ در حال اتصال به Worker..."
        );


        log(
            "شروع فرآیند Login."
        );


        log(
            "Endpoint: " +
            API_BASE +
            "/auth/login"
        );


        try{


            /*
            |--------------------------------------------------------------------------
            | مرحله ۱ — Login
            |--------------------------------------------------------------------------
            */


            log(
                "ارسال POST /auth/login"
            );


            const loginResponse =
                await fetch(

                    API_BASE +
                    "/auth/login",

                    {

                        method:"POST",

                        headers:{

                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"

                        },

                        cache:"no-store",

                        body:
                            JSON.stringify({

                                username:
                                    username,

                                password:
                                    password

                            })

                    }

                );


            log(
                "HTTP Login Status: " +
                loginResponse.status
            );


            const loginData =
                await loginResponse.json();


            /*
            |--------------------------------------------------------------------------
            | Login Failed
            |--------------------------------------------------------------------------
            */


            if(
                !loginResponse.ok ||
                loginData.success !== true
            ){

                log(
                    "❌ Login ناموفق."
                );


                showResult(

                    "❌ ورود ناموفق بود.\n" +
                    (
                        loginData.message ||
                        "نام کاربری یا رمز عبور صحیح نیست."
                    ),

                    "error"

                );


                return;

            }


            /*
            |--------------------------------------------------------------------------
            | Token
            |--------------------------------------------------------------------------
            */


            if(
                typeof loginData.token !==
                "string" ||
                loginData.token.length < 32
            ){

                log(
                    "❌ Login موفق اعلام شد ولی Token معتبر دریافت نشد."
                );


                showResult(

                    "❌ Login موفق اعلام شد اما Session معتبر دریافت نشد.",

                    "error"

                );


                return;

            }


            sessionToken =
                loginData.token;


            log(
                "✅ Login موفق."
            );


            log(
                "✅ Session Token دریافت شد."
            );


            /*
            |--------------------------------------------------------------------------
            | User information
            |--------------------------------------------------------------------------
            */


            if(
                loginData.user
            ){

                log(
                    "کاربر: " +
                    (
                        loginData.user.username ||
                        username
                    )
                );


                log(
                    "Role: " +
                    (
                        loginData.user.role ||
                        "unknown"
                    )
                );

            }



            /*
            |--------------------------------------------------------------------------
            | مرحله ۲ — بررسی Session
            |--------------------------------------------------------------------------
            */


            showResult(
                "⏳ Login موفق شد. در حال بررسی Session..."
            );


            log(
                "شروع بررسی /auth/me"
            );


            const meResponse =
                await fetch(

                    API_BASE +
                    "/auth/me",

                    {

                        method:"GET",

                        headers:{

                            "Accept":
                                "application/json",

                            "Authorization":
                                "Bearer " +
                                sessionToken

                        },

                        cache:"no-store"

                    }

                );


            log(
                "HTTP /auth/me Status: " +
                meResponse.status
            );


            const meData =
                await meResponse.json();


            if(
                !meResponse.ok ||
                meData.success !== true
            ){

                log(
                    "❌ Session معتبر نیست."
                );


                sessionToken =
                    null;


                showResult(

                    "❌ Login انجام شد ولی Session تأیید نشد.",

                    "error"

                );


                return;

            }


            /*
            |--------------------------------------------------------------------------
            | Session Valid
            |--------------------------------------------------------------------------
            */


            log(
                "✅ Session توسط Worker تأیید شد."
            );


            if(
                meData.user
            ){

                log(
                    "Admin ID: " +
                    (
                        meData.user.id ??
                        "-"
                    )
                );


                log(
                    "Username: " +
                    (
                        meData.user.username ??
                        "-"
                    )
                );


                log(
                    "Role: " +
                    (
                        meData.user.role ??
                        "-"
                    )
                );

            }


            /*
            |--------------------------------------------------------------------------
            | موفقیت نهایی
            |--------------------------------------------------------------------------
            */


            showResult(

                "✅ با موفقیت وارد شدید.\n" +
                "Session معتبر است.\n" +
                "در حال اتصال به Dashboard...",

                "success"

            );


            log(
                "✅ اتصال Login → Session → Dashboard موفق بود."
            );


            /*
            |--------------------------------------------------------------------------
            | Token را برای Dashboard موقتاً منتقل می‌کنیم.
            |--------------------------------------------------------------------------
            |
            | Dashboard فعلی NightCast برای Authorization Bearer
            | به Token نیاز دارد.
            |
            | این فقط برای تست فعلی است.
            |
            */


            sessionStorage.setItem(
                "NightCastToken",
                sessionToken
            );


            if(
                loginData.user
            ){

                sessionStorage.setItem(

                    "NightCastAdminUser",

                    JSON.stringify({

                        id:
                            loginData.user.id,

                        username:
                            loginData.user.username,

                        full_name:
                            loginData.user.full_name,

                        role:
                            loginData.user.role

                    })

                );

            }


            log(
                "Token در SessionStorage قرار گرفت."
            );


            log(
                "انتقال به dashboard.html ..."
            );


            setTimeout(

                function(){

                    window.location.href =
                        DASHBOARD;

                },

                800

            );


        }

        catch(error){


            log(
                "❌ خطا: " +
                (
                    error.message ||
                    String(error)
                )
            );


            showResult(

                "❌ خطا در ارتباط با API.\n" +
                (
                    error.message ||
                    "خطای نامشخص"
                ),

                "error"

            );

        }

        finally{

            loginButton.disabled =
                false;

        }

    }

);

</script></body></html>
