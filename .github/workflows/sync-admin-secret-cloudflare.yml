name: Sync NightCast Admin Allowlist to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-admin-secret-cloudflare.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-admin-secret:
    name: Sync admin allowlist secret to nightcast-club-api
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate required secrets without printing values
        env:
          ADMIN_EMAIL_INPUT: ${{ secrets.ADMIN_EMAIL || secrets.ADMIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_EMAIL_INPUT//[[:space:]]/}" ]; then
            echo "::error::Missing GitHub Actions secret ADMIN_EMAIL or ADMIN."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN//[[:space:]]/}" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN with Workers Scripts Write permission."
            exit 1
          fi
          if ! printf '%s' "$ADMIN_EMAIL_INPUT" | grep -Eq '^[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$'; then
            echo "::error::The configured admin secret does not look like an email address."
            exit 1
          fi
          echo "Required secrets are present; values are not logged."

      - name: Set ADMIN_EMAIL on Cloudflare Worker
        env:
          ADMIN_EMAIL_INPUT: ${{ secrets.ADMIN_EMAIL || secrets.ADMIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          payload="$(jq -n --arg value "$ADMIN_EMAIL_INPUT" '{name:"ADMIN_EMAIL",type:"secret_text",text:$value}')"
          response="$(curl --silent --show-error --fail-with-body \
            --request PUT \
            --url "https://api.cloudflare.com/client/v4/accounts/86bf74bc8c59231d95c4a642a02343e7/workers/scripts/nightcast-club-api/secrets" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$payload")"
          if ! printf '%s' "$response" | jq -e '.success == true' >/dev/null; then
            echo "::error::Cloudflare API did not confirm the secret update."
            printf '%s' "$response" | jq -c '{success,errors,messages}'
            exit 1
          fi
          echo "Cloudflare accepted the ADMIN_EMAIL secret update. Secret value was not printed."

      - name: Verify secret binding name only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail-with-body \
            --url "https://api.cloudflare.com/client/v4/accounts/86bf74bc8c59231d95c4a642a02343e7/workers/scripts/nightcast-club-api/secrets" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          if ! printf '%s' "$response" | jq -e '.success == true and any(.result[]; .name == "ADMIN_EMAIL")' >/dev/null; then
            echo "::error::ADMIN_EMAIL binding name was not found after update."
            exit 1
          fi
          echo "Verified: ADMIN_EMAIL binding exists on nightcast-club-api; value was not read or logged."

# Push changes to this workflow trigger a fresh secret-sync attempt; manual dispatch remains enabled.
