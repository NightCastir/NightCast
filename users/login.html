<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NightCast | خوش آمدید</title>

<meta name="theme-color" content="#0b1220">

<link rel="stylesheet" href="css/core.css">
<link rel="stylesheet" href="css/login.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<!-- Background -->

<div class="background-blur blur1"></div>
<div class="background-blur blur2"></div>

<!-- Loader -->

<div id="authLoader" class="auth-loader hidden">

    <div class="loader-box">

        <div class="loader-circle"></div>

        <h3>NightCast</h3>

        <p id="loaderText">
            در حال اتصال...
        </p>

    </div>

</div>

<main class="login-page">

<section class="login-card">

<!-- Hero -->

<div class="hero">

    <div class="brand-icon">

        <i class="fa-solid fa-radio"></i>

    </div>

    <h1>

        Night<span>Cast</span>

    </h1>

    <p class="hero-text">

        رادیو NightCast پلی به سوی آیندست 

    </p>

</div>
<!-- Google -->

<button

id="openIdLogin"

class="btn btn-google"

type="button">

<i class="fa-brands fa-google"></i>

<span>

ادامه با Google

</span>

</button>

<!-- Divider -->

<div class="divider">

<span>

یا

</span>

</div>

<!-- Guest -->

<button

id="guestLogin"

class="btn btn-guest"

type="button">

<i class="fa-solid fa-headphones"></i>

<span>

ادامه به عنوان مهمان

</span>

</button>

<!-- Status -->

<div

id="loginMessage"

class="login-status">

</div>


<footer>

<p>

با ادامه، قوانین استفاده و سیاست حفظ حریم خصوصی NightCast را می‌پذیرید.

</p>

</footer>

</section>

</main>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<script src="js/login.js"></script>

</body>

</html>
