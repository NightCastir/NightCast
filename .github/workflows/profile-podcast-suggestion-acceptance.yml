name: NightCast Profile Podcast Suggestion Acceptance
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'users/index.html'
      - 'js/nightcast-app.js'
      - '.github/workflows/profile-podcast-suggestion-acceptance.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'users/index.html'
      - 'js/nightcast-app.js'
      - '.github/workflows/profile-podcast-suggestion-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-cta-check:
    name: Verify profile copy and request form wiring
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check canonical profile CTA and legacy route alias
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const files = ['index.html'];
          let failed = false;
          for (const file of files) {
            const html = fs.readFileSync(file, 'utf8');
            const app = fs.readFileSync('js/nightcast-app.js', 'utf8');
            const source = html + '\n' + app;
            const buttonIndex = html.indexOf('id="requestBookSummaryBtn"');
            const button = buttonIndex < 0 ? '' : html.slice(buttonIndex, buttonIndex + 450);
            const modalIndex = html.indexOf('id="bookSummaryRequestModal"');
            const modal = modalIndex < 0 ? '' : html.slice(modalIndex, modalIndex + 1800);
            const checks = [
              ['profile CTA has inviting heading', /پادکست دلخواهت را پیشنهاد بده/.test(html)],
              ['button clearly offers podcast suggestion', /پیشنهاد پادکست دلخواه/.test(button)],
              ['button uses audio-oriented icon', /fa-headphones/.test(button)],
              ['modal describes podcast production', /پیشنهاد کتاب برای ساخت پادکست/.test(html)],
              ['request form keeps stable ID', /id="bookSummaryRequestForm"/.test(html)],
              ['request API route remains connected', /\/book-summary-requests/.test(source)],
              ['no old visible button wording remains', !/id="requestBookSummaryBtn"[\s\S]{0,450}درخواست خلاصه کتاب/.test(html)]
            ];
            for (const [name, ok] of checks) {
              console.log(`${ok ? 'PASS' : 'FAIL'} | ${file} | ${name}`);
              if (!ok) failed = true;
            }
          }
          const alias = fs.readFileSync('users/index.html', 'utf8');
          const aliasChecks = [
            ['legacy archive is a lightweight alias', alias.length < 2000],
            ['legacy archive is noindex', /noindex,follow/.test(alias)],
            ['legacy archive targets the canonical podcast section', /target.hash = current.hash || "podcasts"/.test(alias)],
            ['legacy archive preserves the query string', /target.search = current.search/.test(alias)]
          ];
          for (const [name, ok] of aliasChecks) {
            console.log(`${ok ? 'PASS' : 'FAIL'} | users/index.html | ${name}`);
            if (!ok) failed = true;
          }
          if (failed) process.exit(1);
          NODE
