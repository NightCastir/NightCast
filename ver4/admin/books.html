<!DOCTYPE html>

<html lang="fa" dir="rtl">


<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1.0">



<title>
NightCast - Books Manager
</title>




<link rel="stylesheet" href="../assets/css/core.css">

<link rel="stylesheet" href="../assets/css/layout.css">

<link rel="stylesheet" href="../assets/css/components.css">

<link rel="stylesheet" href="../assets/css/responsive.css">



</head>





<body>




<div class="app-layout">





<!-- SIDEBAR -->

<aside class="sidebar" id="sidebar">



<div class="sidebar-logo">


<span>

◉

</span>


NightCast


</div>






<nav class="sidebar-menu">



<a href="dashboard.html">


🏠

داشبورد


</a>





<a href="podcasts.html">


🎙

پادکست‌ها


</a>





<a href="media.html">


🖼

رسانه‌ها


</a>





<a href="books.html" class="active">


📚

کتاب‌ها


</a>





<a href="users.html">


👥

کاربران


</a>





<a href="settings.html">


⚙

تنظیمات


</a>




</nav>



</aside>








<div class="overlay" id="overlay"></div>









<div class="main-area">






<header class="app-header">



<div class="header-right">



<button

class="menu-toggle"

id="menuToggle">


☰


</button>





<h3>

مدیریت کتاب‌ها

</h3>



</div>








<div class="header-left">



<div class="user-box">



<div class="avatar">

A

</div>




<span id="username">

Admin

</span>



</div>



</div>





</header>



  
<!-- ==========================
CONTENT
========================== -->


<section class="content-area">





<div class="page-header">



<div>


<h1 class="page-title">

کتاب‌های NightCast

</h1>



<p class="page-subtitle">

مدیریت منابع، خلاصه‌ها و ارتباط با پادکست‌ها

</p>



</div>






<div class="page-actions">



<button

class="btn btn-primary"

id="btnNewBook">


➕


کتاب جدید


</button>



</div>



</div>









<!-- ==========================
SEARCH & FILTER
========================== -->


<div class="card">



<div class="filter-row">



<div class="form-group">


<label>

جستجو

</label>


<input

type="text"

id="bookSearch"

placeholder="نام کتاب یا نویسنده...">


</div>







<div class="form-group">


<label>

وضعیت

</label>



<select id="bookStatus">



<option value="">


همه


</option>



<option value="active">


فعال


</option>



<option value="inactive">


غیرفعال


</option>



</select>



</div>






<div class="filter-buttons">


<button

class="btn btn-secondary"

id="btnRefreshBooks">


بروزرسانی


</button>


</div>




</div>


</div>









<!-- ==========================
BOOK TABLE
========================== -->



<div class="card">



<div class="card-header">



<div class="card-title">

لیست کتاب‌ها

</div>



<div class="card-tools">


<span id="bookCount">

۰ کتاب

</span>


</div>



</div>








<div class="table-container">



<table>



<thead>



<tr>


<th>

#

</th>



<th>

عنوان کتاب

</th>



<th>

نویسنده

</th>



<th>

تعداد قسمت‌ها

</th>



<th>

وضعیت

</th>



<th>

عملیات

</th>



</tr>



</thead>







<tbody id="booksTable">



<tr>


<td colspan="6">


در حال دریافت اطلاعات...


</td>


</tr>



</tbody>



</table>




</div>



  </div>





<!-- ==========================
BOOK MODAL
========================== -->


<div

class="modal"

id="bookModal">



<div class="modal-dialog modal-lg">





<div class="modal-header">



<h2>

ثبت / ویرایش کتاب

</h2>




<button

class="modal-close"

id="closeBookModal">


✕


</button>



</div>









<div class="modal-body">



<form id="bookForm">





<input

type="hidden"

id="bookId">








<div class="form-grid">






<div class="form-group">


<label>

عنوان کتاب *

</label>



<input

type="text"

id="bookTitle"

required>


</div>







<div class="form-group">


<label>

نویسنده

</label>



<input

type="text"

id="bookAuthor">


</div>








<div class="form-group">


<label>

مترجم

</label>



<input

type="text"

id="bookTranslator">


</div>








<div class="form-group">


<label>

دسته‌بندی

</label>



<select id="bookCategory">



<option value="">

انتخاب کنید

</option>



<option value="psychology">

روانشناسی

</option>



<option value="management">

مدیریت

</option>



<option value="success">

موفقیت

</option>



<option value="other">

سایر

</option>



</select>



</div>








<div class="form-group full">


<label>

توضیح کوتاه

</label>



<textarea

id="bookDescription"

rows="3">

</textarea>



</div>








<div class="form-group full">


<label>

خلاصه کتاب

</label>



<textarea

id="bookSummary"

rows="8">

</textarea>



</div>








<div class="form-group">


<label>

وضعیت

</label>



<select id="bookActive">



<option value="active">

فعال

</option>



<option value="inactive">

غیرفعال

</option>



</select>



</div>








</div>







</form>



</div>









<div class="modal-footer">



<button

class="btn btn-light"

id="cancelBook">


انصراف


</button>






<button

class="btn btn-primary"

id="saveBook">


ذخیره کتاب


</button>




</div>






</div>


</div>









<div id="toastContainer"></div>


<div id="globalLoader"></div>








<script src="../assets/js/core/api.js"></script>

<script src="../assets/js/core/auth.js"></script>

<script src="../assets/js/core/toast.js"></script>

<script src="../assets/js/core/loader.js"></script>

<script src="../assets/js/admin/books.js"></script>






</div>


</div>




</body>


  </html>
