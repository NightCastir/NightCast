<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>ورود NightCast با Google</title>
  <meta http-equiv="refresh" content="0;url=/login">
</head>
<body>
  <p>روش ورود NightCast فقط حساب Google است. در حال انتقال به صفحه ورود…</p>
  <script>
  (function () {
    "use strict";
    var current = new URL(window.location.href);
    var target = new URL("/login", window.location.origin);
    var next = current.searchParams.get("next");
    if (next && next.startsWith("/") && !next.startsWith("//")) {
      target.searchParams.set("next", next);
    }
    window.location.replace(target.toString());
  })();
  </script>
  <noscript><a href="/login">ورود با حساب Google</a></noscript>
</body>
</html>
