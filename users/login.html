<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>NightCast | خوش آمدید</title>

    <meta
        name="theme-color"
        content="#0b1220"
    >

    <meta
        name="color-scheme"
        content="dark"
    >

    <!-- ==========================================
         NIGHTCAST STYLES
    =========================================== -->

    <link
        rel="stylesheet"
        href="css/core.css"
    >

    <link
        rel="stylesheet"
        href="css/login.css"
    >


    <!-- ==========================================
         FONT AWESOME
    =========================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

</head>


<body>


<!-- ==========================================
     BACKGROUND
=========================================== -->

<div
    class="background-blur blur1"
    aria-hidden="true">
</div>

<div
    class="background-blur blur2"
    aria-hidden="true">
</div>



<!-- ==========================================
     AUTH LOADER
=========================================== -->

<div
    id="authLoader"
    class="auth-loader hidden"
    role="status"
    aria-live="polite"
    aria-label="در حال ورود"
>

    <div class="loader-box">

        <div
            class="loader-circle"
            aria-hidden="true">
        </div>

        <h3>
            NightCast
        </h3>

        <p id="loaderText">
            در حال اتصال...
        </p>

    </div>

</div>



<!-- ==========================================
     LOGIN PAGE
=========================================== -->

<main class="login-page">


    <section
        class="login-card"
        aria-labelledby="loginTitle"
    >


        <!-- ==================================
             HERO
        =================================== -->

        <div class="hero">


            <div
                class="brand-icon"
                aria-hidden="true"
            >

                <i class="fa-solid fa-radio"></i>

            </div>


            <h1 id="loginTitle">

                Night<span>Cast</span>

            </h1>


            <p class="hero-text">

                رادیو NightCast پلی به سوی آیندست

            </p>


        </div>



        <!-- ==================================
             GOOGLE LOGIN
             
             Browser:
             Google Identity Services

             Android:
             Native Credential Manager
        =================================== -->

        <div
            id="googleLoginButton"
            class="google-login-container"
            aria-label="ورود با Google"
        >
        </div>



        <!-- ==================================
             DIVIDER
        =================================== -->

        <div
            class="divider"
            aria-hidden="true"
        >

            <span>
                یا
            </span>

        </div>



        <!-- ==================================
             GUEST LOGIN
        =================================== -->

        <button
            id="guestLogin"
            class="btn btn-guest"
            type="button"
        >

            <i
                class="fa-solid fa-headphones"
                aria-hidden="true"
            ></i>

            <span>
                ادامه به عنوان مهمان
            </span>

        </button>



        <!-- ==================================
             LOGIN STATUS
        =================================== -->

        <div
            id="loginMessage"
            class="login-status"
            role="alert"
            aria-live="polite"
        >
        </div>



        <!-- ==================================
             FALLBACK REDIRECT
        =================================== -->

        <div
            id="redirectHelp"
            class="redirect-help hidden"
        >

            <p>
                اگر صفحه اصلی به‌صورت خودکار باز نشد:
            </p>


            <button
                type="button"
                id="goToIndexButton"
                class="btn btn-redirect"
            >

                <i
                    class="fa-solid fa-house"
                    aria-hidden="true"
                ></i>

                ورود به صفحه اصلی

            </button>

        </div>



        <!-- ==================================
             FOOTER
        =================================== -->

        <footer>

            <p>

                با ادامه، قوانین استفاده و سیاست حفظ حریم خصوصی NightCast را می‌پذیرید.

            </p>

        </footer>


    </section>


</main>



<!-- ==========================================
     GOOGLE IDENTITY SERVICES
     
     IMPORTANT:
     login.js decides whether Google Web
     authentication is used.

     Browser:
     GIS is used.

     Android:
     login.js uses native Google
     Credential Manager instead.
=========================================== -->

<script
    src="https://accounts.google.com/gsi/client"
    async
    defer
></script>



<!-- ==========================================
     NIGHTCAST LOGIN CONTROLLER
=========================================== -->

<script
    src="js/login.js"
></script>


</body>

</html>
