<section class="content-area">

</h1>



<p class="page-subtitle">

مدیریت تنظیمات اصلی NightCast

</p>



</div>

<!-- ==========================
GENERAL SETTINGS
========================== -->


<div class="card">



<div class="card-header">


<div class="card-title">

تنظیمات عمومی

</div>


</div>






<div class="form-grid">






<div class="form-group">


<label>

نام سایت

</label>



<input

type="text"

id="siteName"

value="NightCast">


</div>







<div class="form-group">


<label>

شعار سایت

</label>



<input

type="text"

id="siteSlogan"

value="پلی به سوی آینده">


</div>








<div class="form-group full">


<label>

توضیحات سایت

</label>



<textarea

id="siteDescription"

rows="4">

رادیو NightCast، پادکست‌های آموزشی و خلاصه کتاب‌ها

</textarea>



</div>







</div>



</div>









<!-- ==========================
PODCAST SETTINGS
========================== -->


<div class="card">



<div class="card-header">


<div class="card-title">

تنظیمات پادکست

</div>


</div>







<div class="form-grid">






<div class="form-group">


<label>

حداکثر حجم فایل صوتی (MB)

</label>



<input

type="number"

id="maxAudioSize"

value="100">


</div>








<div class="form-group">


<label>

فرمت مجاز صوتی

</label>



<input

type="text"

id="audioFormats"

value="mp3,wav">


</div>







<div class="form-group">


<label>

فعال بودن انتشار خودکار

</label>



<select id="autoPublish">



<option value="yes">

فعال

</option>



<option value="no">

غیرفعال

</option>



</select>



</div>







</div>



</div>


  <!-- ==========================
SECURITY SETTINGS
========================== -->


<div class="card">



<div class="card-header">


<div class="card-title">

تنظیمات امنیتی

</div>


</div>







<div class="form-grid">






<div class="form-group">


<label>

فعال بودن ثبت‌نام کاربران

</label>



<select id="allowRegister">



<option value="yes">

فعال

</option>



<option value="no">

غیرفعال

</option>



</select>



</div>








<div class="form-group">


<label>

تایم انقضای Token (روز)

</label>



<input

type="number"

id="tokenExpire"

value="30">


</div>







<div class="form-group full">


<label>

کلید API

</label>



<input

type="text"

id="apiKey"

readonly>



</div>






</div>



</div>









<!-- ==========================
ADMIN PROFILE
========================== -->


<div class="card">



<div class="card-header">


<div class="card-title">

پروفایل مدیر

</div>


</div>







<div class="form-grid">






<div class="form-group">


<label>

نام مدیر

</label>



<input

type="text"

id="adminName">


</div>








<div class="form-group">


<label>

ایمیل مدیر

</label>



<input

type="email"

id="adminEmail">


</div>







</div>



</div>









<div class="page-actions">



<button

class="btn btn-primary"

id="saveSettings">


ذخیره تنظیمات


</button>



</div>









</section>









<div id="toastContainer"></div>


<div id="globalLoader"></div>

</div>


</div>
