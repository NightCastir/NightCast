"use strict";


/*
|--------------------------------------------------------------------------
| NightCast Admin Login
|--------------------------------------------------------------------------
|
| این نسخه عمداً با API فعلی Worker کار می‌کند.
|
| فعلاً Token در LocalStorage نگهداری می‌شود چون Worker فعلی
| برای احراز هویت Dashboard به Authorization: Bearer نیاز دارد.
|
| در مرحله بعد، Session را به HttpOnly Cookie منتقل می‌کنیم.
|
|--------------------------------------------------------------------------
*/


const API_URL =
    "https://nightcast-api.tomasgermany2580.workers.dev/api/v1";


const TOKEN_KEY =
    "NightCastToken";


const USER_KEY =
    "NightCastAdminUser";


const form =
    document.getElementById("loginForm");


const usernameInput =
    document.getElementById("username");


const passwordInput =
    document.getElementById("password");


const loginBtn =
    document.getElementById("loginBtn");


const message =
    document.getElementById("message");



/*
|--------------------------------------------------------------------------
| Session موجود
|--------------------------------------------------------------------------
|
| اگر قبلاً Login شده‌ایم، مستقیماً Dashboard را باز می‌کنیم.
|
*/


(function checkExistingSession(){

    const token =
        localStorage.getItem(TOKEN_KEY);

    if(!token){

        return;

    }


    /*
    |--------------------------------------------------------------------------
    | فعلاً وجود Token را کافی نمی‌دانیم.
    | Session واقعی باید از Worker تأیید شود.
    |--------------------------------------------------------------------------
    */

    verifyExistingSession(token);

})();



async function verifyExistingSession(token){

    try{

        const controller =
            new AbortController();


        const timeout =
            setTimeout(
                () => controller.abort(),
                8000
            );


        const response =
            await fetch(

                API_URL + "/auth/me",

                {

                    method:"GET",

                    headers:{

                        "Authorization":
                            "Bearer " + token

                    },

                    cache:"no-store",

                    signal:
                        controller.signal

                }

            );


        clearTimeout(timeout);


        if(
            response.ok
        ){

            window.location.replace(
                "dashboard.html"
            );

            return;

        }


        /*
        |--------------------------------------------------------------------------
        | Token نامعتبر یا منقضی شده.
        |--------------------------------------------------------------------------
        */

        clearSession();

    }

    catch(error){

        /*
        |--------------------------------------------------------------------------
        | اگر Worker فعلی endpoint /auth/me نداشته باشد،
        | فعلاً Login را متوقف نمی‌کنیم.
        |--------------------------------------------------------------------------
        */

        console.warn(
            "Session verification failed:",
            error
        );

    }

}



form.addEventListener(
    "submit",
    handleLogin
);



async function handleLogin(event){

    event.preventDefault();


    if(loginBtn.disabled){

        return;

    }


    const username =
        usernameInput.value.trim();


    const password =
        passwordInput.value;


    /*
    |--------------------------------------------------------------------------
    | Validation
    |--------------------------------------------------------------------------
    */

    if(!username){

        showMessage(
            "نام کاربری را وارد کنید."
        );

        usernameInput.focus();

        return;

    }


    if(!password){

        showMessage(
            "رمز عبور را وارد کنید."
        );

        passwordInput.focus();

        return;

    }


    /*
    |--------------------------------------------------------------------------
    | محدود کردن طول ورودی
    |--------------------------------------------------------------------------
    */

    if(username.length > 100){

        showMessage(
            "اطلاعات ورود نامعتبر است."
        );

        return;

    }


    if(password.length > 200){

        showMessage(
            "اطلاعات ورود نامعتبر است."
        );

        return;

    }


    /*
    |--------------------------------------------------------------------------
    | Lock UI
    |--------------------------------------------------------------------------
    */

    setLoading(true);


    showMessage(
        "در حال بررسی اطلاعات ورود..."
    );


    try{


        const controller =
            new AbortController();


        const timeout =
            setTimeout(
                () => controller.abort(),
                10000
            );


        const response =
            await fetch(

                API_URL + "/auth/login",

                {

                    method:"POST",

                    headers:{

                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"

                    },

                    credentials:"include",

                    cache:"no-store",

                    signal:
                        controller.signal,

                    body:
                        JSON.stringify({

                            username:
                                username,

                            password:
                                password

                        })

                }

            );


        clearTimeout(timeout);


        let data = null;


        try{

            data =
                await response.json();

        }

        catch{

            data = null;

        }


        /*
        |--------------------------------------------------------------------------
        | Login موفق
        |--------------------------------------------------------------------------
        */

        if(
            response.ok &&
            data &&
            data.success === true &&
            typeof data.token === "string" &&
            data.token.length >= 32
        ){


            /*
            |--------------------------------------------------------------------------
            | Token قبلی را پاک می‌کنیم.
            |--------------------------------------------------------------------------
            */

            localStorage.removeItem(
                TOKEN_KEY
            );


            localStorage.removeItem(
                USER_KEY
            );


            /*
            |--------------------------------------------------------------------------
            | Token جدید
            |--------------------------------------------------------------------------
            */

            localStorage.setItem(
                TOKEN_KEY,
                data.token
            );


            /*
            |--------------------------------------------------------------------------
            | User information
            |--------------------------------------------------------------------------
            |
            | اطلاعات غیرحساس را نگه می‌داریم.
            | Password هیچ‌وقت ذخیره نمی‌شود.
            |
            */

            if(
                data.user &&
                typeof data.user === "object"
            ){

                try{

                    localStorage.setItem(
                        USER_KEY,
                        JSON.stringify({
                            id:
                                data.user.id ?? null,

                            username:
                                data.user.username ?? null,

                            full_name:
                                data.user.full_name ?? null,

                            role:
                                data.user.role ?? null
                        })
                    );

                }

                catch{

                    /*
                    | اگر ذخیره اطلاعات User شکست خورد،
                    | Session همچنان معتبر است.
                    */

                }

            }


            showMessage(
                "ورود موفق بود."
            );


            /*
            |--------------------------------------------------------------------------
            | جلوگیری از برگشت به Login
            |--------------------------------------------------------------------------
            */

            setTimeout(

                () => {

                    window.location.replace(
                        "dashboard.html"
                    );

                },

                300

            );


            return;

        }


        /*
        |--------------------------------------------------------------------------
        | Login شکست خورد
        |--------------------------------------------------------------------------
        |
        | عمداً پیام دقیق Worker را نمایش نمی‌دهیم.
        | این کار Account Enumeration را سخت‌تر می‌کند.
        |--------------------------------------------------------------------------
        */

        clearSession();


        showMessage(
            "نام کاربری یا رمز عبور اشتباه است."
        );


    }

    catch(error){


        console.error(
            "Login error:",
            error
        );


        if(
            error.name ===
            "AbortError"
        ){

            showMessage(
                "زمان اتصال به سرور به پایان رسید."
            );

        }

        else{

            showMessage(
                "ارتباط با سرور برقرار نشد."
            );

        }

    }

    finally{

        setLoading(false);

    }

}



function setLoading(isLoading){

    loginBtn.disabled =
        isLoading;


    usernameInput.disabled =
        isLoading;


    passwordInput.disabled =
        isLoading;


    loginBtn.textContent =
        isLoading
            ? "در حال ورود..."
            : "ورود";

}



function showMessage(text){

    /*
    |--------------------------------------------------------------------------
    | textContent به جای innerHTML
    |--------------------------------------------------------------------------
    | جلوگیری از XSS در پیام‌های سرور
    |--------------------------------------------------------------------------
    */

    message.textContent =
        text;

}



function clearSession(){

    localStorage.removeItem(
        TOKEN_KEY
    );


    localStorage.removeItem(
        USER_KEY
    );

}



window.addEventListener(
    "pageshow",
    () => {

        /*
        |--------------------------------------------------------------------------
        | اگر صفحه از BFCache برگشت، وضعیت Login را دوباره بررسی می‌کنیم.
        |--------------------------------------------------------------------------
        */

        const token =
            localStorage.getItem(
                TOKEN_KEY
            );


        if(
            token &&
            location.pathname.endsWith(
                "/login.html"
            )
        ){

            verifyExistingSession(
                token
            );

        }

    }
);


</script></body></html>
