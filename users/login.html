<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
NightCast | ورود
</title>


<meta name="theme-color" content="#0b1220">


<link rel="stylesheet" href="css/core.css">

<link rel="stylesheet" href="css/login.css">



<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">



</head>




<body data-theme="dark">






<!-- AUTH LOADER -->


<div id="authLoader" class="auth-loader hidden">


<div class="loader-circle"></div>


<p>
در حال اتصال به NightCast...
</p>


</div>









<main class="login-page">





<section class="login-card">







<!-- BRAND -->


<div class="login-brand">



<div class="brand-icon">

<i class="fa-solid fa-radio"></i>

</div>





<h1>

Night<span>Cast</span>

</h1>




<p>

رادیوی تجربه، یادگیری و رشد فردی

</p>



</div>









<!-- MESSAGE -->


<div class="login-message">


<h2>

خوش آمدید

</h2>



<p>

برای استفاده از امکانات NightCast وارد شوید یا به عنوان مهمان ادامه دهید.

</p>



</div>









<!-- OPEN ID -->


<button

id="openIdLogin"

class="login-openid">


<i class="fa-brands fa-google"></i>


<span>

ورود با OpenID

</span>


</button>









<div class="divider">


<span>

یا

</span>


</div>








<!-- GUEST -->


<button

id="guestLogin"

class="login-guest">


<i class="fa-solid fa-headphones"></i>


<span>

ادامه بدون ورود

</span>


</button>









<!-- FEATURES -->


<div class="login-features">





<div>

<i class="fa-solid fa-cloud"></i>

<span>
ذخیره تجربه شنیدن
</span>

</div>





<div>

<i class="fa-solid fa-download"></i>

<span>
دانلود پادکست‌ها
</span>

</div>





<div>

<i class="fa-solid fa-heart"></i>

<span>
ساخت کتابخانه شخصی
</span>

</div>







</div>








<footer>


<p>

با ورود به NightCast قوانین استفاده را می‌پذیرید.

</p>


</footer>








</section>








</main>










<script src="js/login.js"></script>




</body>


</html>
