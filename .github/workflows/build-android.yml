name: Build NightCast Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug + Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          npm install
          npx cap --version

      - name: Prepare www folder
        run: |
          mkdir -p www
          # کپی فایل‌های اصلی سایت
          cp -r index.html manifest.json service-worker.js sw.js style.css app.js favicon.ico favicon.png logo.png www/ 2>/dev/null || true
          cp -r css js assets auth users www/ 2>/dev/null || true
          cp -r .well-known www/ 2>/dev/null || true
          # کپی سایر فایل‌های html اگر وجود دارند
          find . -maxdepth 1 -name "*.html" -exec cp {} www/ \; 2>/dev/null || true
          ls -la www/

      - name: Add Android platform (if not exists)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ---------- Debug APK ----------
      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      # ---------- Release APK ----------
      - name: Decode Keystore
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > nightcast-release.keystore
            echo "Keystore decoded successfully"
          else
            echo "No keystore secret found - will build unsigned release"
          fi

      - name: Build Release APK
        run: |
          cd android
          if [ -f "../nightcast-release.keystore" ]; then
            echo "Building signed Release APK..."
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=../nightcast-release.keystore \
              -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
              -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
              -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}" \
              --stacktrace
          else
            echo "Building unsigned Release APK..."
            ./gradlew assembleRelease --stacktrace
          fi

      # ---------- Upload Artifacts ----------
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NightCast-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NightCast-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: List built APKs
        run: |
          echo "=== Built APKs ==="
          find android/app/build/outputs/apk -name "*.apk" -exec ls -lh {} \; || true
