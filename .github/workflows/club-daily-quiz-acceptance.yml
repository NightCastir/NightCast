name: NightCast Club Daily Quiz Acceptance

on:
  push:
    branches:
      - feat/listener-club-quiz-notifications
    paths:
      - 'workers/club-api.js'
      - 'data/club/daily-questions.json'
      - 'js/nightcast-quiz.js'
      - 'tests/club-daily-quiz-acceptance.cjs'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate NightCast Club Daily Quiz Acceptance
        run: node tests/club-daily-quiz-acceptance.cjs
